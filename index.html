<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<title>StudyCoach V7</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f5f7fb;
color:#111827;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif

button,input,select,textarea{

}

button{

}

.grow{

.grow b,
.grow small{

.dot{

}

.done{

}

.form{

.bar{

</style>
</head>

<body>

<div class="wrap">

<header>

<div>
<div class="brand">🎓 StudyCoach V7</div>
<div class="muted">
مشاور، برنامه‌ریز و مدیریت مطالعه • رایگان
</div>
</div>

<button onclick="settings()">⚙️</button>

</header>

<main id="app"></main>

</div>


<nav>

<button class="on" onclick="page('home',this)">
🏠<br>خانه
</button>

<button onclick="page('coach',this)">
🤖<br>مشاور
</button>

<button onclick="page('plan',this)">
📅<br>برنامه
</button>

<button onclick="page('study',this)">
⏱️<br>مطالعه
</button>

<button onclick="page('analytics',this)">
📊<br>تحلیل
</button>

<button onclick="page('tools',this)">
🧰<br>ابزار
</button>

</nav>


<script>

const KEY="StudyCoachV7";

const DEF={

profile:{
name:"",
goal:"",
examDate:"",
dailyHours:8,
theme:"light"
},

subjects:[
{id:"bio",name:"زیست",level:3},
{id:"chem",name:"شیمی",level:2},
{id:"math",name:"ریاضی",level:2},
{id:"phys",name:"فیزیک",level:3}
],

plans:[],
sessions:[],
tests:[],
mistakes:[],
reviews:[],
messages:[],
notes:[],

streak:0,
lastStudy:""

};


let D=
JSON.parse(localStorage.getItem(KEY)||"null")
||
JSON.parse(JSON.stringify(DEF));


let T={
sec:0,
run:false,
id:null
};


const $=x=>document.getElementById(x);

const save=()=>{
localStorage.setItem(KEY,JSON.stringify(D))
};

const today=()=>{
return new Date().toISOString().slice(0,10)
};


const fa=n=>
String(n).replace(
/\d/g,
x=>"۰۱۲۳۴۵۶۷۸۹"[x]
);


const fmt=m=>
`${fa(Math.floor(m/60))}:${String(Math.round(m%60)).padStart(2,"0")}`;


const esc=s=>
String(s).replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);


function studyToday(){

return D.sessions
.filter(x=>x.date===today())
.reduce((a,x)=>a+x.minutes,0)

}


function testsToday(){

return D.tests.filter(x=>x.date===today())

}


function accuracy(){

let a=testsToday();

if(!a.length)return null;

return Math.round(
a.reduce((s,x)=>s+x.accuracy,0)/a.length
)

}


function daysLeft(){

if(!D.profile.examDate)return null;

return Math.max(
0,
Math.ceil(
(new Date(D.profile.examDate)-new Date())/86400000
)
)

}


function advisor(){

let h=studyToday();

let target=D.profile.dailyHours*60;

let a=accuracy();

let open=
D.plans.filter(
x=>x.date===today()&&!x.done
);


if(!D.profile.name)

return "پروفایل را کامل کن تا مشاور شخصی فعال شود.";


if(a!==null && a<55)

return `دقت امروز ${fa(a)}٪ است؛
اول اشتباهات را تحلیل کن و سپس تست جدید بزن.`;


if(open.length)

return `اولویت بعدی:
${open[0].subject} — ${open[0].topic}`;


if(h<target*.4)

return "از هدف امروز عقب هستی؛
یک جلسه ۴۵ دقیقه‌ای شروع کن.";


if(h>=target)

return "هدف مطالعه امروز تکمیل شده؛
مرور و تحلیل را انجام بده.";


return "روند مطالعه مناسب است؛
جلسه بعدی را اجرا و نتیجه را ثبت کن.";

}


function page(p,b){

document
.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("on"));

if(b)b.classList.add("on");

let pages={
home,
coach,
plan,
study,
analytics,
tools
};

$("app").innerHTML=pages[p]();

let renders={
home:renderHome,
coach:renderCoach,
plan:renderPlan,
study:renderStudy,
analytics:renderAnalytics,
tools:renderTools
};

renders[p]();

}


function home(){

return `

<section class="card hero">

<div>

<span class="chip">FINAL V7</span>

<h2 id="hi">سلام 👋</h2>

<p id="ad"></p>

</div>

<div class="score">

<b id="pr">۰٪</b>

<small>
پیشرفت امروز
</small>

</div>

</section>


<section class="stats">

<div class="card stat">

<b id="mh"></b>

<small>
مطالعه
</small>

</div>


<div class="card stat">

<b id="tc"></b>

<small>
تست
</small>

</div>


<div class="card stat">

<b id="ac"></b>

<small>
دقت
</small>

</div>


<div class="card stat">

<b id="dl"></b>

<small>
تا آزمون
</small>

</div>

</section>


<section class="card">

<div class="head">

<h3>
📅 برنامه امروز
</h3>

<button
class="primary"
onclick="smartPlan()">

برنامه هوشمند

</button>

</div>

<div
id="plans"
class="list">
</div>

</section>


<section class="card">

<h3>
🧠 تصمیم مشاور
</h3>

<div
id="adv"
class="msg b">
</div>

</section>

`;

}


function item(x){

return `

<div class="item ${x.done?"done":""}">

<i class="dot"></i>

<div class="grow">

<b>
${esc(x.start)}
 ·
${esc(x.subject)}
</b>

<small>
${esc(x.topic)}
 ·
${fa(x.duration)}
 دقیقه
 ·
${esc(x.type)}
</small>

</div>

<button onclick="toggle('${x.id}')">

${x.done?"✓":"انجام شد"}

</button>

</div>

`;

}


function renderHome(){

let h=studyToday();

let target=D.profile.dailyHours*60;

let a=accuracy();

let l=D.plans.filter(
x=>x.date===today()
);


$("hi").textContent=
D.profile.name
?
`سلام ${esc(D.profile.name)} 👋`
:
"سلام 👋";


$("ad").textContent=advisor();

$("mh").textContent=fmt(h);

$("tc").textContent=
fa(
testsToday()
.reduce((s,x)=>s+x.count,0)
);


$("ac").textContent=
a===null
?
"—"
:
fa(a)+"٪";


$("dl").textContent=
daysLeft()===null
?
"—"
:
fa(daysLeft());


$("pr").textContent=
fa(
Math.min(
100,
Math.round(
h/Math.max(1,target)*100
)
)
)+"٪";


$("adv").textContent=advisor();


$("plans").innerHTML=
l.length
?
l.map(item).join("")
:
"<p class='muted'>برنامه‌ای ساخته نشده.</p>";

}


function toggle(id){

let x=D.plans.find(x=>x.id===id);

if(x)x.done=!x.done;

save();

renderHome();

}


function smartPlan(){

if(!D.profile.name){

settings();

return;

}


D.plans=
D.plans.filter(
x=>x.date!==today()
);


let total=
Math.max(
120,
D.profile.dailyHours*60
);


let used=0;

let now=
Math.max(
8*60,
new Date().getHours()*60+10
);


let subjects=
[...D.subjects]
.sort((a,b)=>a.level-b.level);


for(
let i=0;
used+45<=total && i<16;
i++
){

let s=
subjects[i%subjects.length];

let duration=
i<2
?
90
:
60;


if(used+duration>total)

duration=total-used;


if(duration<45)break;


let types=[
["یادگیری","مطالعه مفهومی"],
["تست","تست + تحلیل"],
["مرور","مرور فعال"],
["تست","آزمونک"]
];


let z=
types[i%types.length];


D.plans.push({

id:crypto.randomUUID(),

date:today(),

subject:s.name,

topic:z[1],

duration,

type:z[0],

start:
String(Math.floor(now/60))
.padStart(2,"0")
+
":"+
String(now%60)
.padStart(2,"0"),

done:false

});


used+=duration;

now+=duration+20;

}


save();

page(
"home",
document.querySelector("nav button")
);

}


function plan(){

return `

<section class="card">

<div class="head">

<h2>
📅 برنامه تطبیقی
</h2>

<button
class="primary"
onclick="smartPlan()">

بازسازی

</button>

</div>

<p class="muted">

برنامه بر اساس هدف مطالعه
و سطح دروس ساخته می‌شود.

</p>

<div
id="all"
class="list">
</div>

</section>


<section class="card">

<h3>
🔄 جبران عقب‌افتادگی
</h3>

<button
class="primary"
onclick="recover()">

تحلیل جبران

</button>

<div
id="rec"
class="msg b">

جلسه‌های انجام‌نشده
اولویت‌بندی می‌شوند.

</div>

</section>

`;

}


function renderPlan(){

let l=
D.plans.filter(
x=>x.date===today()
);


$("all").innerHTML=
l.length
?
l.map(item).join("")
:
"<p class='muted'>برنامه‌ای وجود ندارد.</p>";

}


function recover(){

let l=
D.plans
.filter(x=>x.date===today()&&!x.done)
.sort((a,b)=>b.duration-a.duration);


$("rec").textContent=
l.length
?
"اول انجام بده: "+
l
.slice(
0,
Math.max(
1,
Math.ceil(l.length*.6)
)
)
.map(x=>x.subject+" — "+x.topic)
.join("، ")
:
"عقب‌افتادگی ثبت‌شده‌ای وجود ندارد.";

}


function coach(){

return `

<section class="card">

<h2>
🤖 مشاور خصوصی
</h2>

<p class="muted">

مشاور داخلی بدون API پولی
و بر اساس داده‌های برنامه.

</p>

<div id="chat">
</div>


<div class="form">

<textarea
id="q"
rows="3"
placeholder="مثلاً امروز عقب افتادم، چه کنم؟">
</textarea>

<button
class="primary"
onclick="ask()">

پرسیدن

</button>

</div>

</section>

`;

}


function renderCoach(){

$("chat").innerHTML=
(
D.messages.length
?
D.messages.slice(-15)
:
[{q:"",a:advisor()}]
)
.map(m=>

(m.q
?
`<div class="msg u">
${esc(m.q)}
</div>`
:
""
)

+
`
<div class="msg b">
${esc(m.a)}
</div>
`

)
.join("");

}


function ask(){

let q=$("q").value.trim();

if(!q)return;


let open=
D.plans.filter(
x=>x.date===today()&&!x.done
);


let a;


if(
/عقب|جبران|نرسید|نخوندم/
.test(q)
){

a=
open.length
?
`همه عقب‌افتادگی را
فشرده نکن؛
${open[0].subject}
— ${open[0].topic}
را اول انجام بده.`
:
"برنامه هوشمند را بساز.";

}


else if(
/ضعف|ضعیف|کدام درس|کدوم درس/
.test(q)
){

let z=
D.subjects
.map(s=>{

let t=
D.tests.filter(
x=>x.subject===s.name
);

return [
s.name,
t.length
?
t.reduce(
(a,b)=>a+b.accuracy,
0
)/t.length
:
50
];

})
.sort((a,b)=>a[1]-b[1]);


a=
`بر اساس داده‌های فعلی،
اولویت پیشنهادی
${z[0][0]}
است.`;

}


else if(
/خسته|استراحت/
.test(q)
){

a=
"اگر خسته‌ای، یک وقفه کوتاه داشته باش؛
بعد یک جلسه کوتاه و متمرکز
شروع کن.";

}


else{

a=advisor();

}


D.messages.push({
date:today(),
q,
a
});


save();

$("q").value="";

renderCoach();

}

<select id="mc">

<option>ضعف مفهومی</option>

<option>محاسبات</option>
<option>کمبود زمان</option>

<button onclick="addMistake()">

function renderStudy(){

$("clock").textContent=clock();

}


function clock(){

return [
Math.floor(T.sec/3600),
Math.floor(T.sec/60)%60,
T.sec%60
]
.map(x=>String(x).padStart(2,"0"))
.join(":");

}


function start(){

if(T.run)return;

T.run=true;

T.id=setInterval(()=>{

T.sec++;

if($("clock"))
$("clock").textContent=clock();

},1000);

}


function pause(){

T.run=false;

clearInterval(T.id);

}


function finish(){

pause();

let m=
Math.round(T.sec/60);

if(m<1){

alert("حداقل یک دقیقه مطالعه کن.");

return;

}


D.sessions.push({

date:today(),

minutes:m,

subject:$("sub").value,

topic:$("topic").value||"مطالعه"

});


if(D.lastStudy!==today()){

D.streak++;

D.lastStudy=today();

}


T.sec=0;

save();

renderStudy();

}


function addTest(){

let c=+$("cnt").value;

let p=+$("pct").value;


if(!c||p<0||p>100){

alert("مقادیر را درست وارد کن.");

return;

}


D.tests.push({

date:today(),

subject:$("ts").value,

count:c,

accuracy:p

});


if(p<60){

D.mistakes.push({

date:today(),

subject:$("ts").value,

cause:$("cause").value,

topic:"آزمون",

reviewed:false

});

}


save();

alert("نتیجه ثبت شد.");

}


function addMistake(){

D.mistakes.push({

date:today(),

subject:$("ms").value,

cause:$("mc").value,

topic:$("mt").value||"نامشخص",

reviewed:false

});


save();

alert("اشتباه ثبت شد.");

}

function renderAnalytics(){

let all=
D.sessions
.reduce(
(a,x)=>a+x.minutes,
0
);


let n=
D.tests
.reduce(
(a,x)=>a+x.count,
0
);


let a=
D.tests.length
?
Math.round(
D.tests.reduce(
(s,x)=>s+x.accuracy,
0
)/D.tests.length
)
:
null;


$("ov").innerHTML=`

<div class="card stat">
<small>مطالعه کل</small>
<h2>${fmt(all)}</h2>
</div>

<div class="card stat">
<small>تست کل</small>
<h2>${fa(n)}</h2>
</div>

<div class="card stat">
<small>دقت کل</small>
<h2>${a===null?"—":fa(a)+"٪"}</h2>
</div>

<div class="card stat">
<small>تداوم</small>
<h2>${fa(D.streak)} روز</h2>
</div>

`;


$("subs").innerHTML=
D.subjects
.map(s=>{

let t=
D.tests.filter(
x=>x.subject===s.name
);

let aa=
t.length
?
Math.round(
t.reduce(
(a,b)=>a+b.accuracy,
0
)/t.length
)
:
0;


let m=
D.sessions
.filter(x=>x.subject===s.name)
.reduce(
(a,x)=>a+x.minutes,
0
);


return `

<p>

<b>${s.name}</b>

 ·
${aa?fa(aa)+"٪":"بدون داده"}

 ·
${fmt(m)}

</p>

<div class="bar">

<i style="width:${aa}%"></i>

</div>

`;

})
.join("");


let errors={};


D.mistakes.forEach(x=>{

errors[x.cause]=
(errors[x.cause]||0)+1;

});


$("errs").innerHTML=
Object.entries(errors)
.sort((a,b)=>b[1]-a[1])
.map(x=>
`<span class="chip">
${esc(x[0])}: ${fa(x[1])}
</span>`
)
.join("")
||
"<span class='muted'>داده‌ای وجود ندارد.</span>";


let trend=[];


for(let i=6;i>=0;i--){

let d=new Date();

d.setDate(
d.getDate()-i
);

let k=
d.toISOString()
.slice(0,10);


let m=
D.sessions
.filter(x=>x.date===k)
.reduce(
(a,x)=>a+x.minutes,
0
);


trend.push(`

<div class="item">

<div class="grow">

<b>${k}</b>

<small>
مطالعه: ${fmt(m)}
</small>

</div>

</div>

`);

}


$("trend").innerHTML=
trend.join("");

}


function tools(){

return `

<section class="card">

<h2>
🧰 ابزارها
</h2>

<div class="grid">

<button onclick="exportData()">
💾 پشتیبان‌گیری
</button>

<button onclick="$('file').click()">
📥 بازیابی
</button>

<button onclick="addNote()">
📒 یادداشت
</button>

<button onclick="review()">
🔁 مرور
</button>

<button onclick="dark()">
🌙 حالت شب
</button>

<button onclick="settings()">
⚙️ تنظیمات
</button>

</div>


<input
id="file"
type="file"
accept=".json"
hidden
onchange="importData(event)">

</section>


<section class="card">

<h3>
📒 یادداشت‌ها
</h3>

<div id="notes">
</div>

</section>


<section class="card">

<h3>
❌ دفتر اشتباهات
</h3>

<div id="mist">
</div>

</section>

`;

}


function renderTools(){

$("notes").innerHTML=
D.notes
.slice(-20)
.reverse()
.map(x=>`

<div class="item">

<div class="grow">

<b>${esc(x.title)}</b>

<small>
${esc(x.text)}
 ·
${x.date}
</small>

</div>

</div>

`)
.join("")
||
"<p class='muted'>یادداشتی وجود ندارد.</p>";


$("mist").innerHTML=
D.mistakes
.slice(-25)
.reverse()
.map(x=>{

let i=D.mistakes.indexOf(x);

return `

<div class="item">

<div class="grow">

<b>
${esc(x.subject)}
 —
${esc(x.topic)}
</b>

<small>
${esc(x.cause)}
 ·
${x.reviewed?"مرور شده":"نیازمند مرور"}
</small>

</div>

<button onclick="reviewMistake(${i})">

${x.reviewed?"✓":"مرور"}

</button>

</div>

`;

})
.join("")
||
"<p class='muted'>اشتباهی وجود ندارد.</p>";

}


function addNote(){

let title=
prompt("عنوان یادداشت؟");

let text=
prompt("متن یادداشت؟");


if(title&&text){

D.notes.push({

date:today(),

title,

text

});

save();

renderTools();

}

}


function reviewMistake(i){

if(D.mistakes[i]){

D.mistakes[i].reviewed=true;

}


D.reviews.push({

date:today(),

mistake:i

});


save();

renderTools();

}


function review(){

let n=
D.mistakes
.filter(x=>!x.reviewed)
.length;


alert(
`موارد نیازمند مرور:
${fa(n)}`
);

}


function exportData(){

let blob=
new Blob(
[
JSON.stringify(
D,
null,
2
)
],
{
type:"application/json"
}
);


let a=
document.createElement("a");


a.href=
URL.createObjectURL(blob);


a.download=
"studycoach-backup.json";


a.click();


URL.revokeObjectURL(a.href);

}


function importData(e){

let file=e.target.files[0];

if(!file)return;


let reader=
new FileReader();


reader.onload=()=>{

try{

D=
JSON.parse(
reader.result
);

save();

location.reload();

}

catch{

alert(
"فایل پشتیبان معتبر نیست."
);

}

};


reader.readAsText(file);

}


function dark(){

D.profile.theme=
D.profile.theme==="dark"
?
"light"
:
"dark";


document.body.classList.toggle(
"dark",
D.profile.theme==="dark"
);

save();

}


function settings(){

$("app").innerHTML=`

<section class="card">

<h2>
⚙️ تنظیمات
</h2>

<div class="form">

<input
id="nm"
placeholder="نام"
value="${esc(D.profile.name)}">


<input
id="goal"
placeholder="هدف اصلی"
value="${esc(D.profile.goal)}">


<label>
تاریخ آزمون
</label>


<input
id="exam"
type="date"
value="${D.profile.examDate}">


<label>
هدف مطالعه روزانه
</label>


<input
id="hrs"
type="number"
min="1"
max="18"
value="${D.profile.dailyHours}">


<button
class="primary"
onclick="saveSettings()">

ذخیره و ساخت برنامه

</button>


<button onclick="install()">

📱 نصب روی iPad

</button>


<button
class="danger"
onclick="wipe()">

حذف همه اطلاعات

</button>

</div>

</section>


<section class="card">

<h3>
📚 سطح دروس
</h3>

<p class="muted">
۱ ضعیف‌ترین و ۵ قوی‌ترین
</p>

${D.subjects.map(s=>`

<div class="item">

<div class="grow">

<b>
${s.name}
</b>

</div>

<input
style="width:75px"
type="number"
min="1"
max="5"
value="${s.level}"
onchange="level('${s.id}',this.value)">

</div>

`).join("")}

</section>

`;

}


function saveSettings(){

D.profile={

name:$("nm").value.trim(),

goal:$("goal").value.trim(),

examDate:$("exam").value,

dailyHours:+$("hrs").value||8,

theme:D.profile.theme||"light"

};


save();

smartPlan();

}


function level(id,v){

let s=
D.subjects.find(
x=>x.id===id
);


s.level=
Math.max(
1,
Math.min(
5,
+v||3
)
);


save();

}


function install(){

alert(

"برای نصب روی iPad در Safari:\n\n"+
"1. سایت را از GitHub Pages باز کن.\n"+
"2. دکمه Share را بزن.\n"+
"3. Add to Home Screen را انتخاب کن.\n"+
"4. Add را بزن."

);

}


function wipe(){

if(
confirm(
"همه اطلاعات StudyCoach حذف شود؟"
)
){

localStorage.removeItem(KEY);

location.reload();

}

}


if(
D.profile.theme==="dark"
){

document.body.classList.add("dark");

}


page(
"home",
document.querySelector("nav button")
);

</script>

</body>
</html>
