<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>StudyCoach V4</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

button,input,select,textarea{
font:inherit;
}

button{
cursor:pointer;
border:0;
}

.app{
max-width:1100px;
margin:auto;
padding:18px 14px 100px;
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
}

.brand{
font-size:23px;
font-weight:900;
}

.card{
background:white;
border-radius:20px;
padding:18px;
margin:12px 0;
box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.hero{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
background:linear-gradient(135deg,#0f172a,#334155);
color:white;
}

.hero h1{
margin:12px 0 6px;
}

.pill{
display:inline-block;
padding:6px 11px;
border-radius:999px;
background:rgba(255,255,255,.15);
font-size:12px;
}

.score{
text-align:center;
min-width:100px;
}

.score b{
display:block;
font-size:38px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.grid2{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.stat{
text-align:center;
}

.stat b{
display:block;
font-size:25px;
margin-bottom:5px;
}

.muted{
color:#64748b;
}

.head{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.primary{
background:#2563eb;
color:white;
padding:11px 16px;
border-radius:12px;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
padding:11px 16px;
border-radius:12px;
}

.danger{
background:#fee2e2;
color:#991b1b;
padding:11px 16px;
border-radius:12px;
}

.form{
display:grid;
gap:10px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #cbd5e1;
border-radius:12px;
background:white;
outline:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:#2563eb;
}

.list{
display:grid;
gap:10px;
}

.item{
display:flex;
align-items:center;
gap:10px;
padding:13px;
border:1px solid #e2e8f0;
border-radius:14px;
}

.item.done{
opacity:.5;
}

.grow{
flex:1;
}

.grow b,
.grow small{
display:block;
}

.grow small{
color:#64748b;
margin-top:5px;
}

.check{
width:22px;
height:22px;
}

.bar{
height:9px;
background:#e2e8f0;
border-radius:10px;
overflow:hidden;
}

.bar i{
display:block;
height:100%;
background:#2563eb;
}

.clock{
text-align:center;
font-size:58px;
font-weight:900;
padding:30px 10px;
letter-spacing:2px;
}

.kpi{
font-size:28px;
font-weight:900;
}

.chip{
display:inline-block;
padding:7px 11px;
border-radius:999px;
background:#e8eefc;
color:#3155b7;
margin:3px;
font-size:13px;
}

.empty{
text-align:center;
padding:25px;
color:#94a3b8;
}

.center{
text-align:center;
}

.chat{
display:grid;
gap:8px;
}

.tabs{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:100;
display:flex;
justify-content:center;
gap:4px;
background:white;
border-top:1px solid #e2e8f0;
padding:8px;
padding-bottom:calc(8px + env(safe-area-inset-bottom));
}

.tabs button{
background:none;
padding:9px 13px;
border-radius:12px;
color:#64748b;
}

.tabs button.on{
background:#eff6ff;
color:#2563eb;
font-weight:800;
}

.toast{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
background:#0f172a;
color:white;
padding:11px 17px;
border-radius:12px;
z-index:999;
display:none;
}

@media(max-width:700px){

.grid{
grid-template-columns:repeat(2,1fr);
}

.grid2{
grid-template-columns:1fr;
}

.hero{
align-items:flex-start;
}

.clock{
font-size:42px;
}

.tabs button{
font-size:11px;
padding:8px 7px;
}

}

@media(min-width:701px){

.tabs{
position:sticky;
top:0;
bottom:auto;
max-width:1100px;
margin:auto;
border:0;
background:transparent;
}

.tabs button{
background:white;
margin:3px;
}

}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<div class="app">

<div class="top">

<div class="brand">
🎓 StudyCoach <span class="muted">V4</span>
</div>

<button class="secondary" onclick="page('settings')">
⚙️
</button>

</div>

<nav class="tabs">

<button class="on" onclick="page('home',this)">
🏠 خانه
</button>

<button onclick="page('coach',this)">
🤖 مشاور
</button>

<button onclick="page('plan',this)">
📅 برنامه
</button>

<button onclick="page('study',this)">
⏱️ مطالعه
</button>

<button onclick="page('analytics',this)">
📊 تحلیل
</button>

</nav>

<main id="app"></main>

</div>

<script>

const KEY="StudyCoachV4";

const DEFAULT={

profile:{
name:"",
goal:"پزشکی تهران",
examDate:"",
dailyHours:8
},

subjects:[
{id:"bio",name:"زیست",level:3},
{id:"chem",name:"شیمی",level:2},
{id:"math",name:"ریاضی",level:2},
{id:"phys",name:"فیزیک",level:3}
],

plans:[],
sessions:[],
tests:[],
mistakes:[],
messages:[]

};

let D=load();

let TIMER={
seconds:0,
running:false,
id:null
};

let current="home";


function load(){

try{

return JSON.parse(
localStorage.getItem(KEY)
)||structuredClone(DEFAULT);

}catch(e){

return structuredClone(DEFAULT);

}

}


function save(){

localStorage.setItem(
KEY,
JSON.stringify(D)
);

}


function today(){

return new Date()
.toISOString()
.slice(0,10);

}


function fa(n){

return String(n).replace(
/\d/g,
d=>"۰۱۲۳۴۵۶۷۸۹"[d]
);

}


function formatMinutes(n){

n=Math.max(
0,
Math.round(n)
);

return fa(
Math.floor(n/60)
)
+
":"
+
String(n%60).padStart(2,"0");

}


function escapeHTML(s){

return String(s??"").replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);

}


function studyToday(){

return D.sessions
.filter(x=>x.date===today())
.reduce(
(a,x)=>a+x.minutes,
0
);

}


function testsToday(){

return D.tests
.filter(x=>x.date===today());

}


function testCountToday(){

return testsToday()
.reduce(
(a,x)=>a+x.count,
0
);

}


function accuracy(list=testsToday()){

if(!list.length)
return null;

return Math.round(
list.reduce(
(a,x)=>a+x.accuracy,
0
)/list.length
);

}


function examDays(){

if(!D.profile.examDate)
return null;

return Math.max(
0,
Math.ceil(
(
new Date(D.profile.examDate)
-
new Date()
)/86400000
)
);

}


function targetMinutes(){

return Math.max(
60,
(+D.profile.dailyHours||8)*60
);

}


function advice(){

if(!D.profile.name)

return "ابتدا پروفایل خودت را کامل کن.";

let h=studyToday();

let a=accuracy();

let open=D.plans.filter(
x=>x.date===today()&&!x.done
);

if(a!==null&&a<55)

return `دقت امروز ${fa(a)}٪ است. فعلاً حجم تست را بیشتر نکن و روی تحلیل اشتباهات تمرکز کن.`;

if(
h<targetMinutes()*.35
&&
new Date().getHours()>=12
)

return "از برنامه امروز عقب هستی. یک جلسه ۴۵ دقیقه‌ای را همین حالا شروع کن.";

if(open.length)

return `اولویت بعدی: ${open[0].subject} — ${open[0].topic}.`;

if(h>=targetMinutes()*.85)

return "هدف امروز تقریباً کامل شده. مرور اشتباهات را انجام بده.";

return "وضعیت خوب است. جلسه بعدی را شروع کن.";

}


function page(p,button){

current=p;

document
.querySelectorAll(".tabs button")
.forEach(
x=>x.classList.remove("on")
);

if(button)
button.classList.add("on");

const app=
document.getElementById("app");

if(p==="home"){

app.innerHTML=home();

renderHome();

}

if(p==="coach"){

app.innerHTML=coach();

renderCoach();

}

if(p==="plan"){

app.innerHTML=plan();

renderPlan();

}

if(p==="study"){

app.innerHTML=study();

renderStudy();

}

if(p==="analytics"){

app.innerHTML=analytics();

renderAnalytics();

}

if(p==="settings"){

app.innerHTML=settings();

}

}


function home(){

return `

<section class="card hero">

<div>

<span class="pill">
مشاور تطبیقی V4
</span>

<h1 id="hello">
سلام 👋
</h1>

<p id="advice">
</p>

</div>

<div class="score">

<b id="progress">
۰٪
</b>

<span>
پیشرفت امروز
</span>

</div>

</section>


<section class="grid">

<div class="card stat">

<b id="studyStat">
۰:۰۰
</b>

<small>
مطالعه امروز
</small>

</div>


<div class="card stat">

<b id="testStat">
۰
</b>

<small>
تست امروز
</small>

</div>


<div class="card stat">

<b id="accuracyStat">
—
</b>

<small>
دقت
</small>

</div>


<div class="card stat">

<b id="examStat">
—
</b>

<small>
تا آزمون
</small>

</div>

</section>


<section class="card">

<div class="head">

<h2>
📅 برنامه امروز
</h2>

<button
class="primary"
onclick="smartPlan()">

برنامه هوشمند

</button>

</div>

<div
id="todayPlans"
class="list">
</div>

</section>


<section class="card">

<h2>
🧠 تصمیم مشاور
</h2>

<div id="decision">
</div>

</section>

`;

}


function renderHome(){

const h=studyToday();

const target=targetMinutes();

const a=accuracy();

hello.textContent=
D.profile.name
?
`سلام ${D.profile.name} 👋`
:
"سلام 👋";

advice.textContent=
advice();

studyStat.textContent=
formatMinutes(h);

testStat.textContent=
fa(testCountToday());

accuracyStat.textContent=
a===null
?
"—"
:
fa(a)+"٪";

examStat.textContent=
examDays()===null
?
"—"
:
fa(examDays());

progress.textContent=
fa(
Math.min(
100,
Math.round(h/target*100)
)
)+"٪";

decision.textContent=
advice();


const list=
D.plans.filter(
x=>x.date===today()
);

todayPlans.innerHTML=
list.length
?

list.map(
x=>`

<div class="item ${x.done?"done":""}">

<input
class="check"
type="checkbox"
${x.done?"checked":""}
onchange="togglePlan('${x.id}')">

<div class="grow">

<b>
${escapeHTML(x.start)}
 ·
${escapeHTML(x.subject)}
</b>

<small>

${escapeHTML(x.topic)}
 ·
${fa(x.duration)}
 دقیقه
 ·
${escapeHTML(x.type)}

</small>

</div>

</div>

`
).join("")

:

`<div class="empty">
برنامه‌ای برای امروز ساخته نشده.
</div>`;

}


function uid(){

return Date.now().toString(36)
+
Math.random()
.toString(36)
.slice(2);

}


function clockTime(minutes){

return String(
Math.floor(minutes/60)%24
).padStart(2,"0")
+
":"
+
String(minutes%60)
.padStart(2,"0");

}


function smartPlan(){

if(!D.profile.name){

page("settings");

return;

}


D.plans=
D.plans.filter(
x=>x.date!==today()
);


let total=targetMinutes();

let used=0;

let now=Math.max(
8*60,
new Date().getHours()*60+5
);


const subjects=
[...D.subjects]
.sort(
(a,b)=>a.level-b.level
);


const types=[

["یادگیری","مبحث ضعیف"],

["تست","تست + تحلیل"],

["مرور","مرور فعال"]

];


let i=0;


while(
used+45<=total
&&
i<16
){

const s=
subjects[i%subjects.length];

let duration=
(
i%4===0
&&
total-used>=90
)
?
90
:
60;

if(
total-used<duration
)
duration=
total-used;

if(duration<45)
break;

const type=
types[i%types.length];

D.plans.push({

id:uid(),

date:today(),

subject:s.name,

topic:type[1],

duration,

type:type[0],

start:clockTime(now),

done:false

});

used+=duration;

now+=duration+15;

i++;

}

save();

toast("برنامه هوشمند ساخته شد");

page(current);

}


function togglePlan(id){

const p=
D.plans.find(
x=>x.id===id
);

if(!p)
return;

p.done=!p.done;

save();

if(current==="home")
renderHome();
else
renderPlan();

}


function plan(){

return `

<section class="card">

<div class="head">

<h2>
📅 برنامه تطبیقی
</h2>

<button
class="primary"
onclick="smartPlan()">

بازسازی

</button>

</div>

<p class="muted">

برنامه بر اساس ساعت هدف و سطح دروس ساخته می‌شود.

</p>

<div
id="planList"
class="list">
</div>

</section>


<section class="card">

<h3>
🔄 جبران عقب‌افتادگی
</h3>

<button
class="primary"
onclick="recovery()">

تحلیل جبرانی

</button>

<p
id="recoveryText"
class="muted">

مشاور جلسه‌های مهم‌تر را برای حفظ پیشنهاد می‌کند.

</p>

</section>

`;

}


function renderPlan(){

const list=
D.plans.filter(
x=>x.date===today()
);

planList.innerHTML=
list.length

?

list.map(
x=>`

<div class="item ${x.done?"done":""}">

<input
class="check"
type="checkbox"
${x.done?"checked":""}
onchange="togglePlan('${x.id}')">

<div class="grow">

<b>
${escapeHTML(x.start)}
 ·
${escapeHTML(x.subject)}
</b>

<small>

${escapeHTML(x.topic)}
 ·
${fa(x.duration)}
 دقیقه
 ·
${escapeHTML(x.type)}

</small>

</div>

</div>

`
).join("")

:

`<div class="empty">
برنامه‌ای نیست.
</div>`;

}


function recovery(){

const open=
D.plans.filter(
x=>x.date===today()&&!x.done
);

if(!open.length){

recoveryText.textContent=
"جلسه عقب‌افتاده‌ای وجود ندارد.";

return;

}

open.sort(
(a,b)=>b.duration-a.duration
);

const keep=
open.slice(
0,
Math.max(
1,
Math.ceil(open.length*.6)
)
);

recoveryText.textContent=
`پیشنهاد: ${
keep.map(
x=>x.subject+" — "+x.topic
).join("، ")
} را انجام بده و بقیه را به روز بعد منتقل کن.`;

}


function coach(){

return `

<section class="card">

<h2>
🤖 مشاور خصوصی
</h2>

<p class="muted">

مشاور V4 بدون API خارجی کار می‌کند و از اطلاعات ثبت‌شده روی دستگاه استفاده می‌کند.

</p>

<div id="chat"></div>

<div class="form">

<textarea
id="question"
rows="3"
placeholder="مثلاً: امروز دو ساعت عقب افتادم، چه کنم؟">
</textarea>

<button
class="primary"
onclick="ask()">

پرسیدن

</button>

</div>

</section>


<section class="card">

<h3>
⚡ سؤال‌های سریع
</h3>

<div class="grid2">

<button
class="secondary"
onclick="quickAsk('کدام درس من ضعیف‌تر است؟')">

درس ضعیف‌تر

</button>

<button
class="secondary"
onclick="quickAsk('امروز عقب افتادم')">

جبران امروز

</button>

</div>

</section>

`;

}


function renderCoach(){

const messages=
D.messages.length
?
D.messages.slice(-15)
:
[
{
q:"",
ans:advice()
}
];


chat.innerHTML=
messages.map(
m=>

(m.q
?
`
<div class="card">

<b>
شما
</b>

<p>
${escapeHTML(m.q)}
</p>

</div>
`
:
"")

+

`

<div class="card">

<b>
🤖 مشاور
</b>

<p>
${escapeHTML(m.ans)}
</p>

</div>

`

).join("");

}


function quickAsk(text){

question.value=text;

ask();

}


function ask(){

const q=
question.value.trim();

if(!q)
return;

const ans=
coachAnswer(q);

D.messages.push({

date:today(),

q,

ans

});

save();

question.value="";

renderCoach();

}


function coachAnswer(q){

const open=
D.plans.filter(
x=>x.date===today()&&!x.done
);


if(
/عقب|جبران|نرسید|نخوندم/.test(q)
){

if(open.length)

return `همه عقب‌افتادگی را یکجا فشرده نکن. اول ${open[0].subject} — ${open[0].topic} را انجام بده.`;

return "برنامه امروز ساخته نشده؛ ابتدا برنامه هوشمند را بساز.";

}


if(
/ضعف|ضعیف|کدام درس|کدوم درس/.test(q)
){

const ranking=
D.subjects
.map(
s=>{

const tests=
D.tests.filter(
x=>x.subject===s.name
);

const a=
tests.length
?
tests.reduce(
(n,v)=>n+v.accuracy,
0
)/tests.length
:
50;

return [
s.name,
a
];

}
)
.sort(
(a,b)=>a[1]-b[1]
);

return `بر اساس اطلاعات فعلی، اولویت ${ranking[0][0]} است. میانگین دقت ثبت‌شده ${fa(Math.round(ranking[0][1]))}٪ است.`;

}


if(
/امروز|چقدر|مطالعه/.test(q)
){

return `امروز ${formatMinutes(studyToday())} مطالعه و ${fa(testCountToday())} تست ثبت کرده‌ای. هدف روزانه ${fa(D.profile.dailyHours)} ساعت است.`;

}


return advice();

}

return `

<section class="card center">

<h2>
⏱️ جلسه مطالعه
</h2>

<div class="grid2">

<select id="subject">

${D.subjects.map(
s=>`<option>${escapeHTML(s.name)}</option>`

<input

<div

<input

min="0"

</option>

ضعف مفهومی
</option>

<option>
بی‌دقتی
</option>

<option>
محاسبات
</option>

<option>
کمبود زمان
</option>

<option>
فراموشی
</option>

<button

onclick="addTest()">

ثبت نتیجه

</div>

function renderStudy(){

timerClock.textContent=
timerText();

}


function timerText(){

const s=TIMER.seconds;

return [

Math.floor(s/3600),

Math.floor(s/60)%60,

s%60

]
.map(
x=>String(x).padStart(2,"0")
)
.join(":");

}


function startTimer(){

if(TIMER.running)
return;

TIMER.running=true;

TIMER.id=
setInterval(
()=>{

TIMER.seconds++;

const clock=
document.getElementById(
"timerClock"
);

if(clock)
clock.textContent=
timerText();

},
1000
);

toast("جلسه شروع شد");

}


function pauseTimer(){

TIMER.running=false;

clearInterval(TIMER.id);

toast("جلسه متوقف شد");

}


function finishTimer(){

pauseTimer();

const minutes=
Math.round(
TIMER.seconds/60
);

if(minutes<1){

alert(
"حداقل یک دقیقه مطالعه ثبت کن."
);

return;

}

D.sessions.push({

id:uid(),

date:today(),

minutes,

subject:subject.value,

topic:
topic.value.trim()
||
"مطالعه آزاد"

});

TIMER.seconds=0;

save();

renderStudy();

toast("جلسه ثبت شد");

}


function addTest(){

const count=
+testCount.value;

const acc=
+testAccuracy.value;

if(
!count
||
acc<0
||
acc>100
){

alert(
"اطلاعات تست را درست وارد کن."
);

return;

}

D.tests.push({

id:uid(),

date:today(),

subject:testSubject.value,

count,

accuracy:acc,

cause:errorCause.value

});


if(acc<60){

D.mistakes.push({

id:uid(),

date:today(),

subject:testSubject.value,

cause:errorCause.value

});

}

save();

testCount.value="";

testAccuracy.value="";

toast("نتیجه تست ثبت شد");

}

return `

function renderAnalytics(){

const totalStudy=
D.sessions.reduce(
(a,x)=>a+x.minutes,
0
);

const totalTests=
D.tests.reduce(
(a,x)=>a+x.count,
0
);

const totalAccuracy=
accuracy(D.tests);


overview.innerHTML=`

<div class="grid">

<div>

<small>
مطالعه کل
</small>

<div class="kpi">
${formatMinutes(totalStudy)}
</div>

</div>


<div>

<small>
تست کل
</small>

<div class="kpi">
${fa(totalTests)}
</div>

</div>


<div>

<small>
جلسات
</small>

<div class="kpi">
${fa(D.sessions.length)}
</div>

</div>


<div>

<small>
میانگین دقت
</small>

<div class="kpi">

${
totalAccuracy===null
?
"—"
:
fa(totalAccuracy)+"٪"
}

</div>

</div>

</div>

`;


subjectsAnalytics.innerHTML=
D.subjects.map(

s=>{

const tests=
D.tests.filter(
x=>x.subject===s.name
);

const a=
tests.length
?
Math.round(
tests.reduce(
(n,x)=>n+x.accuracy,
0
)/tests.length
)
:
0;

const minutes=
D.sessions
.filter(
x=>x.subject===s.name
)
.reduce(
(n,x)=>n+x.minutes,
0
);

return `

<p>

<b>
${escapeHTML(s.name)}
</b>

 · سطح ${fa(s.level)}

 ·

${a?fa(a)+"٪":"بدون داده"}

 ·

${formatMinutes(minutes)}

</p>

<div class="bar">

<i
style="width:${a}%">
</i>

</div>

`;

}

).join("");


const causes={};

D.mistakes.forEach(
x=>{

causes[x.cause]=
(causes[x.cause]||0)+1;

}
);


errorsAnalytics.innerHTML=
Object.entries(causes)
.sort(
(a,b)=>b[1]-a[1]
)
.map(
x=>
`
<span class="chip">
${escapeHTML(x[0])}: ${fa(x[1])}
</span>
`
)
.join(" ")
||
`<span class="muted">
هنوز خطایی ثبت نشده.
</span>`;


let rows=[];


for(let i=6;i>=0;i--){

const date=
new Date();

date.setDate(
date.getDate()-i
);

const d=
date.toISOString()
.slice(0,10);

const minutes=
D.sessions
.filter(
x=>x.date===d
)
.reduce(
(a,x)=>a+x.minutes,
0
);

rows.push(`

<div>

<small>
${d}
</small>

<div class="bar">

<i
style="width:${Math.min(
100,
minutes/targetMinutes()*100
)}%">
</i>

</div>

${formatMinutes(minutes)}

</div>

`);

}


weeklyAnalytics.innerHTML=
rows.join("");

}

function saveSettings(){

D.profile={

name:nameInput.value.trim(),

goal:goalInput.value.trim(),

examDate:examInput.value,

dailyHours:
Math.min(
18,
Math.max(
1,
+hoursInput.value||8
)
)

};

save();

smartPlan();

}


function changeLevel(id,value){

const s=
D.subjects.find(
x=>x.id===id
);

if(!s)
return;

s.level=
Math.min(
5,
Math.max(
1,
+value||3
)
);

save();

}


function backupData(){

const blob=
new Blob(
[
JSON.stringify(
D,
null,
2
)
],
{
type:"application/json"
}
);

const a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"studycoach-v4-backup.json";

a.click();

URL.revokeObjectURL(a.href);

toast(
"نسخه پشتیبان ساخته شد"
);

}


function restoreData(event){

const file=
event.target.files[0];

if(!file)
return;

const reader=
new FileReader();

reader.onload=()=>{

try{

const data=
JSON.parse(
reader.result
);

if(
!data.profile
||
!data.subjects
)
throw new Error();

D=data;

save();

toast(
"اطلاعات بازیابی شد"
);

page("home");

}catch{

alert(
"فایل پشتیبان معتبر نیست."
);

}

};

reader.readAsText(file);

}


function deleteAll(){

if(
confirm(
"همه اطلاعات برنامه پاک شود؟"
)
){

localStorage.removeItem(KEY);

location.reload();

}

}


function toast(text){

const el=
document.getElementById(
"toast"
);

el.textContent=text;

el.style.display="block";

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>{
el.style.display="none";
},
1800
);

}


page(
"home",
document.querySelector(
".tabs button"
)
);

</script>
