/*
 * فقط همین قسمت را تنظیم کن.
 *
 * API Key را می‌توانی از Google AI Studio بگیری.
 *
 * توصیه:
 * API Key را داخل GitHub قرار نده.
 */
const GEMINI_API_KEY = "";
/*
 * مدل Gemini
 *
 * Gemini 3 Flash دارای Free Tier در Gemini API است.
 */
const GEMINI_MODEL = "gemini-3-flash-preview";
const GEMINI_URL =
"https://generativelanguage.googleapis.com/v1beta/models/"
+
GEMINI_MODEL
+
":generateContent?key=";
/* =====================================================
   GET API KEY
   ===================================================== */
function getGeminiKey(){
    /*
     * اول کلید ذخیره‌شده در مرورگر
     */
    const saved =
        localStorage.getItem("STUDYCOACH_GEMINI_KEY");
    if(saved && saved.trim()){
        return saved.trim();
    }
    /*
     * اگر کلید ذخیره نشده بود،
     * مقدار داخل کد را بررسی می‌کنیم.
     */
    return GEMINI_API_KEY.trim();
}
/* =====================================================
   SAVE API KEY
   ===================================================== */
function saveGeminiAPI(){
    const input =
        document.getElementById("geminiApiKey");
    if(!input){
        return;
    }
    const key =
        input.value.trim();
    if(!key){
        toast("API Key را وارد کن");
        return;
    }
    localStorage.setItem(
        "STUDYCOACH_GEMINI_KEY",
        key
    );
    updateGeminiStatus();
    toast(
        "Gemini API Key ذخیره شد ✅"
    );
}

}
/* =====================================================
   GEMINI API
   ===================================================== */
async function callGemini(messages){
    const key =
        getGeminiKey();
    if(!key){
        throw new Error(
            "Gemini API Key وارد نشده است."
        );
    }
    /*
     * تبدیل پیام‌های StudyCoach
     * به ساختار Gemini
     */
    const contents =
        messages.map(message => {
            let text =
                message.content || "";
            return {
                role:
                    message.role === "assistant"
                    ?
                    "model"
                    :
                    "user",
                parts:[
                    {
                        text:text
                    }
                ]
            };
        });
    const response =
        await fetch(
            GEMINI_URL + encodeURIComponent(key),
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:
                JSON.stringify({
                    contents:contents,
                    generationConfig:{
                        temperature:0.7,
                        maxOutputTokens:4000
                    }
                })
            }
        );
    const raw =
        await response.text();
    let data;
    try{
        data =
            JSON.parse(raw);
    }catch{
        throw new Error(
            "پاسخ نامعتبر از Gemini دریافت شد."
        );
    }
    if(!response.ok){
        const errorMessage =
            data?.error?.message ||
            `HTTP ${response.status}`;
        throw new Error(
            errorMessage
        );
    }
    const answer =
        data
        ?.candidates?.[0]
        ?.content?.parts
        ?.map(
            part => part.text || ""
        )
        ?.join("")
        ?.trim();
    if(!answer){
        throw new Error(
            "Gemini پاسخ متنی ارسال نکرد."
        );
    }
    return answer;
}

/* =====================================================
   STATUS
   ===================================================== */
function setGeminiStatus(online){
    const elements = [
        [
            "dashDot",
            "dashStatus"
        ],
        [
            "aiDot",
            "aiStatus"
        ],
        [
            "settingsDot",
            "settingsStatus"
        ]
    ];
    elements.forEach(
        pair => {
            const dot =
                document.getElementById(
                    pair[0]
                );
            const text =
                document.getElementById(
                    pair[1]
                );
            if(dot){
                dot.classList.toggle(
                    "online",
                    online
                );
            }
            if(text){
                text.textContent =
                    online
                    ?
                    "Gemini متصل است"
                    :
                    "Gemini آفلاین";
            }
        }
    );
}
/* =====================================================
   UPDATE SETTINGS
   ===================================================== */
function updateGeminiStatus(){
    const key =
        getGeminiKey();
    const input =
        document.getElementById(
            "geminiApiKey"
        );
    if(input && key){
        input.value =
            key;
    }
    setGeminiStatus(
        false
    );
}
/* =====================================================

        <h3>
            🤖 اتصال رایگان Gemini

        <p class="muted">
            StudyCoach اکنون می‌تواند
            به Gemini متصل شود.

        text.textContent =
            online
