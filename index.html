<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyCoach">
<title>StudyCoach V5 Ultimate</title>

<style>
:root{
--bg:#f4f7fb;
--card:#fff;
--text:#0f172a;
--muted:#64748b;
--line:#e2e8f0;
--primary:#2563eb;
--primary2:#1d4ed8;
--soft:#eff6ff;
--success:#16a34a;
--warning:#f59e0b;
--danger:#dc2626;
--shadow:0 8px 30px rgba(15,23,42,.07);
}

*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:var(--bg);
color:var(--text);
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Tahoma,
sans-serif;
}

body.dark{
--bg:#020617;
--card:#0f172a;
--text:#f8fafc;
--muted:#94a3b8;
--line:#1e293b;
--soft:#172554;
--shadow:0 8px 30px rgba(0,0,0,.25);
}

button,input,select,textarea{
font:inherit;
}

button{
border:0;
cursor:pointer;
}

input,select,textarea{
width:100%;
padding:13px;
border:1px solid var(--line);
background:var(--card);
color:var(--text);
border-radius:14px;
outline:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:var(--primary);
}

button.primary{
background:var(--primary);
color:#fff;
padding:11px 16px;
border-radius:13px;
}

button.primary:hover{
background:var(--primary2);
}

button.secondary{
background:var(--line);
color:var(--text);
padding:11px 16px;
border-radius:13px;
}

button.danger{
background:#fee2e2;
color:#991b1b;
padding:11px 16px;
border-radius:13px;
}

body.dark button.danger{
background:#450a0a;
color:#fecaca;
}

button.small{
padding:7px 10px;
border-radius:10px;
font-size:12px;
}

.app{
max-width:1200px;
margin:auto;
padding:14px 14px 110px;
}

.header{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:12px;
}

.logo{
font-size:22px;
font-weight:950;
}

.logo span{
color:var(--primary);
}

.header-actions{
display:flex;
gap:7px;
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:22px;
padding:18px;
margin:12px 0;
box-shadow:var(--shadow);
}

.hero{
background:
linear-gradient(
135deg,
#0f172a,
#1e3a8a
);
color:white;
border:0;
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.hero h1{
margin:10px 0 6px;
font-size:28px;
}

.hero p{
margin:0;
opacity:.85;
line-height:1.8;
}

.pill{
display:inline-block;
padding:6px 11px;
background:rgba(255,255,255,.15);
border-radius:999px;
font-size:12px;
}

.hero-score{
text-align:center;
min-width:110px;
}

.hero-score b{
display:block;
font-size:42px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.grid2{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.grid3{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.stat{
text-align:center;
}

.stat-value{
font-size:28px;
font-weight:950;
}

.stat-label{
display:block;
margin-top:5px;
font-size:13px;
color:var(--muted);
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:12px;
}

.section-head h2,
.section-head h3{
margin:0;
}

.muted{
color:var(--muted);
}

.center{
text-align:center;
}

.list{
display:grid;
gap:10px;
}

.item{
display:flex;
align-items:center;
gap:11px;
padding:13px;
border:1px solid var(--line);
border-radius:15px;
background:var(--card);
}

.item.done{
opacity:.48;
}

.item-main{
flex:1;
min-width:0;
}

.item-main b,
.item-main small{
display:block;
}

.item-main small{
margin-top:5px;
color:var(--muted);
line-height:1.6;
}

.check{
width:21px;
height:21px;
accent-color:var(--primary);
}

.progress{
height:9px;
background:var(--line);
border-radius:99px;
overflow:hidden;
margin-top:8px;
}

.progress i{
display:block;
height:100%;
background:var(--primary);
border-radius:99px;
}

.chip{
display:inline-block;
padding:6px 10px;
margin:3px;
border-radius:999px;
background:var(--soft);
color:var(--primary);
font-size:12px;
}

.advice{
padding:14px;
border-radius:15px;
background:var(--soft);
line-height:1.9;
}

.timer{
font-size:58px;
font-weight:950;
letter-spacing:2px;
padding:24px 5px;
}

.timer-mode{
display:flex;
justify-content:center;
gap:7px;
margin-bottom:10px;
}

.timer-mode button{
padding:8px 12px;
border-radius:10px;
background:var(--line);
color:var(--text);
}

.timer-mode button.active{
background:var(--primary);
color:white;
}

.chat{
display:grid;
gap:10px;
margin-bottom:15px;
}

.msg{
padding:13px;
border-radius:15px;
line-height:1.8;
}

.msg.user{
background:var(--soft);
}

.msg.bot{
background:var(--line);
}

.chart{
display:flex;
align-items:end;
gap:8px;
height:190px;
padding:15px 5px 0;
border-bottom:1px solid var(--line);
}

.chart-col{
flex:1;
height:100%;
display:flex;
flex-direction:column;
justify-content:end;
align-items:center;
gap:5px;
}

.chart-bar{
width:100%;
max-width:42px;
min-height:3px;
background:var(--primary);
border-radius:8px 8px 0 0;
}

.chart-col small{
font-size:10px;
color:var(--muted);
}

.badge{
display:inline-flex;
align-items:center;
gap:5px;
padding:7px 10px;
background:#fef3c7;
color:#92400e;
border-radius:12px;
font-size:12px;
margin:3px;
}

body.dark .badge{
background:#422006;
color:#fde68a;
}

.empty{
padding:28px;
text-align:center;
color:var(--muted);
}

.form{
display:grid;
gap:10px;
}

.row{
display:flex;
gap:8px;
align-items:center;
}

.grow{
flex:1;
}

.bottom-nav{
position:fixed;
z-index:100;
left:0;
right:0;
bottom:0;
display:flex;
justify-content:center;
gap:3px;
background:rgba(255,255,255,.94);
border-top:1px solid var(--line);
backdrop-filter:blur(15px);
padding:8px;
padding-bottom:calc(8px + env(safe-area-inset-bottom));
}

body.dark .bottom-nav{
background:rgba(2,6,23,.94);
}

.bottom-nav button{
background:transparent;
color:var(--muted);
padding:8px 12px;
border-radius:12px;
font-size:12px;
}

.bottom-nav button.active{
background:var(--soft);
color:var(--primary);
font-weight:900;
}

.toast{
position:fixed;
z-index:999;
top:15px;
left:50%;
transform:translateX(-50%);
background:#0f172a;
color:white;
padding:11px 17px;
border-radius:12px;
display:none;
max-width:90%;
text-align:center;
}

.modal{
position:fixed;
inset:0;
z-index:500;
background:rgba(0,0,0,.55);
display:none;
align-items:center;
justify-content:center;
padding:15px;
}

.modal-box{
background:var(--card);
color:var(--text);
border-radius:22px;
padding:20px;
width:min(600px,100%);
max-height:90vh;
overflow:auto;
}

@media(max-width:800px){

.grid{
grid-template-columns:repeat(2,1fr);
}

.grid3{
grid-template-columns:1fr;
}

.hero{
align-items:flex-start;
}

}

@media(max-width:600px){

.app{
padding-left:10px;
padding-right:10px;
}

.card{
padding:15px;
border-radius:18px;
}

.hero{
flex-direction:column;
}

.hero-score{
align-self:center;
}

.grid2{
grid-template-columns:1fr;
}

.timer{
font-size:43px;
}

.bottom-nav button{
font-size:10px;
padding:8px 7px;
}

}

@media(min-width:801px){

.bottom-nav{
position:sticky;
top:0;
bottom:auto;
max-width:1200px;
margin:0 auto 12px;
border:0;
background:transparent;
backdrop-filter:none;
}

.bottom-nav button{
background:var(--card);
border:1px solid var(--line);
}

}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<div class="app">

<header class="header">

<div class="logo">
🎓 Study<span>Coach</span>
<small>V5</small>
</div>

<div class="header-actions">

<button
class="secondary small"
onclick="toggleDark()">
🌙
</button>

<button
class="secondary small"
onclick="navigate('settings')">
⚙️
</button>

</div>

</header>

<nav class="bottom-nav">

<button data-page="home" onclick="navigate('home')">
🏠<br>خانه
</button>

<button data-page="coach" onclick="navigate('coach')">
🤖<br>مشاور
</button>

<button data-page="plan" onclick="navigate('plan')">
📅<br>برنامه
</button>

<button data-page="study" onclick="navigate('study')">
⏱️<br>مطالعه
</button>

<button data-page="analytics" onclick="navigate('analytics')">
📊<br>تحلیل
</button>

<button data-page="more" onclick="navigate('more')">
☰<br>بیشتر
</button>

</nav>

<main id="app"></main>

</div>

<script>

/* =====================================================
   STUDYCOACH V5
   OFFLINE / FREE / NO API
===================================================== */

const KEY="StudyCoachV5_DATA";
const THEME_KEY="StudyCoachV5_THEME";

const DEFAULT_DATA={
profile:{
name:"",
goal:"پزشکی تهران",
examDate:"",
dailyHours:8,
wake:"07:00",
sleep:"24:00"
},

subjects:[
{id:"bio",name:"زیست",level:3},
{id:"chem",name:"شیمی",level:2},
{id:"math",name:"ریاضی",level:2},
{id:"phys",name:"فیزیک",level:3}
],

topics:[],

plans:[],

sessions:[],

tests:[],

mistakes:[],

reviews:[],

goals:[],

messages:[],

achievements:[],

settings:{
pomodoro:25,
shortBreak:5,
longBreak:15
}
};

let D=loadData();

let STATE={
page:"home",
timer:{
seconds:0,
running:false,
mode:"study",
interval:null
}
};


/* =========================
   STORAGE
========================= */

function loadData(){

try{

const saved=
JSON.parse(
localStorage.getItem(KEY)
);

if(!saved)
return structuredClone(DEFAULT_DATA);

return mergeData(
structuredClone(DEFAULT_DATA),
saved
);

}catch{

return structuredClone(DEFAULT_DATA);

}

}


function mergeData(base,saved){

for(const key in saved){

if(
saved[key]!==undefined &&
saved[key]!==null
){

if(
typeof saved[key]==="object" &&
!Array.isArray(saved[key]) &&
typeof base[key]==="object"
){

base[key]={
...base[key],
...saved[key]
};

}else{

base[key]=saved[key];

}

}

}

return base;

}


function save(){

localStorage.setItem(
KEY,
JSON.stringify(D)
);

}


/* =========================
   UTILITIES
========================= */

function uid(){

return Date.now().toString(36)+
Math.random().toString(36).slice(2);

}


function today(){

return new Date()
.toISOString()
.slice(0,10);

}


function fa(value){

return String(value)
.replace(
/\d/g,
d=>"۰۱۲۳۴۵۶۷۸۹"[d]
);

}


function esc(value){

return String(value??"")
.replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);

}


function fmtMinutes(minutes){

minutes=Math.max(
0,
Math.round(minutes)
);

const h=
Math.floor(minutes/60);

const m=
minutes%60;

return h
?
`${fa(h)} ساعت ${fa(m)} دقیقه`
:
`${fa(m)} دقیقه`;

}


function shortTime(minutes){

return String(
Math.floor(minutes/60)%24
).padStart(2,"0")
+
":"
+
String(minutes%60).padStart(2,"0");

}


function toast(text){

const el=
document.getElementById("toast");

el.textContent=text;

el.style.display="block";

clearTimeout(window.__toast);

window.__toast=setTimeout(
()=>{
el.style.display="none";
},
1800
);

}


function clamp(n,min,max){

return Math.min(
max,
Math.max(min,n)
);

}


/* =========================
   CALCULATIONS
========================= */

function studyMinutes(date=today()){

return D.sessions
.filter(x=>x.date===date)
.reduce(
(a,x)=>a+(+x.minutes||0),
0
);

}


function testsFor(date=today()){

return D.tests
.filter(x=>x.date===date);

}


function testCount(date=today()){

return testsFor(date)
.reduce(
(a,x)=>a+(+x.count||0),
0
);

}


function accuracy(list=testsFor()){

if(!list.length)
return null;

return Math.round(
list.reduce(
(a,x)=>a+(+x.accuracy||0),
0
)/list.length
);

}


function targetMinutes(){

return Math.max(
60,
(+D.profile.dailyHours||8)*60
);

}


function examDays(){

if(!D.profile.examDate)
return null;

return Math.max(
0,
Math.ceil(
(
new Date(D.profile.examDate)
-
new Date()
)/86400000
)
);

}


function completion(){

return Math.min(
100,
Math.round(
studyMinutes()/
targetMinutes()*
100
)
);

}


function streak(){

let count=0;

for(
let i=0;
i<365;
i++
){

const d=new Date();

d.setDate(
d.getDate()-i
);

const key=
d.toISOString()
.slice(0,10);

if(studyMinutes(key)>0)
count++;
else
break;

}

return count;

}


function averageSubjectAccuracy(subject){

const list=
D.tests.filter(
x=>x.subject===subject
);

return accuracy(list);

}


function weakestSubject(){

const values=
D.subjects.map(
s=>{

const a=
averageSubjectAccuracy(s.name);

return {
name:s.name,
score:a===null?50:a
};

}
);

values.sort(
(a,b)=>a.score-b.score
);

return values[0];

}


/* =========================
   NAVIGATION
========================= */

function navigate(page){

STATE.page=page;

document
.querySelectorAll(".bottom-nav button")
.forEach(
b=>{
b.classList.toggle(
"active",
b.dataset.page===page
);
}
);

const app=
document.getElementById("app");

if(page==="home"){
app.innerHTML=homeView();
renderHome();
}

else if(page==="coach"){
app.innerHTML=coachView();
renderCoach();
}

else if(page==="plan"){
app.innerHTML=planView();
renderPlan();
}

else if(page==="study"){
app.innerHTML=studyView();
renderStudy();
}

else if(page==="analytics"){
app.innerHTML=analyticsView();
renderAnalytics();
}

else if(page==="more"){
app.innerHTML=moreView();
renderMore();
}

else if(page==="settings"){
app.innerHTML=settingsView();
}

}


/* =========================
   HOME
========================= */

function homeView(){

return`

<section class="card hero">

<div>

<span class="pill">
مشاور تطبیقی آفلاین V5
</span>

<h1 id="hello">
سلام 👋
</h1>

<p id="heroAdvice">
پروفایل را تکمیل کن.
</p>

</div>

<div class="hero-score">

<b id="heroProgress">
۰٪
</b>

<span>
پیشرفت امروز
</span>

</div>

</section>


<section class="grid">

<div class="card stat">

<div
id="statStudy"
class="stat-value">
۰
</div>

<span class="stat-label">
مطالعه امروز
</span>

</div>


<div class="card stat">

<div
id="statTests"
class="stat-value">
۰
</div>

<span class="stat-label">
تست امروز
</span>

</div>


<div class="card stat">

<div
id="statAccuracy"
class="stat-value">
—
</div>

<span class="stat-label">
دقت امروز
</span>

</div>


<div class="card stat">

<div
id="statExam"
class="stat-value">
—
</div>

<span class="stat-label">
تا آزمون
</span>

</div>

</section>


<section class="card">

<div class="section-head">

<h2>
📅 برنامه امروز
</h2>

<button
class="primary"
onclick="generateSmartPlan()">

ساخت برنامه

</button>

</div>

<div
id="homePlans"
class="list">
</div>

</section>


<section class="card">

<div class="section-head">

<h2>
🧠 تصمیم مشاور
</h2>

</div>

<div
id="homeDecision"
class="advice">
</div>

</section>


<section class="grid3">

<div class="card center">

<div class="stat-value">
🔥 <span id="streakValue">۰</span>
</div>

<div class="stat-label">
روز پشت‌سرهم
</div>

</div>


<div class="card center">

<div class="stat-value">
⭐ <span id="xpValue">۰</span>
</div>

<div class="stat-label">
امتیاز
</div>

</div>


<div class="card center">

<div class="stat-value">
🏆 <span id="badgeValue">۰</span>
</div>

<div class="stat-label">
دستاورد
</div>

</div>

</section>

`;

}


function renderHome(){

const name=
D.profile.name||"دانش‌آموز";

hello.textContent=
`سلام ${esc(name)} 👋`;

heroAdvice.textContent=
offlineAdvice();

heroProgress.textContent=
fa(completion())+"٪";

statStudy.textContent=
fmtMinutes(studyMinutes());

statTests.textContent=
fa(testCount());

const a=accuracy();

statAccuracy.textContent=
a===null?"—":fa(a)+"٪";

statExam.textContent=
examDays()===null
?
"—"
:
fa(examDays());

streakValue.textContent=
fa(streak());

xpValue.textContent=
fa(xp());

badgeValue.textContent=
fa(unlockedAchievements().length);

const plans=
D.plans.filter(
x=>x.date===today()
);

homePlans.innerHTML=
plans.length
?
plans.map(
planItemHTML
).join("")
:
`
<div class="empty">
هنوز برنامه‌ای برای امروز وجود ندارد.
<br><br>
<button
class="primary"
onclick="generateSmartPlan()">
ساخت برنامه هوشمند
</button>
</div>
`;

homeDecision.innerHTML=
offlineAdvice();

}


/* =========================
   OFFLINE ADVISER
========================= */

function offlineAdvice(){

if(!D.profile.name)
return"ابتدا پروفایل را کامل کن تا مشاور بتواند تصمیم‌های شخصی‌تری بگیرد.";

const study=
studyMinutes();

const target=
targetMinutes();

const a=
accuracy();

const open=
D.plans.filter(
x=>x.date===today()&&!x.done
);

const weak=
weakestSubject();

if(
a!==null &&
a<50
){

return`
دقت امروز فقط <b>${fa(a)}٪</b> است.
افزایش حجم تست فعلاً اولویت ندارد.
اول اشتباهاتت را تحلیل کن و همان مباحث را مرور کن.
`;

}

if(
study<target*.3 &&
new Date().getHours()>=13
){

return`
تا این لحظه ${fmtMinutes(study)} مطالعه ثبت شده
در حالی که هدف روزانه ${fa(D.profile.dailyHours)} ساعت است.
الان یک جلسه ${fa(45)} دقیقه‌ای شروع کن.
`;

}

if(open.length){

return`
جلسه بعدی پیشنهادی:
<b>${esc(open[0].subject)}</b>
—
${esc(open[0].topic)}.
`;

}

if(
weak.score<60
){

return`
ضعیف‌ترین درس فعلی:
<b>${esc(weak.name)}</b>.
بهتر است یک جلسه یادگیری و سپس تست تحلیلی برای آن قرار دهی.
`;

}

if(
study>=target*.85
){

return`
بیش از ۸۵٪ هدف امروز را انجام داده‌ای.
به‌جای افزایش فشار، مرور اشتباهات و جمع‌بندی را انجام بده.
`;

}

function generateSmartPlan(){

if(!D.profile.name){

navigate("settings");

toast("ابتدا پروفایل را کامل کن");

return;

}

D.plans=
D.plans.filter(
x=>x.date!==today()
);

const total=
targetMinutes();

let used=0;

let start=
Math.max(
8*60,
new Date().getHours()*60+5
);

const subjects=
[...D.subjects]
.sort(
(a,b)=>{

const aa=
averageSubjectAccuracy(a.name);

const bb=
averageSubjectAccuracy(b.name);

const scoreA=
(aa===null?50:aa)
+
a.level*5;

const scoreB=
(bb===null?50:bb)
+
b.level*5;

return scoreA-scoreB;

}
);

const modes=[

["یادگیری","مبحث ضعیف",75],

["تست","تست + تحلیل",60],

["مرور","مرور فعال",45],

["تست","تست زمان‌دار",60]

];

let i=0;

while(
used+45<=total &&
i<24
){

const s=
subjects[i%subjects.length];

const mode=
modes[i%modes.length];

let duration=
mode[2];

if(
total-used<duration
)
duration=
total-used;

if(duration<45)
break;

D.plans.push({

id:uid(),

date:today(),

subject:s.name,

topic:mode[1],

duration,

type:mode[0],

start:shortTime(start),

done:false

});

used+=duration;

start+=duration+15;

i++;

}

save();

toast("برنامه هوشمند ساخته شد");

navigate(STATE.page);

}


function togglePlan(id){

const p=
D.plans.find(
x=>x.id===id
);

if(!p)return;

p.done=!p.done;

save();

navigate(STATE.page);

}


function deletePlan(id){

D.plans=
D.plans.filter(
x=>x.id!==id
);

save();

navigate(STATE.page);

}


function recovery(){

const open=
D.plans.filter(
x=>x.date===today()&&!x.done
);

if(!open.length){

recoveryResult.textContent=
"هیچ جلسه عقب‌افتاده‌ای وجود ندارد.";

return;

}

open.sort(
(a,b)=>b.duration-a.duration
);

const keep=
open.slice(
0,
Math.max(
1,
Math.ceil(open.length*.6)
)
);

recoveryResult.innerHTML=
`
<b>جلسه‌های مهم:</b><br>
${keep.map(
x=>esc(x.subject)+" — "+esc(x.topic)
).join("<br>")}
<br><br>
این جلسه‌ها را انجام بده و بقیه را به روز بعد منتقل کن.
`;

}

function addTest(){

const count=
+document.getElementById("testCount").value||0;

const correct=
+document.getElementById("testCorrect").value||0;

const wrong=
+document.getElementById("testWrong").value||0;

const blank=
+document.getElementById("testBlank").value||0;

if(count<1){

alert("تعداد تست را وارد کن.");

return;

}

const actual=
correct+wrong+blank;

if(actual>count){

alert(
"مجموع درست، غلط و نزده نمی‌تواند بیشتر از تعداد تست باشد."
);

return;

}

const percentage=
Math.round(
(correct/count)*100
);

const subject=
document.getElementById("testSubject").value;

const cause=
document.getElementById("errorCause").value;

D.tests.push({

id:uid(),

date:today(),

subject,

count,

correct,

wrong,

blank,

accuracy:percentage,

cause

});

if(
wrong>0 &&
cause!=="بدون مشکل خاص"
){

D.mistakes.push({

id:uid(),

date:today(),

subject,

cause,

count:wrong

});

}

save();

addXP(
count
);

document.getElementById("testCount").value="";
document.getElementById("testCorrect").value="";
document.getElementById("testWrong").value="";
document.getElementById("testBlank").value="";

toast(
`نتیجه ثبت شد: ${fa(percentage)}٪`
);

}

اگر هنوز برنامه نساخته‌ای، از بخش «برنامه» برنامه هوشمند بساز.
`;

}

return`
همه عقب‌افتادگی را فشرده نکن.
اول این جلسه را انجام بده:
<b>${esc(open[0].subject)} — ${esc(open[0].topic)}</b>.
`;

}

if(
/چقدر|هدف|مطالعه/.test(q)
){

return`
امروز تا الان
<b>${fmtMinutes(studyMinutes())}</b>
مطالعه ثبت کرده‌ای.
هدف:
<b>${fa(D.profile.dailyHours)} ساعت</b>.
`;

}

if(
/تست|درصد|دقت/.test(q)
){

const a=accuracy();

return a===null
?
"هنوز تستی ثبت نکرده‌ای."
:
`میانگین دقت امروز ${fa(a)}٪ است.`;

}

return offlineAdvice();

}

function backupData(){

const blob=
new Blob(
[
JSON.stringify(
D,
null,
2
)
],
{
type:"application/json"
}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"StudyCoach-V5-Backup.json";

document.body.appendChild(a);

a.click();

a.remove();

URL.revokeObjectURL(url);

toast("نسخه پشتیبان آماده شد");

}


function restoreData(event){

const file=
event.target.files[0];

if(!file)
return;

const reader=
new FileReader();

reader.onload=()=>{

try{

const parsed=
JSON.parse(
reader.result
);

if(
!parsed.profile ||
!parsed.subjects
){

throw new Error();

}

D=mergeData(
structuredClone(DEFAULT_DATA),
parsed
);

save();

toast("اطلاعات بازیابی شد");

navigate("home");

}catch{

alert(
"فایل پشتیبان معتبر نیست."
);

}

};

reader.readAsText(file);

}

/* =========================
   SERVICE WORKER
   OPTIONAL LOCAL CACHE
========================= */

if(
"serviceWorker" in navigator
&&
location.protocol!=="file:"
){

const sw=`

const CACHE="studycoach-v5-cache";

self.addEventListener(
"install",
event=>{
event.waitUntil(
caches.open(CACHE)
.then(
cache=>cache.addAll(["./"])
)
);
self.skipWaiting();
}
);

self.addEventListener(
"activate",
event=>{
event.waitUntil(
self.clients.claim()
);
}
);

self.addEventListener(
"fetch",
event=>{
event.respondWith(
caches.match(event.request)
.then(
cached=>
cached||
fetch(event.request)
.then(
response=>{
const copy=response.clone();

caches.open(CACHE)
.then(
cache=>cache.put(
event.request,
copy
)
);

return response;

}
)
)
);
}
);

`;

try{

const blob=
new Blob(
[sw],
{type:"text/javascript"}
);

const url=
URL.createObjectURL(blob);

navigator.serviceWorker
.register(url)
.catch(
()=>{}
);

}catch{}

}
