<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#4f46e5">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta
  name="apple-mobile-web-app-title"
  content="StudyCoach"
>

<title>StudyCoach V5 Ultimate</title>

<style>

:root{
    --bg:#f4f7fb;
    --surface:#ffffff;
    --surface2:#f8fafc;
    --text:#111827;
    --muted:#64748b;
    --border:#e2e8f0;

    --primary:#4f46e5;
    --primary2:#7c3aed;

    --success:#059669;
    --warning:#d97706;
    --danger:#dc2626;
    --info:#0284c7;

    --shadow:
      0 10px 30px rgba(15,23,42,.07);

    --radius:18px;
}

[data-theme="dark"]{
    --bg:#090e1b;
    --surface:#111827;
    --surface2:#172033;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#263247;

    --shadow:
      0 10px 30px rgba(0,0,0,.28);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Tahoma,
      Arial,
      sans-serif;

    min-height:100vh;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

input,
select,
textarea{
    outline:none;
}

button:active{
    transform:scale(.98);
}

.hidden{
    display:none!important;
}

/* =====================================================
   LAYOUT
===================================================== */

.app{
    min-height:100vh;
    display:flex;
}

.sidebar{
    position:fixed;

    top:0;
    right:0;
    bottom:0;

    width:270px;

    background:var(--surface);

    border-left:
      1px solid var(--border);

    padding:18px;

    overflow-y:auto;

    z-index:100;
}

.main{
    margin-right:270px;

    width:
      calc(100% - 270px);

    min-height:100vh;

    padding:24px;

    max-width:1700px;
}

/* =====================================================
   LOGO
===================================================== */

.logo{
    padding:10px 8px 18px;
}

.logo-main{
    font-size:23px;
    font-weight:950;
    letter-spacing:-.5px;
}

.logo-sub{
    margin-top:5px;
    font-size:11px;
    color:var(--muted);
}

/* =====================================================
   NAV
===================================================== */

.nav-section{
    margin-top:16px;
}

.nav-label{
    color:var(--muted);
    font-size:10px;
    font-weight:900;
    padding:7px 10px;
}

.nav{
    display:grid;
    gap:5px;
}

.nav button{
    width:100%;

    border:0;

    background:transparent;

    color:var(--text);

    text-align:right;

    padding:11px 12px;

    border-radius:12px;

    transition:.2s;
}

.nav button:hover{
    background:rgba(79,70,229,.08);
}

.nav button.active{
    background:
      linear-gradient(
        135deg,
        rgba(79,70,229,.15),
        rgba(124,58,237,.08)
      );

    color:var(--primary);

    font-weight:900;
}

/* =====================================================
   TOPBAR
===================================================== */

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:20px;
}

.page-title{
    margin:0;
    font-size:26px;
    font-weight:950;
}

.top-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

/* =====================================================
   BUTTONS
===================================================== */

.btn{
    border:0;

    border-radius:11px;

    padding:10px 15px;

    color:white;

    background:
      linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
      );

    font-weight:850;

    transition:.2s;
}

.btn.secondary{
    background:var(--surface);

    color:var(--text);

    border:
      1px solid var(--border);
}

.btn.success{
    background:var(--success);
}

.btn.warning{
    background:var(--warning);
}

.btn.danger{
    background:var(--danger);
}

.btn.info{
    background:var(--info);
}

.btn.small{
    padding:7px 10px;
    font-size:12px;
}

/* =====================================================
   CARDS
===================================================== */

.card{
    background:var(--surface);

    border:
      1px solid var(--border);

    border-radius:var(--radius);

    padding:18px;

    box-shadow:var(--shadow);
}

.hero{
    color:#fff;

    background:
      linear-gradient(
        135deg,
        #312e81,
        #7c3aed,
        #4f46e5
      );

    border:0;
}

.hero .muted{
    color:#ddd;
}

/* =====================================================
   GRID
===================================================== */

.grid{
    display:grid;
    gap:15px;
}

.g2{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
}

.g3{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
}

.g4{
    grid-template-columns:
      repeat(4,minmax(0,1fr));
}

/* =====================================================
   STATS
===================================================== */

.stat-card{
    min-height:145px;
}

.stat-label{
    color:var(--muted);
    font-size:13px;
}

.stat-number{
    margin-top:5px;

    font-size:31px;

    font-weight:950;
}

.stat-foot{
    margin-top:6px;

    color:var(--muted);

    font-size:12px;
}

/* =====================================================
   PROGRESS
===================================================== */

.progress{
    width:100%;

    height:9px;

    background:
      var(--border);

    border-radius:999px;

    overflow:hidden;
}

.progress > span{
    display:block;

    height:100%;

    border-radius:999px;

    background:
      linear-gradient(
        90deg,
        var(--primary),
        var(--primary2)
      );
}

/* =====================================================
   FORM
===================================================== */

.form{
    display:grid;
    gap:12px;
}

.form label{
    display:block;

    font-size:13px;

    font-weight:850;
}

.form input,
.form select,
.form textarea{
    width:100%;

    margin-top:6px;

    padding:11px 12px;

    color:var(--text);

    background:var(--surface2);

    border:
      1px solid var(--border);

    border-radius:11px;
}

.form textarea{
    min-height:110px;
    resize:vertical;
}

.form-row{
    display:grid;

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:10px;
}

/* =====================================================
   SECTION
===================================================== */

.section{
    margin-top:18px;
}

.section-title{
    margin:0 0 13px;

    font-size:18px;

    font-weight:950;
}

.muted{
    color:var(--muted);
}

.small{
    font-size:12px;
}

/* =====================================================
   ROW
===================================================== */

.row{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

.wrap{
    flex-wrap:wrap;
}

/* =====================================================
   CHIPS
===================================================== */

.chips{
    display:flex;

    flex-wrap:wrap;

    gap:7px;
}

.chip{
    display:inline-flex;

    align-items:center;

    padding:6px 10px;

    border-radius:999px;

    background:
      rgba(79,70,229,.10);

    color:var(--primary);

    font-size:12px;

    font-weight:850;
}

/* =====================================================
   LIST
===================================================== */

.list{
    display:grid;

    gap:9px;
}

.item{
    padding:12px;

    background:var(--surface2);

    border:
      1px solid var(--border);

    border-radius:13px;
}

/* =====================================================
   BADGES
===================================================== */

.badge{
    display:inline-block;

    padding:5px 8px;

    border-radius:8px;

    font-size:11px;

    font-weight:900;
}

.badge.success{
    background:rgba(5,150,105,.12);
    color:var(--success);
}

.badge.warning{
    background:rgba(217,119,6,.12);
    color:var(--warning);
}

.badge.danger{
    background:rgba(220,38,38,.12);
    color:var(--danger);
}

.badge.info{
    background:rgba(2,132,199,.12);
    color:var(--info);
}

/* =====================================================
   TABLE
===================================================== */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;

    border-collapse:collapse;
}

th,
td{
    padding:11px;

    border-bottom:
      1px solid var(--border);

    text-align:right;

    white-space:nowrap;

    font-size:13px;
}

th{
    color:var(--muted);

    font-weight:900;
}

/* =====================================================
   TIMER
===================================================== */

.timer-card{
    text-align:center;
}

.timer{
    font-size:75px;

    line-height:1;

    font-weight:950;

    letter-spacing:2px;

    margin:25px 0;
}

.timer-mode{
    color:var(--muted);

    font-size:13px;

    font-weight:800;
}

/* =====================================================
   CALENDAR
===================================================== */

.calendar{
    display:grid;

    grid-template-columns:
      repeat(7,1fr);

    gap:6px;
}

.calendar-head{
    padding:8px;

    text-align:center;

    color:var(--muted);

    font-size:12px;

    font-weight:900;
}

.calendar-day{
    min-height:90px;

    padding:8px;

    background:var(--surface2);

    border:
      1px solid var(--border);

    border-radius:11px;
}

.calendar-day.today{
    border:
      2px solid var(--primary);
}

.activity{
    margin-top:5px;

    font-size:10px;

    color:var(--muted);
}

/* =====================================================
   MOBILE NAV
===================================================== */

.mobile-nav{
    display:none;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;

    inset:0;

    background:
      rgba(0,0,0,.55);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:18px;

    z-index:500;
}

.modal-box{
    width:min(760px,100%);

    max-height:90vh;

    overflow:auto;

    background:var(--surface);

    border-radius:20px;

    padding:20px;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    left:20px;

    bottom:20px;

    max-width:350px;

    padding:12px 16px;

    background:#111827;

    color:#fff;

    border-radius:12px;

    z-index:1000;

    opacity:0;

    transform:translateY(15px);

    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;

    transform:none;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:950px){

    .sidebar{
        display:none;
    }

    .main{
        margin:0;

        width:100%;

        padding:
          15px 15px 90px;
    }

    .mobile-nav{
        position:fixed;

        right:0;
        left:0;
        bottom:0;

        height:70px;

        display:flex;

        justify-content:
          space-around;

        align-items:center;

        background:var(--surface);

        border-top:
          1px solid var(--border);

        z-index:200;
    }

    .mobile-nav button{
        border:0;

        background:transparent;

        color:var(--muted);

        font-size:10px;
    }

    .mobile-nav button b{
        display:block;

        font-size:19px;

        margin-bottom:2px;
    }

    .g4{
        grid-template-columns:
          repeat(2,minmax(0,1fr));
    }

    .g3{
        grid-template-columns:1fr;
    }

    .g2{
        grid-template-columns:1fr;
    }

    .form-row{
        grid-template-columns:1fr;
    }

    .topbar{
        align-items:flex-start;
    }

    .page-title{
        font-size:21px;
    }

    .timer{
        font-size:52px;
    }

    .calendar-day{
        min-height:65px;
    }

}

/* =====================================================
   VERY SMALL
===================================================== */

@media(max-width:480px){

    .g4{
        grid-template-columns:1fr;
    }

    .stat-number{
        font-size:27px;
    }

    .calendar{
        gap:3px;
    }

    .calendar-day{
        padding:5px;

        min-height:55px;

        font-size:11px;
    }

}

</style>
</head>

<body>

<div id="toast" class="toast"></div>

<div class="app">

<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

    <div class="logo">

        <div class="logo-main">
            🎓 StudyCoach V5
        </div>

        <div class="logo-sub">
            Ultimate Personal Study Coach
        </div>

    </div>

    <div class="nav-section">

        <div class="nav-label">
            اصلی
        </div>

        <div
          id="sidebarMainNav"
          class="nav">
        </div>

    </div>

    <div class="nav-section">

        <div class="nav-label">
            مدیریت
        </div>

        <div class="nav">

            <button onclick="openSettings()">
                ⚙️ تنظیمات
            </button>

            <button onclick="exportBackup()">
                💾 پشتیبان‌گیری
            </button>

            <button
              onclick="
                document
                .getElementById('importFile')
                .click()
              ">
                📥 بازیابی
            </button>

        </div>

    </div>

</aside>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">

    <header class="topbar">

        <h1
          id="pageTitle"
          class="page-title">
            داشبورد
        </h1>

        <div class="top-actions">

            <button
              class="btn secondary"
              onclick="toggleTheme()">
                🌓
            </button>

            <button
              class="btn"
              onclick="go('study')">
                ＋ ثبت مطالعه
            </button>

        </div>

    </header>


    <div id="page"></div>

</main>

</div>


<!-- =====================================================
     MOBILE NAV
===================================================== -->

<nav
  id="mobileNav"
  class="mobile-nav">
</nav>


<!-- =====================================================
     FILE INPUT
===================================================== -->

<input
  id="importFile"
  type="file"
  accept="application/json"
  class="hidden"
  onchange="importBackup(event)"
>


<!-- =====================================================
     MODAL
===================================================== -->

<div
  id="modal"
  class="modal hidden"
  onclick="
    if(event.target===this)
      closeModal()
  ">

    <div
      id="modalBox"
      class="modal-box">
    </div>

</div>


<script>

/* =====================================================
   STUDYCOACH V5
   DATABASE
===================================================== */

"use strict";

const STORAGE_KEY =
    "studycoach-v5-ultimate";

const SUBJECTS = [

    {
        id:"bio",
        name:"زیست‌شناسی",
        icon:"🧬"
    },

    {
        id:"chem",
        name:"شیمی",
        icon:"🧪"
    },

    {
        id:"math",
        name:"ریاضی",
        icon:"📐"
    },

    {
        id:"phys",
        name:"فیزیک",
        icon:"⚡"
    },

    {
        id:"final",
        name:"دروس نهایی",
        icon:"📚"
    }

];

const PAGES = [

    ["dashboard","🏠","داشبورد"],

    ["advisor","🤖","مشاور هوشمند"],

    ["planner","📅","برنامه‌ریز"],

    ["study","📖","مطالعه"],

    ["tests","📝","تست"],

    ["reviews","🔄","مرور"],

    ["subjects","📚","دروس"],

    ["resources","📦","منابع"],

    ["exams","🎯","آزمون‌ها"],

    ["analytics","📊","گزارش‌ها"],

    ["focus","⏱️","Focus"],

    ["calendar","🗓️","تقویم"],

    ["tasks","✅","کارها"],

    ["notes","📝","یادداشت‌ها"]

];

const DEFAULT_DB = {

    version:5,

    profile:{

        name:"دانش‌آموز",

        target:
            "پزشکی دانشگاه تهران",

        examDate:"",

        dailyGoal:8,

        start:"05:00"

    },

    studies:[],

    tests:[],

    reviews:[],

    resources:[],

    exams:[],

    tasks:[],

    notes:[],

    plans:[],

    settings:{

        theme:"light",

        aiEndpoint:"",

        aiKey:"",

        aiModel:""

    },

    focus:{

        total:1500,

        seconds:1500,

        running:false

    }

};

let db =
    loadDatabase();

let currentPage =
    "dashboard";

let timerInterval =
    null;


/* =====================================================
   DATABASE HELPERS
===================================================== */

function clone(obj){

    return JSON.parse(
        JSON.stringify(obj)
    );

}

function mergeObjects(
    base,
    source
){

    for(
        const key in source
    ){

        if(

            source[key] &&
            typeof source[key]==="object" &&
            !Array.isArray(source[key]) &&
            base[key]

        ){

            base[key] =
                mergeObjects(
                    base[key],
                    source[key]
                );

        }else{

            base[key] =
                source[key];

        }

    }

    return base;

}

function loadDatabase(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!saved){

            return clone(
                DEFAULT_DB
            );

        }

        return mergeObjects(
            clone(DEFAULT_DB),
            JSON.parse(saved)
        );

    }catch(error){

        console.error(error);

        return clone(
            DEFAULT_DB
        );

    }

}

function saveDatabase(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(db)
        );

    }catch(error){

        console.error(
            "Storage error:",
            error
        );

    }

}

function uid(){

    return (

        Date.now()
        .toString(36)

        +

        Math.random()
        .toString(36)
        .slice(2)

    );

}

function today(){

    return new Date()
        .toISOString()
        .slice(0,10);

}

function formatMinutes(
    minutes
){

    minutes =
        Math.round(
            Number(minutes)||0
        );

    const h =
        Math.floor(
            minutes/60
        );

    const m =
        minutes%60;

    if(h===0){

        return `${m} دقیقه`;

    }

    if(m===0){

        return `${h} ساعت`;

    }

    return `${h} ساعت و ${m} دقیقه`;

}

function percent(
    a,
    b
){

    if(!b)
        return 0;

    return Math.round(
        Number(a)/Number(b)*100
    );

}

function subjectName(
    id
){

    const subject =
        SUBJECTS.find(
            x=>x.id===id
        );

    return subject
        ? `${subject.icon} ${subject.name}`
        : "عمومی";

}

function escapeHTML(
    value
){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        char => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[char])
    );

}

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(
        ()=>{
            toast.classList.remove(
                "show"
            );
        },
        2200
    );

}


/* =====================================================
   STUDY STATISTICS
===================================================== */

function studyMinutes(
    date=null
){

    return db.studies
        .filter(
            item =>
                !date ||
                item.date===date
        )
        .reduce(
            (sum,item)=>
                sum+
                Number(
                    item.minutes||0
                ),
            0
        );

}

function testStats(
    date=null
){

    const tests =
        db.tests.filter(
            item =>
                !date ||
                item.date===date
        );

    const total =
        tests.reduce(
            (sum,item)=>
                sum+
                Number(
                    item.total||0
                ),
            0
        );

    const correct =
        tests.reduce(
            (sum,item)=>
                sum+
                Number(
                    item.correct||0
                ),
            0
        );

    const wrong =
        tests.reduce(
            (sum,item)=>
                sum+
                Number(
                    item.wrong||0
                ),
            0
        );

    const blank =
        tests.reduce(
            (sum,item)=>
                sum+
                Number(
                    item.blank||0
                ),
            0
        );

    const negative =
        total
        ? Math.round(
            (
                correct -
                wrong/3
            )
            /
            total
            *
            100
        )
        : 0;

    return {

        count:tests.length,

        total,

        correct,

        wrong,

        blank,

        accuracy:
            percent(
                correct,
                total
            ),

        negative

    };

}

function streak(){

    let count=0;

    const date =
        new Date();

    for(
        let i=0;
        i<3650;
        i++
    ){

        const key =
            date.toISOString()
            .slice(0,10);

        const studied =
            studyMinutes(key)>0;

        const tested =
            testStats(key).total>0;

        if(
            studied ||
            tested
        ){

            count++;

            date.setDate(
                date.getDate()-1
            );

        }else{

            break;

        }

    }

    return count;

}


/* =====================================================
   SUBJECT ANALYTICS
===================================================== */

function subjectStats(
    id
){

    const studies =
        db.studies.filter(
            x=>x.subject===id
        );

    const tests =
        db.tests.filter(
            x=>x.subject===id
        );

    const minutes =
        studies.reduce(
            (sum,x)=>
                sum+
                Number(
                    x.minutes||0
                ),
            0
        );

    const total =
        tests.reduce(
            (sum,x)=>
                sum+
                Number(
                    x.total||0
                ),
            0
        );

    const correct =
        tests.reduce(
            (sum,x)=>
                sum+
                Number(
                    x.correct||0
                ),
            0
        );

    const wrong =
        tests.reduce(
            (sum,x)=>
                sum+
                Number(
                    x.wrong||0
                ),
            0
        );

    return {

        minutes,

        tests:total,

        correct,

        wrong,

        accuracy:
            percent(
                correct,
                total
            ),

        negative:
            total
            ?
            Math.round(
                (
                    correct -
                    wrong/3
                )
                /
                total
                *
                100
            )
            :0

    };

}

function riskScore(
    id
){

    const stats =
        subjectStats(id);

    let risk=0;

    if(
        stats.tests===0
    ){

        risk+=40;

    }else{

        risk +=
            Math.max(
                0,
                60-stats.accuracy
            )*.65;

    }

    if(
        stats.tests<50
    ){

        risk+=18;

    }

    if(
        stats.minutes<300
    ){

        risk+=12;

    }

    const last =
        db.studies
        .filter(
            x=>x.subject===id
        )
        .sort(
            (a,b)=>
                b.date.localeCompare(
                    a.date
                )
        )[0];

    if(!last){

        risk+=15;

    }else{

        const days =
            (
                Date.now() -
                new Date(
                    last.date+
                    "T00:00:00"
                )
            )
            /
            86400000;

        if(days>2){

            risk +=
                Math.min(
                    15,
                    (days-2)*3
                );

        }

    }

    return Math.min(
        100,
        Math.round(risk)
    );

}

function weakestSubject(){

    return SUBJECTS
        .map(
            s=>({

                ...s,

                risk:
                    riskScore(
                        s.id
                    )

            })
        )
        .sort(
            (a,b)=>
                b.risk-a.risk
        )[0];

}

===================================================== */

function generateAdvice(){

    const messages=[];

    const weak =
        weakestSubject();

    const todayStudy =
        studyMinutes(
            today()
        );

    const dailyGoal =
        Number(
            db.profile.dailyGoal||8
        )*60;

    const todayTests =
        testStats(
            today()
        );

    const dueReviews =
        db.reviews.filter(
            x =>
                x.next &&
                x.next<=today()
        ).length;


    if(
        todayStudy <
        dailyGoal
    ){

        messages.push(
            `امروز ${formatMinutes(
                dailyGoal-todayStudy
            )} از هدف مطالعه باقی مانده است.`
        );

    }else{

        messages.push(
            "هدف مطالعه امروز کامل شده است. 👏"
        );

    }


    if(weak){

        messages.push(
            `اولویت فعلی: ${weak.icon} ${weak.name} با شاخص نیاز به مداخله ${weak.risk}/100.`
        );

    }


    if(
        todayTests.total===0
    ){

        messages.push(
            "امروز هنوز تستی ثبت نشده؛ یک مجموعه تست آموزشی یا زمان‌دار انجام بده."
        );

    }else if(
        todayTests.accuracy<50
    ){

        messages.push(
            "دقت تست‌های امروز پایین است؛ قبل از افزایش حجم تست، غلط‌ها را تحلیل کن."
        );

    }


    if(
        dueReviews>0
    ){

        messages.push(
            `${dueReviews} مرور سررسید شده داری. مرورها را عقب نینداز.`
        );

    }


    return messages.join(
        "\n"
    );

}

function negativePercent(
    correct,
    wrong,
    total
){

    if(!total)
        return 0;

    return Math.round(
        (
            Number(correct)-
            Number(wrong)/3
        )
        /
        Number(total)
        *
        100
    );

}

/* =====================================================
   SMART PLAN ENGINE
===================================================== */

function generatePlan(
    date
){

    const goal =
        Number(
            document.getElementById(
                "planGoal"
            )?.value ||
            db.profile.dailyGoal ||
            8
        );

    const totalMinutes =
        Math.max(
            60,
            goal*60
        );

    const sortedSubjects =
        SUBJECTS
        .map(
            subject => {

                const stats =
                    subjectStats(
                        subject.id
                    );

                const risk =
                    riskScore(
                        subject.id
                    );

                return {

                    ...subject,

                    risk,

                    stats

                };

            }
        )
        .sort(
            (a,b)=>
                b.risk-a.risk
        );


    const sessions=[];

    let remaining =
        totalMinutes;

    let currentMinutes =
        timeToMinutes(
            document.getElementById(
                "planStart"
            )?.value ||
            db.profile.start ||
            "05:00"
        );


    /*
      جلسات 75 دقیقه‌ای
      با استراحت‌های کوتاه
    */

    let subjectIndex=0;

    while(
        remaining>0 &&
        sessions.length<12
    ){

        const subject =
            sortedSubjects[
                subjectIndex %
                sortedSubjects.length
            ];

        const duration =
            Math.min(
                75,
                remaining
            );

        const start =
            minutesToTime(
                currentMinutes
            );

        const end =
            minutesToTime(
                currentMinutes+
                duration
            );


        let type =
            subject.risk>60
            ? "آموزش + تست آموزشی"
            :
            subject.risk>35
            ? "مطالعه + تست"
            : "تست زمان‌دار + مرور";


        let topic =
            subject.stats.tests===0
            ? "آموزش تشخیصی و مباحث پایه"
            :
            subject.risk>60
            ? "رفع ضعف‌های اصلی"
            :
            "تثبیت و تست";


        sessions.push({

            subject:
                subject.id,

            topic,

            minutes:
                duration,

            start,

            end,

            type

        });


        currentMinutes +=
            duration;


        /*
          استراحت بین جلسات
        */

        if(
            remaining>duration
        ){

            currentMinutes +=
                sessions.length%3===0
                ? 30
                : 15;

        }


        remaining -=
            duration;

        subjectIndex++;

    }


    return {

        date,

        totalMinutes:
            totalMinutes-
            Math.max(
                0,
                remaining
            ),

        sessions

    };

}


function createSmartPlan(){

    const date =
        document.getElementById(
            "planDate"
        )?.value ||
        today();

    const plan =

    db.plans.push({

}


/* =====================================================
   TIME HELPERS
===================================================== */

function timeToMinutes(
    value
){

    const parts =
        String(value)
        .split(":")
        .map(Number);

    return (
        (parts[0]||0)*60+
        (parts[1]||0)
    );

}

function minutesToTime(
    minutes
){

    minutes =
        ((minutes%1440)+1440)
        %1440;

    const h =
        Math.floor(
            minutes/60
        );

    const m =
        minutes%60;

    return (
        String(h).padStart(2,"0")+
        ":"+
        String(m).padStart(2,"0")
    );

}

function addReview(){

        ).value.trim();

        showToast(
            "نام مبحث را وارد کن."
        );

        return;

    }


    const level =
        Number(
            document.getElementById(
                "reviewLevel"
            ).value
        );

        document.getElementById(
            "reviewDate"
        ).value ||
        today();


    db.reviews.push({

        id:uid(),

        subject:
            document.getElementById(
                "reviewSubject"
            ).value,

        topic,

        level,

        created:
            date,

        next:
            date,

        interval:
            1

    });


    saveDatabase();

    showToast(
        "مبحث وارد سیستم مرور شد 🔄"
    );

    render();

}


function completeReview(
    id
){

    const item =
        db.reviews.find(
            x=>x.id===id
        );

    if(!item)
        return;


    /*
      الگوریتم ساده تطبیقی:
      تسلط بیشتر → فاصله بیشتر
    */

    const intervals = {

        1:1,

        2:2,

        3:4,

        4:7,

        5:14

    };


    const base =
        intervals[
            item.level
        ] || 4;


    item.interval =
        Math.max(
            1,
            Math.round(
                (
                    item.interval ||
                    1
                ) *
                (
                    base/2
                )
            )
        );


    /*
      محدود کردن رشد غیرمنطقی
    */

    item.interval =
        Math.min(
            item.interval,
            90
        );


    const next =
        new Date();

    next.setDate(
        next.getDate()+
        item.interval
    );


    item.next =
        next
        .toISOString()
        .slice(0,10);


    saveDatabase();

    showToast(
        `مرور انجام شد؛ مرور بعدی ${item.next}`
    );

    render();

}

function renderCalendar(){

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        now.getMonth();

    const first =
        new Date(
            year,
            month,
            1
        );

    const last =
        new Date(
            year,
            month+1,
            0
        );


    const offset =
        (first.getDay()+1)%7;


    let cells=[];


    for(
        let i=0;
        i<offset;
        i++
    ){

        cells.push(
            `<div></div>`
        );

    }


    for(
        let day=1;
        day<=last.getDate();
        day++
    ){

        const date =
            new Date(
                year,
                month,
                day
            )
            .toISOString()
            .slice(0,10);


        const minutes =
            studyMinutes(
                date
            );

        const tests =
            testStats(
                date
            );


        cells.push(`

            <div
              class="
                calendar-day
                ${
                    date===today()
                    ?"today"
                    :""
                }
              ">

                <b>
                    ${day}
                </b>

                ${
                    minutes
                    ?
                    `
                        <div class="activity">
                            📖
                            ${formatMinutes(
                                minutes
                            )}
                        </div>
                    `
                    :""
                }

                ${
                    tests.total
                    ?
                    `
                        <div class="activity">
                            📝
                            ${tests.total}
                            تست
                        </div>
                    `
                    :""
                }

            </div>

        `);

    }


    return `

        <div class="card">

            <div class="row">

                <h2>
                    🗓️ تقویم
                </h2>

                <span class="badge info">

                    ${year}/
                    ${String(
                        month+1
                    ).padStart(2,"0")}

                </span>

            </div>


            <div class="calendar">

                <div class="calendar-head">
                    شنبه
                </div>

                <div class="calendar-head">
                    یکشنبه
                </div>

                <div class="calendar-head">
                    دوشنبه
                </div>

                <div class="calendar-head">
                    سه‌شنبه
                </div>

                <div class="calendar-head">
                    چهارشنبه
                </div>

                <div class="calendar-head">
                    پنجشنبه
                </div>

                <div class="calendar-head">
                    جمعه

    `;

                          )}">

                      class="btn"
                      onclick="setFocusTime()">

                        اعمال

                    </button>

                </div>


                <div class="section">

                    <div class="stat-label">
                        مجموع Focus ثبت‌شده
                    </div>

                    <div class="stat-number">

                        ${formatMinutes(
                            db.focus.total/60
                        )}

                    </div>

                </div>

            </div>

        </div>

    `;

function updateTimerDisplay(){

    const el =
        document.getElementById(
            "timerDisplay"
        );

    if(!el)
        return;


    const seconds =
        Math.max(
            0,
            Number(
                db.focus.seconds||0
            )
        );


    const min =
        Math.floor(
            seconds/60
        );

    const sec =
        seconds%60;


    el.textContent =
        String(min).padStart(2,"0")+
        ":"+
        String(sec).padStart(2,"0");

}


function startTimer(){

    if(timerInterval)
        return;


    db.focus.running =
        true;


    timerInterval =
        setInterval(
            ()=>{

                if(
                    db.focus.seconds<=0
                ){

                    clearInterval(
                        timerInterval
                    );

                    timerInterval =
                        null;

                    db.focus.running =
                        false;

                    db.focus.total +=
                        Number(
                            db.focus.sessionSeconds ||
                            0
                        );

                    saveDatabase();

                    showToast(
                        "جلسه Focus تمام شد 🎉"
                    );

                    render();

                    return;

                }


                db.focus.seconds--;

                db.focus.sessionSeconds =
                    Number(
                        db.focus.sessionSeconds||0
                    )+1;


                updateTimerDisplay();

            },
            1000
        );

}


function pauseTimer(){

    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }


    db.focus.running =
        false;

    saveDatabase();

}


function resetTimer(){

    pauseTimer();

    db.focus.seconds =
        Number(
            db.focus.totalDuration ||
            db.focus.total ||
            1500
        );

    /*
      برای جلوگیری از استفاده اشتباه
      زمان پیش‌فرض 25 دقیقه است.
    */

    if(
        !db.focus.seconds ||
        db.focus.seconds>10800
    ){

        db.focus.seconds =
            1500;

    }


    db.focus.sessionSeconds =
        0;

    saveDatabase();

    render();

}


function setFocusTime(){

    pauseTimer();

    const minutes =
        Number(
            document.getElementById(
                "focusMinutes"
            ).value
        );


    if(
        !minutes ||
        minutes<1 ||
        minutes>180
    ){

        showToast(
            "زمان باید بین ۱ تا ۱۸۰ دقیقه باشد."
        );

        return;

    }


    db.focus.seconds =
        minutes*60;

    db.focus.sessionSeconds =
        0;

    db.focus.currentDuration =
        minutes*60;

    saveDatabase();

    render();

}

/* =====================================================
   WEEKLY TEXT CHART
===================================================== */

function weeklyChart(){

    const days=[];

    const now =
        new Date();


    for(
        let i=6;
        i>=0;
        i--
    ){

        const date =
            new Date();

        date.setDate(
            now.getDate()-i
        );


        const key =
            date.toISOString()
            .slice(0,10);


        days.push({

            date:key,

            minutes:
                studyMinutes(key),

            tests:
                testStats(key).total

        });

    }


    const max =
        Math.max(
            60,
            ...days.map(
                x=>x.minutes
            )
        );


    return `

        <div class="list">

            ${
                days.map(
                    item=>`

                        <div>

                            <div class="row">

                                <span>
                                    ${item.date}
                                </span>

                                <span class="muted">
                                    ${formatMinutes(
                                        item.minutes
                                    )}
                                    •
                                    ${item.tests}
                                    تست
                                </span>

                            </div>

                            <div
                              class="progress"
                              style="
                                margin-top:5px
                              ">

                                <span
                                  style="
                                    width:${Math.min(
                                        100,
                                        item.minutes/max*100
                                    )}%
                                  ">
                                </span>

                            </div>

                        </div>

                    `
                ).join("")
            }

        </div>

    `;

}

function exportBackup(){

    const data =
        JSON.stringify(
            db,
            null,
            2
        );


    const blob =
        new Blob(
            [data],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );

    a.href =
        url;

    a.download =
        "studycoach-backup-" +
        today()+
        ".json";


    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(
        url
    );


    showToast(
        "فایل پشتیبان ساخته شد 💾"
    );

}


function importBackup(
    event
){

    const file =
        event.target.files[0];

    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function(){

            try{

                const imported =
                    JSON.parse(
                        reader.result
                    );


                if(
                    !imported ||
                    typeof imported!=="object"
                ){

                    throw new Error(
                        "Invalid backup"
                    );

                }


                db =
                    mergeObjects(
                        clone(
                            DEFAULT_DB
                        ),
                        imported
                    );


                saveDatabase();

                showToast(
                    "پشتیبان با موفقیت بازیابی شد."
                );

                render();

            }catch(error){

                console.error(error);

                showToast(
                    "فایل پشتیبان معتبر نیست."
                );

            }

        };


    reader.readAsText(
        file
    );


    event.target.value =
        "";

}

function extractAIText(
    data
){

    if(
        data?.choices?.[0]?.message?.content
    ){

        return data
            .choices[0]
            .message
            .content;

    }


    if(
        data?.choices?.[0]?.text
    ){

        return data
            .choices[0]
            .text;

    }


    if(
        typeof data?.output==="string"
    ){

        return data.output;

    }


    if(
        data?.response
    ){

        return String(
            data.response
        );

    }


    return JSON.stringify(
        data,
        null,
        2
    );

}

/* =========================================================
   ADVANCED STUDY ENGINE
   ========================================================= */

function subjectStats(subjectId){

    const study =
        db.studySessions.filter(
            x => x.subject === subjectId
        );

    const tests =
        db.tests.filter(
            x => x.subject === subjectId
        );

    const minutes =
        study.reduce(
            (sum,x)=>
                sum + Number(x.minutes || 0),
            0
        );

    const total =
        tests.reduce(
            (sum,x)=>
                sum + Number(x.total || 0),
            0
        );

    const correct =
        tests.reduce(
            (sum,x)=>
                sum + Number(x.correct || 0),
            0
        );

    const wrong =
        tests.reduce(
            (sum,x)=>
                sum + Number(x.wrong || 0),
            0
        );

    const negative =
        total
        ? Math.max(
            0,
            ((correct - wrong/3) / total) * 100
        )
        : 0;

    const accuracy =
        total
        ? (correct / total) * 100
        : 0;

    return {

        minutes,

        tests: total,

        correct,

        wrong,

        unanswered:
            Math.max(
                0,
                total - correct - wrong
            ),

        accuracy:
            Math.round(
                accuracy
            ),

        negative:
            Math.round(
                negative
            )

    };

}


/* =========================================================
   RISK ENGINE
   ========================================================= */

function riskScore(subjectId){

    const stats =
        subjectStats(
            subjectId
        );

    let score = 50;


    if(stats.tests === 0)
        score += 25;

    if(stats.accuracy < 40)
        score += 30;

    else if(stats.accuracy < 60)
        score += 20;

    else if(stats.accuracy < 75)
        score += 10;

    else
        score -= 10;


    if(stats.minutes < 120)
        score += 15;

    else if(stats.minutes > 600)
        score -= 10;


    const subject =
        SUBJECTS.find(
            x=>x.id===subjectId
        );


    if(subject?.priority === "high")
        score += 10;


    return Math.max(
        0,
        Math.min(
            100,
            Math.round(score)
        )
    );

}


/* =========================================================
   WEAKEST SUBJECT
   ========================================================= */

function weakestSubject(){

    return SUBJECTS
        .map(
            s=>({

                ...s,

                risk:
                    riskScore(s.id)

            })
        )
        .sort(
            (a,b)=>
                b.risk-a.risk
        )[0];

}


/* =========================================================
   STUDY MINUTES
   ========================================================= */

function studyMinutes(
    date = null
){

    return db.studySessions
        .filter(
            x =>
                !date ||
                x.date === date
        )
        .reduce(
            (sum,x)=>
                sum+
                Number(
                    x.minutes||0
                ),
            0
        );

}


/* =========================================================
   TEST STATISTICS
   ========================================================= */

function testStats(
    date = null
){

    const tests =
        db.tests.filter(
            x =>
                !date ||
                x.date===date
        );


    const total =
        tests.reduce(
            (sum,x)=>
                sum+
                Number(
                    x.total||0
                ),
            0
        );


    const correct =
        tests.reduce(
            (sum,x)=>
                sum+
                Number(
                    x.correct||0
                ),
            0
        );


    const wrong =
        tests.reduce(
            (sum,x)=>
                sum+
                Number(
                    x.wrong||0
                ),
            0
        );


    const unanswered =
        Math.max(
            0,
            total-
            correct-
            wrong
        );


    const accuracy =
        total
        ?
        Math.round(
            correct/
            total*
            100
        )
        :
        0;


    const score =
        total
        ?
        Math.round(
            (
                correct-
                wrong/3
            )/
            total*
            100
        )
        :
        0;


    return {

        total,

        correct,

        wrong,

        unanswered,

        accuracy,

        score:
            Math.max(
                -100,
                Math.min(
                    100,
                    score
                )
            )

    };

}


/* =========================================================
   STREAK
   ========================================================= */

function streak(){

    let count = 0;

    const current =
        new Date();

    while(true){

        const date =
            current
            .toISOString()
            .slice(0,10);


        const hasStudy =
            studyMinutes(
                date
            ) > 0;


        const hasTest =
            testStats(
                date
            ).total > 0;


        if(
            !hasStudy &&
            !hasTest
        )
            break;


        count++;

        current.setDate(
            current.getDate()-1
        );

    }

    return count;

}

/* =========================================================
   UTILITY FUNCTIONS
   ========================================================= */

function today(){

    return new Date()
        .toISOString()
        .slice(0,10);

}


function uid(){

    return (
        Date.now().toString(36)+
        Math.random()
        .toString(36)
        .slice(2,10)
    );

}


function clone(
    object
){

    return JSON.parse(
        JSON.stringify(
            object
        )
    );

}


function mergeObjects(
    base,
    source
){

    if(
        !source ||
        typeof source!=="object"
    )
        return base;


    Object.keys(
        source
    ).forEach(
        key=>{

            if(
                Array.isArray(
                    source[key]
                )
            ){

                base[key] =
                    source[key];

            }

            else if(
                source[key] &&
                typeof source[key]==="object"
            ){

                base[key] =
                    mergeObjects(
                        base[key] ||
                        {},
                        source[key]
                    );

            }

            else{

                base[key] =
                    source[key];

            }

        }
    );


    return base;

}


function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function subjectName(
    id
){

    return (
        SUBJECTS.find(
            x=>x.id===id
        )?.name ||
        id ||
        "نامشخص"
    );

}


function formatMinutes(
    minutes
){

    minutes =
        Math.max(
            0,
            Math.round(
                Number(minutes)||0
            )
        );


    const hours =
        Math.floor(
            minutes/60
        );

    const mins =
        minutes%60;


    if(!hours)
        return `${mins} دقیقه`;


    if(!mins)
        return `${hours} ساعت`;


    return `${hours} ساعت و ${mins} دقیقه`;

}

function openModal(
    html
){

    let modal =
        document.getElementById(
            "appModal"
        );


    if(!modal){

        modal =
            document.createElement(
                "div"
            );

        modal.id =
            "appModal";

        modal.className =
            "modal";

        document.body.appendChild(
            modal
        );

    }


    modal.innerHTML = `

        <div
          class="modal-backdrop"
          onclick="closeModal()">
        </div>

        <div class="modal-box">

            <button
              class="modal-close"
              onclick="closeModal()">

                ×

            </button>

            ${html}

        </div>

    `;


    modal.classList.add(
        "open"
    );

}


function closeModal(){

    const modal =
        document.getElementById(
            "appModal"
        );


    if(modal)
        modal.classList.remove(
            "open"
        );

}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(
    message
){

    let toast =
        document.getElementById(
            "toast"
        );


    if(!toast){

        toast =
            document.createElement(
                "div"
            );

        toast.id =
            "toast";

        toast.className =
            "toast";

        document.body.appendChild(
            toast
        );

    }


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.__toastTimer
    );


    window.__toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            2800
        );

}

/* =========================================================
   DATABASE
   ========================================================= */

function loadDatabase(){

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(!raw)
            return clone(
                DEFAULT_DATABASE
            );


        const parsed =
            JSON.parse(raw);


        return mergeObjects(
            clone(DEFAULT_DATABASE),
            parsed
        );

    }
    catch(error){

        console.error(
            "Database load error:",
            error
        );

        return clone(
            DEFAULT_DATABASE
        );

    }

}


function saveDatabase(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(db)
        );

        localStorage.setItem(
            "studycoach_current_page",
            currentPage
        );

    }
    catch(error){

        console.error(
            "Database save error:",
            error
        );

    }

}

                :

                        </div>

                    </div>
                `
            }

        </div>

    `;

}


function generatePlan(){

    const hours =
        Number(
            document.getElementById(
                "planHours"
            ).value
        ) || 8;


    const days =
        Number(
            document.getElementById(
                "planDays"
            ).value
        ) || 7;


    const mode =
        document.getElementById(
            "planMode"
        ).value;


    const start =
        document.getElementById(
            "planStart"
        ).value ||
        "05:00";


    const ranked =
        SUBJECTS
        .map(
            subject=>({

                ...subject,

                risk:
                    riskScore(
                        subject.id
                    )

            })
        )
        .sort(
            (a,b)=>
                b.risk-a.risk
        );


    generatedPlan=[];


    for(
        let day=0;
        day<days;
        day++
    ){

        const date =
            new Date();


        date.setDate(
            date.getDate()+day
        );


        const blocks=[];


        let remaining =
            hours*60;


        let index=0;


        while(
            remaining>=45 &&
            blocks.length<8
        ){

            const subject =
                ranked[
                    index %
                    ranked.length
                ];


            let duration =
                mode==="aggressive"
                ?90
                :
                mode==="test"
                ?75
                :
                60;


            duration =
                Math.min(
                    duration,
                    remaining
                );


            blocks.push({

                subject:
                    subject.id,

                minutes:
                    duration,

                type:
                    mode==="test"
                    ?"تست"
                    :
                    mode==="review"
                    ?"مرور"
                    :
                    "مطالعه",

                risk:
                    subject.risk

            });


            remaining -=
                duration;


            index++;

        }


        generatedPlan.push({

            date:
                date.toISOString()
                .slice(0,10),

            start,

            blocks

        });

    }


    showToast(
        "برنامه هوشمند ساخته شد ✨"
    );

    render();

}


function renderGeneratedPlan(){

    return `

        <div class="card">

            <div class="row">

                <h2>
                    برنامه تولیدشده
                </h2>

                <button
                  class="btn"
                  onclick="saveGeneratedPlan()">

                    💾 ذخیره

                </button>

            </div>


            ${generatedPlan.map(
                day=>`

                <div class="plan-day">

                    <h3>
                        ${day.date}
                    </h3>


                    ${day.blocks.map(
                        block=>`

                        <div class="item">

                        `
                    ).join("")}

    `;

}


function saveGeneratedPlan(){

    if(!generatedPlan){

    db.plans.push({

        id:uid(),

        createdAt:

        days:
            clone(
                generatedPlan
            )

    });


    saveDatabase();

    showToast(
        "برنامه ذخیره شد 💾"
    );

}

function addReview(){

            document.getElementById(

            ).value

        new Date();


    date.setDate(
        date.getDate()+days
    );


    db.reviews.push({

        id:uid(),

        subject:
            document.getElementById(
                "reviewSubject"
            ).value,

        topic:
            document.getElementById(
                "reviewTopic"
            ).value,

        next:
            date.toISOString()
            .slice(0,10),

        interval:
            days

    });


    saveDatabase();

    showToast(
        "مرور اضافه شد 🔄"
    );

    render();

}


function completeReview(
    id
){

    const item =
        db.reviews.find(
            x=>x.id===id
        );


    if(!item)
        return;


    const old =
        Number(
            item.interval||1
        );


    const next =
        new Date();


    next.setDate(
        next.getDate()+
        Math.min(
            old*2,
            60
        )
    );


    item.interval =
        Math.min(
            old*2,
            60
        );


    item.next =
        next.toISOString()
        .slice(0,10);


    saveDatabase();

    showToast(
        "مرور ثبت شد؛ مرور بعدی برنامه‌ریزی شد."
    );

    render();

}

/* =========================================================
   FOCUS TIMER
   ========================================================= */

let focusTimer =
    null;

let focusSeconds =
    25*60;


let focusRunning =
    false;


function renderFocus(){

    return `

        <div class="card focus-card">

            <div class="eyebrow">
                DEEP WORK
            </div>

            <h2>
                🎯 Focus Mode
            </h2>

            <div
              id="focusTimer"
              class="focus-timer">

                ${formatTimer(
                    focusSeconds
                )}

            </div>


            <div class="actions">

                <button
                  class="btn"
                  onclick="startFocus()">

                    ▶ شروع

                </button>


                <button
                  class="btn secondary"
                  onclick="pauseFocus()">

                    ⏸ توقف

                </button>


                <button
                  class="btn danger"
                  onclick="resetFocus()">

                    ↻ ریست

                </button>

            </div>

        </div>

    `;

}


function startFocus(){

    if(focusRunning)
        return;


    focusRunning =
        true;


    focusTimer =
        setInterval(
            ()=>{

                if(
                    focusSeconds<=0
                ){

                    finishFocus();

                    return;

                }


                focusSeconds--;

                const element =
                    document.getElementById(
                        "focusTimer"
                    );


                if(element){

                    element.textContent =
                        formatTimer(
                            focusSeconds
                        );

                }

            },
            1000
        );

}


function pauseFocus(){

    focusRunning =
        false;


    clearInterval(
        focusTimer
    );

}


function resetFocus(){

    pauseFocus();

    focusSeconds =
        25*60;


    const element =
        document.getElementById(
            "focusTimer"
        );


    if(element)
        element.textContent =
            formatTimer(
                focusSeconds
            );

}


function finishFocus(){

    pauseFocus();

    db.focus.sessions++;

    db.focus.totalMinutes+=25;

    saveDatabase();

    showToast(
        "🎉 جلسه Focus تمام شد!"
    );

    resetFocus();

}


function formatTimer(
    seconds
){

    const min =
        Math.floor(
            seconds/60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    const sec =
        (
            seconds%60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    return `${min}:${sec}`;

}

   CALENDAR
   ========================================================= */

let calendarDate =
    new Date();


function renderCalendar(){

    const year =
        calendarDate.getFullYear();


    const month =
        calendarDate.getMonth();


    const first =
        new Date(
            year,
            month,
            1
        );


    const last =
        new Date(
            year,
            month+1,
            0
        );


    const days =
        [];


    for(
        let i=1;
        i<=last.getDate();
        i++
    ){

        const date =
            new Date(
                year,
                month,
                i
            );


        const key =
            date.toISOString()
            .slice(0,10);


        days.push({

            number:i,

            key,

            minutes:
                studyMinutes(
                    key
                ),

            tests:
                testStats(
                    key
                ).total

        });

    }


    return `

        <div class="card">

            <div class="row">

                <h2>
                    🗓️ تقویم
                </h2>

                <div class="actions">

                    <button
                      class="btn"
                      onclick="changeMonth(-1)">
                        ‹
                    </button>

                    <button
                      class="btn"
                      onclick="goToday()">
                        امروز
                    </button>

                    <button
                      class="btn"
                      onclick="changeMonth(1)">
                        ›
                    </button>

                </div>

            </div>


            <h3>

                ${year}/
                ${String(
                    month+1
                ).padStart(2,"0")}

            </h3>


            <div class="calendar-grid">

                ${days.map(
                    day=>`

                    <div class="calendar-day">

                        <b>
                            ${day.number}
                        </b>

                        <small>
                            ${day.minutes
                              ?formatMinutes(
                                  day.minutes
                              )
                              :""
                            }
                        </small>

                        ${
                            day.tests
                            ?
                            `<small>
                                📝 ${day.tests}
                             </small>`
                            :
                            ""
                        }

                    </div>

                    `
                ).join("")}

            </div>

        </div>

    `;

}

    if(

برای جبران:

    }


    if(

${stats.accuracy}٪

تحلیل غلط‌ها و رفع مبحث را در اولویت قرار بده.`;

    }


    return `من وضعیت فعلی StudyCoach را بررسی کردم.

${stats.total}

امروز روی ضعیف‌ترین درس کار کن،
بعد تست بزن و حتماً تست‌های غلط را تحلیل کن.`;

}


/* =========================================================
   EXPORT / IMPORT
   ========================================================= */

function exportData(){

    const blob =
        new Blob(
            [
                JSON.stringify(
                    db,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;

    a.download =
        `studycoach-backup-${today()}.json`;


    a.click();


    URL.revokeObjectURL(
        url
    );


    showToast(
        "نسخه پشتیبان ساخته شد."
    );

}


function importData(){

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";

    input.accept =
        ".json,application/json";


    input.onchange =
        event=>{

            const file =
                event.target.files[0];


            if(!file)
                return;


            const reader =
                new FileReader();


            reader.onload =
                ()=>{
                    try{

                        const data =
                            JSON.parse(
                                reader.result
                            );


                        db =
                            mergeObjects(
                                clone(
                                    DEFAULT_DATABASE
                                ),
                                data
                            );


                        saveDatabase();

                        render();

                        showToast(
                            "اطلاعات بازیابی شد."
                        );

                    }
                    catch{

                        showToast(
                            "فایل پشتیبان معتبر نیست."
                        );

                    }

                };


            reader.readAsText(
                file
            );

        };


    input.click();

}

(function(){

    const originalNavigate =
        window.navigate;


    window.navigate =
        function(page){

            currentPage =
                page;

            localStorage.setItem(
                "studycoach_current_page",
                page
            );


            const sidebar =
                document.getElementById(
                    "sidebar"
                );


            if(sidebar)
                sidebar.classList.remove(
                    "open"
                );


            render();

        };


    window.addEventListener(
        "error",
        event=>{

            console.error(
                "StudyCoach error:",
                event.error
            );

        }
    );


})();
