<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#111827">

  <meta
    name="description"
    content="StudyCoach FINAL - مشاور و مدیریت مطالعه آفلاین"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="StudyCoach"
  >

  <link rel="manifest" href="manifest.json">

  <title>StudyCoach FINAL</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="topbar">

    <div class="brand">

      <div class="brand-logo">
        🧠
      </div>

      <div>
        <strong>StudyCoach</strong>
        <span>FINAL</span>
      </div>

    </div>

    <div class="top-actions">

      <button
        id="darkBtn"
        class="icon-btn"
        aria-label="حالت تاریک"
      >
        🌙
      </button>

      <button
        id="quickAddBtn"
        class="icon-btn"
        aria-label="افزودن سریع"
      >
        ＋
      </button>

    </div>

  </header>


  <!-- ================= APP ================= -->

  <main id="app">

    <!-- محتوا توسط app.js ساخته می‌شود -->

    <section class="loading-card">

      <div class="loading-icon">
        🧠
      </div>

      <h2>
        StudyCoach
      </h2>

      <p>
        در حال آماده‌سازی مشاور شخصی...
      </p>

    </section>

  </main>


  <!-- ================= BOTTOM NAV ================= -->

  <nav
    id="bottomNav"
    class="bottom-nav"
  >

    <button
      data-page="home"
      class="nav-item active"
    >
      <span>🏠</span>
      <small>خانه</small>
    </button>

    <button
      data-page="coach"
      class="nav-item"
    >
      <span>🤖</span>
      <small>مشاور</small>
    </button>

    <button
      data-page="plan"
      class="nav-item"
    >
      <span>📅</span>
      <small>برنامه</small>
    </button>

    <button
      data-page="study"
      class="nav-item"
    >
      <span>⏱️</span>
      <small>مطالعه</small>
    </button>

    <button
      data-page="tests"
      class="nav-item"
    >
      <span>📝</span>
      <small>تست</small>
    </button>

    <button
      data-page="mistakes"
      class="nav-item"
    >
      <span>⚠️</span>
      <small>اشتباهات</small>
    </button>

    <button
      data-page="analytics"
      class="nav-item"
    >
      <span>📊</span>
      <small>تحلیل</small>
    </button>

    <button
      data-page="settings"
      class="nav-item"
    >
      <span>⚙️</span>
      <small>تنظیمات</small>
    </button>

  </nav>


  <!-- ================= TOAST ================= -->

  <div
    id="toast"
    class="toast"
    aria-live="polite"
  ></div>


  <!-- ================= MODAL ================= -->

  <div
    id="modal"
    class="modal hidden"
  >

    <div
      id="modalBox"
      class="modal-box"
    >

      <button
        id="modalClose"
        class="modal-close"
      >
        ×
      </button>

      <div id="modalContent"></div>

    </div>

  </div>


  <!-- ================= JAVASCRIPT ================= -->

  <script src="app.js"></script>


  <!-- ================= SERVICE WORKER ================= -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker
          .register("./sw.js")
          .catch(() => {
            console.log(
              "Service Worker registration failed."
            );
          });

      });

    }

  </script>

</body>
</html>
