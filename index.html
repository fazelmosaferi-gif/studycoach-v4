<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>StudyCollector Ultimate</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<header>
<h1>📚 StudyCollector AI</h1>
<p>مشاور و جمع‌آوری منابع کنکور تجربی</p>
</header>


<section class="status">

<div>
<h3>وضعیت</h3>
<span id="status">
🔴 متوقف
</span>
</div>

<div>
<h3>فایل امروز</h3>
<span id="files">
0
</span>
</div>

<div>
<h3>کل آرشیو</h3>
<span id="total">
0
</span>
</div>

</section>



<section class="buttons">

<button onclick="startCollector()">
▶ شروع جمع‌آوری
</button>


<button onclick="stopCollector()">
⏹ توقف
</button>

</section>



<section class="card">

<h2>📖 دروس فعال</h2>


<label>
<input type="checkbox" checked>
زیست
</label>


<label>
<input type="checkbox" checked>
شیمی
</label>


<label>
<input type="checkbox" checked>
فیزیک
</label>


<label>
<input type="checkbox" checked>
ریاضی
</label>


<label>
<input type="checkbox" checked>
عمومی‌ها
</label>


</section>



<section class="card">

<h2>📊 گزارش امروز</h2>

<ul id="report">

<li>
هنوز چیزی دریافت نشده
</li>

</ul>

</section>



<section class="card">

<h2>⚙ تنظیمات</h2>


<button>
اتصال تلگرام
</button>


<button>
گروه مقصد
</button>


<button>
مدیریت کانال‌ها
</button>


</section>



</div>


<script src="app.js"></script>

</body>

</html>
