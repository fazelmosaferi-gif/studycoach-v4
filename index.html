<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="StudyCoach">
<title>StudyCoach Ultimate</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#f4f6fb;
 --card:#fff;
 --text:#172033;
 --muted:#6b7280;
 --primary:#4f46e5;
 --primary2:#7c3aed;
 --border:#e5e7eb;
 --green:#10b981;
 --red:#ef4444;
 --orange:#f59e0b;
}
body.dark{
 --bg:#0f172a;
 --card:#1e293b;
 --text:#f8fafc;
 --muted:#94a3b8;
 --border:#334155;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
}
button,input,select,textarea{font:inherit}
button{
 border:0;
 cursor:pointer;
 border-radius:13px;
 padding:11px 14px;
 background:#e8ebf2;
 color:inherit;
 font-weight:700;
}
button.primary{background:var(--primary);color:white}
button.green{background:#d1fae5;color:#065f46}
button.red{background:#fee2e2;color:#991b1b}
button.orange{background:#fef3c7;color:#92400e}
input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid var(--border);
 border-radius:13px;
 background:var(--card);
 color:var(--text);
 outline:none;
}
textarea{resize:vertical}
.app{
 max-width:1150px;
 margin:auto;
 padding:15px 14px 105px;
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}
.brand{font-size:23px;font-weight:900}
.muted{color:var(--muted);font-size:13px}
.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:20px;
 padding:16px;
 margin:12px 0;
 box-shadow:0 7px 25px rgba(0,0,0,.05);
}
.hero{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
}
.hero h1,.hero h2{margin:5px 0}
.big{
 font-size:36px;
 font-weight:900;
 color:var(--primary);
}
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
}
.stat{text-align:center}
.stat b{
 display:block;
 font-size:23px;
 margin-bottom:4px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.form{display:grid;gap:9px}
.row{
 display:flex;
 align-items:center;
 gap:8px;
}
.grow{flex:1}
.list{display:grid;gap:8px}
.item{
 display:flex;
 align-items:center;
 gap:10px;
 padding:11px;
 border:1px solid var(--border);
 border-radius:14px;
}
.item.done{opacity:.55}
.dot{
 width:10px;
 height:10px;
 border-radius:50%;
 background:var(--primary);
 flex:none;
}
.chip{
 display:inline-block;
 padding:5px 9px;
 border-radius:999px;
 background:#eef2ff;
 color:#4338ca;
 font-size:12px;
 margin:2px;
}
.bar{
 height:9px;
 background:#e5e7eb;
 border-radius:999px;
 overflow:hidden;
}
.bar i{
 display:block;
 height:100%;
 background:var(--primary);
}
.clock{
 font-size:48px;
 font-weight:900;
 text-align:center;
 direction:ltr;
 margin:20px 0;
}
.center{text-align:center}
.message{
 padding:12px;
 border-radius:14px;
 line-height:1.9;
 margin:8px 0;
}
.message.user{background:#eef2ff}
.message.bot{background:#f1f5f9}
body.dark .message.bot{background:#334155}
nav{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 z-index:100;
 display:flex;
 justify-content:space-around;
 background:rgba(255,255,255,.94);
 backdrop-filter:blur(15px);
 border-top:1px solid #ddd;
 padding:7px 2px calc(7px + env(safe-area-inset-bottom));
}
body.dark nav{
 background:rgba(15,23,42,.95);
 border-color:#334155;
}
nav button{
 background:transparent;
 padding:8px 6px;
 font-size:11px;
}
nav button.active{
 background:#eef2ff;
 color:var(--primary);
}
.progress{
 width:100px;
 height:100px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:conic-gradient(var(--primary) var(--p),#e5e7eb var(--p));
}
.progress div{
 width:76px;
 height:76px;
 border-radius:50%;
 background:var(--card);
 display:grid;
 place-items:center;
 font-weight:900;
}
.hidden{display:none!important}
@media(max-width:700px){
 .stats{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:850px){
 .grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div>
<div class="brand">🎓 StudyCoach Ultimate</div>
<div class="muted">مشاور هوشمند مطالعه • رایگان • بدون API پولی</div>
</div>

<button onclick="settings()">⚙️</button>

</header>

<main id="app"></main>

</div>


<nav>

<button class="active" onclick="page('home',this)">
🏠<br>خانه
</button>

<button onclick="page('coach',this)">
🤖<br>مشاور
</button>

<button onclick="page('plan',this)">
📅<br>برنامه
</button>

<button onclick="page('study',this)">
⏱️<br>مطالعه
</button>

<button onclick="page('tests',this)">
📝<br>تست
</button>

<button onclick="page('analysis',this)">
📊<br>تحلیل
</button>

<button onclick="page('more',this)">
🧰<br>بیشتر
</button>

</nav>


<script>

/* =========================
   DATABASE
========================= */

const KEY="StudyCoachUltimate_Final_2026";

const DEFAULT_DATA={

profile:{
 name:"",
 goal:"کنکور",
 examDate:"",
 dailyHours:8,
 pomodoro:50,
 dark:false
},

subjects:[
 {id:"bio",name:"زیست",level:3},
 {id:"chem",name:"شیمی",level:2},
 {id:"math",name:"ریاضی",level:2},
 {id:"phys",name:"فیزیک",level:3}
],

plans:[],
sessions:[],
tests:[],
mistakes:[],
reviews:[],
notes:[],
messages:[],
goals:[],

streak:0,
lastStudy:""

};


let DATA=load();

let TIMER={
 seconds:0,
 running:false,
 interval:null
};


/* =========================
   BASIC FUNCTIONS
========================= */

function load(){

try{

let saved=
JSON.parse(
localStorage.getItem(KEY)
);

return saved||structuredClone(DEFAULT_DATA);

}catch(e){

return structuredClone(DEFAULT_DATA);

}

}


function save(){

localStorage.setItem(
KEY,
JSON.stringify(DATA)
);

}


function $(id){

return document.getElementById(id);

}


function today(){

return new Date()
.toISOString()
.slice(0,10);

}


function fa(value){

return String(value)
.replace(
/\d/g,
x=>"۰۱۲۳۴۵۶۷۸۹"[x]
);

}


function esc(value){

return String(value??"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c]));

}


function minutesToday(){

return DATA.sessions
.filter(x=>x.date===today())
.reduce(
(a,x)=>a+x.minutes,
0
);

}


function totalMinutes(){

return DATA.sessions
.reduce(
(a,x)=>a+x.minutes,
0
);

}


function testsToday(){

return DATA.tests
.filter(x=>x.date===today());

}


function testsTodayCount(){

return testsToday()
.reduce(
(a,x)=>a+x.count,
0
);

}


function accuracyToday(){

let t=testsToday();

if(!t.length)return null;

return Math.round(
t.reduce(
(a,x)=>a+x.accuracy,
0
)/t.length
);

}


function overallAccuracy(){

if(!DATA.tests.length)
return null;

return Math.round(
DATA.tests.reduce(
(a,x)=>a+x.accuracy,
0
)/DATA.tests.length
);

}


function daysLeft(){

if(!DATA.profile.examDate)
return null;

return Math.max(
0,
Math.ceil(
(
new Date(DATA.profile.examDate)
-
new Date()
)/86400000
)
);

}


/* =========================
   NAVIGATION
========================= */

function page(name,button){

document
.querySelectorAll("nav button")
.forEach(
x=>x.classList.remove("active")
);

if(button)
button.classList.add("active");

const pages={
 home:homePage,
 coach:coachPage,
 plan:planPage,
 study:studyPage,
 tests:testsPage,
 analysis:analysisPage,
 more:morePage
};

pages[name]();

}


/* =========================
   ADVISOR ENGINE
========================= */

function getAdvice(){

let pending=
DATA.plans.filter(
x=>x.date===today()&&!x.done
);

let acc=accuracyToday();

let openMistakes=
DATA.mistakes.filter(
x=>!x.reviewed
).length;

let target=
DATA.profile.dailyHours*60;

let studied=
minutesToday();


if(openMistakes>=5){

return `دفتر اشتباهاتت ${fa(openMistakes)} مورد باز دارد. قبل از تست سنگین، حداقل چند مورد از اشتباهات را مرور کن.`;

}


if(acc!==null && acc<50){

return "دقت تست‌های امروز پایین است. فعلاً تست بیشتر نزن؛ علت اشتباه‌ها را پیدا کن و مباحث ضعیف را دوباره بخوان.";

}


if(pending.length){

return `جلسه بعدی پیشنهادی: ${pending[0].subject} — ${pending[0].topic}.`;

}


if(studied<target*.5){

return "هنوز کمتر از نصف هدف روزانه را انجام داده‌ای. یک جلسه متمرکز دیگر شروع کن.";

}


if(studied>=target){

return "هدف مطالعه امروز کامل شده. بهترین کار فعلی تحلیل تست‌ها، مرور و رفع اشکال است.";

}


return "روند امروز خوب است. جلسه بعدی را شروع کن و نتیجه‌اش را ثبت کن.";

}


function weakSubject(){

let result=
DATA.subjects.map(
subject=>{

let tests=
DATA.tests.filter(
x=>x.subject===subject.name
);

let accuracy=
tests.length
?
tests.reduce(
(a,x)=>a+x.accuracy,
0
)/tests.length
:
50;

return{
 name:subject.name,
 accuracy
};

}
)
.sort(
(a,b)=>a.accuracy-b.accuracy
);

return result[0];

}


/* =========================
   HOME
========================= */

function homePage(){

let target=
DATA.profile.dailyHours*60;

let studied=
minutesToday();

let percent=
Math.min(
100,
Math.round(
studied/Math.max(1,target)*100
)
);

$("app").innerHTML=`

<section class="card hero">

<div>

<span class="chip">
ULTIMATE
</span>

<h2>
${DATA.profile.name
?
"سلام "+esc(DATA.profile.name)+" 👋"
:
"سلام 👋"}
</h2>

<p class="muted">
${esc(DATA.profile.goal||"هدف تحصیلی")}
</p>

<p>
${esc(getAdvice())}
</p>

</div>

<div class="progress"
style="--p:${percent*3.6}deg">

<div>
${fa(percent)}٪
</div>

</div>

</section>


<section class="stats">

<div class="card stat">

<b>
${fa(studied)}
</b>

<span class="muted">
دقیقه مطالعه
</span>

</div>


<div class="card stat">

<b>
${fa(testsTodayCount())}
</b>

<span class="muted">
تست امروز
</span>

</div>


<div class="card stat">

<b>
${accuracyToday()===null
?
"—"
:
fa(accuracyToday())+"٪"}
</b>

<span class="muted">
دقت امروز
</span>

</div>


<div class="card stat">

<b>
${daysLeft()===null
?
"—"
:
fa(daysLeft())}
</b>

<span class="muted">
روز باقی‌مانده
</span>

</div>

</section>


<section class="card">

<div class="row">

<h3 class="grow">
📅 برنامه امروز
</h3>

<button
class="primary"
onclick="generatePlan()">

ساخت برنامه هوشمند

</button>

</div>

<div class="list">

${
DATA.plans
.filter(x=>x.date===today())
.map(planItem)
.join("")
||
'<p class="muted">هنوز برنامه‌ای ساخته نشده.</p>'
}

</div>

</section>


<section class="card">

<h3>
🤖 توصیه مشاور
</h3>

<div class="message bot">
${esc(getAdvice())}
</div>

</section>


<section class="card">

<div class="row">

<div class="grow">

<h3>
🔥 استمرار
</h3>

<span class="muted">
روزهای متوالی مطالعه
</span>

</div>

<div class="big">
${fa(DATA.streak)}
</div>

</div>

</section>

`;

}


function planItem(x){

return`

<div class="item ${x.done?"done":""}">

<div class="dot"></div>

<div class="grow">

<b>
${esc(x.start)} ·
${esc(x.subject)}
</b>

<div class="muted">
${esc(x.topic)}
 ·
${fa(x.minutes)} دقیقه
 ·
${esc(x.type)}
</div>

</div>

<button
onclick="togglePlan('${x.id}')">

${x.done?"✓":"انجام شد"}

</button>

</div>

`;

}


function togglePlan(id){

let x=
DATA.plans.find(
x=>x.id===id
);

if(x)
x.done=!x.done;

save();

homePage();

}


/* =========================
   SMART PLANNER
========================= */

function planPage(){

$("app").innerHTML=`

<section class="card">

<div class="row">

<div class="grow">

<h2>
📅 برنامه‌ریز تطبیقی
</h2>

<p class="muted">
بر اساس سطح دروس، هدف روزانه و عملکرد تست‌ها برنامه می‌سازد.
</p>

</div>

<button
class="primary"
onclick="generatePlan()">

ساخت برنامه

</button>

</div>

</section>


<section class="card">

<h3>
📋 برنامه امروز
</h3>

<div class="list">

${
DATA.plans
.filter(x=>x.date===today())
.map(planItem)
.join("")
||
'<p class="muted">برنامه‌ای وجود ندارد.</p>'
}

</div>

</section>


<section class="card">

<h3>
🔄 تحلیل عقب‌افتادگی
</h3>

<button
class="orange"
onclick="recoveryAnalysis()">

تحلیل کن

</button>

<div
id="recovery"
class="message bot">

هنوز تحلیل نشده.

</div>

</section>

`;

}


function generatePlan(){

DATA.plans=
DATA.plans.filter(
x=>x.date!==today()
);


let total=
Math.max(
120,
DATA.profile.dailyHours*60
);

let used=0;

let current=8*60;

let subjects=
[...DATA.subjects]
.sort(
(a,b)=>a.level-b.level
);

let types=[

["مطالعه","یادگیری مفهومی"],

["تست","تست آموزشی"],

["تحلیل","تحلیل تست"],

["مرور","مرور فعال"],

["تست","تست زمان‌دار"]

];

let i=0;


while(
used+45<=total &&
i<20
){

let subject=
subjects[i%subjects.length];

let duration=
i===0
?
90
:
60;

duration=
Math.min(
duration,
total-used
);

if(duration<45)
break;

let h=
String(
Math.floor(current/60)
)
.padStart(2,"0");

let m=
String(
current%60
)
.padStart(2,"0");

let type=
types[i%types.length];


DATA.plans.push({

id:
crypto.randomUUID(),

date:
today(),

start:
`${h}:${m}`,

subject:
subject.name,

topic:
type[1],

minutes:
duration,

type:
type[0],

done:false

});


used+=duration;

current+=duration+20;

i++;

}


save();

page(
"home",
document.querySelector("nav button")
);

}


function recoveryAnalysis(){

let pending=
DATA.plans
.filter(
x=>x.date===today()&&!x.done
)
.sort(
(a,b)=>b.minutes-a.minutes
);


$("recovery").textContent=
pending.length
?
`برای جبران، ابتدا این جلسه‌ها را انجام بده: ${
pending
.slice(0,3)
.map(x=>x.subject+" — "+x.topic)
.join("، ")
}`
:
"عقب‌افتادگی ثبت‌شده‌ای نداری.";

}


/* =========================
   COACH
========================= */

function coachPage(){

$("app").innerHTML=`

<section class="card">

<h2>
🤖 مشاور خصوصی هوشمند
</h2>

<p class="muted">
این مشاور بدون API پولی کار می‌کند و بر اساس داده‌های ثبت‌شده تصمیم می‌گیرد.
</p>

<div id="chat">

${
DATA.messages
.slice(-15)
.map(
x=>`

<div class="message user">
${esc(x.q)}
</div>

<div class="message bot">
${esc(x.a)}
</div>

`
)
.join("")
||
`
<div class="message bot">
${esc(getAdvice())}
</div>
`
}

</div>


<div class="form">

<textarea
id="question"
rows="3"
placeholder="مثلاً امروز عقب افتادم، چه کار کنم؟">
</textarea>

<button
class="primary"
onclick="askCoach()">

مشاوره بده

</button>

</div>

</section>


<section class="card">

<h3>
⚡ پرسش سریع
</h3>

<div class="grid">

<button onclick="quickAsk('امروز چه درسی بخوانم؟')">
درس بعدی
</button>

<button onclick="quickAsk('کدام درس ضعیف‌تر است؟')">
نقطه ضعف
</button>

<button onclick="quickAsk('امروز عقب افتادم')">
جبران
</button>

<button onclick="quickAsk('چه چیزی را مرور کنم؟')">
مرور
</button>

</div>

</section>

`;

}


function quickAsk(q){

$("question").value=q;

askCoach();

}


function askCoach(){

let q=
$("question").value.trim();

if(!q)
return;


let answer=
coachAnswer(q);


DATA.messages.push({

q,
a:answer,
date:today()

});


save();

$("question").value="";

coachPage();

}


function coachAnswer(q){

if(
/ضعف|ضعیف|کدام درس|کدوم درس/
.test(q)
){

let weak=
weakSubject();

return `بر اساس تست‌های ثبت‌شده، فعلاً ${weak.name} ضعیف‌ترین وضعیت را دارد. پیشنهاد من این است که یک جلسه مفهومی و سپس تست آموزشی برای آن بگذاری.`;

}


if(
/عقب|جبران|نرسید|نخوندم/
.test(q)
){

return getAdvice();

}


if(
/مرور/
.test(q)
){

let n=
DATA.mistakes
.filter(x=>!x.reviewed)
.length;

return n
?
`${fa(n)} اشتباه هنوز مرور نشده است. اول آن‌ها را بررسی کن.`
:
"دفتر اشتباهات فعلاً مورد باز ندارد.";

}


if(
/امروز|بخوانم|درس بعد/
.test(q)
){

let p=
DATA.plans.find(
x=>x.date===today()&&!x.done
);

return p
?
`جلسه بعدی تو ${p.subject} — ${p.topic} است.`
:
getAdvice();

}


if(
/خسته|استراحت/
.test(q)
){

return "اگر تمرکزت افت کرده، یک وقفه کوتاه داشته باش و بعد با یک جلسه مشخص و قابل اندازه‌گیری برگرد.";

}


return getAdvice();

}


/* =========================
   STUDY TIMER
========================= */

function studyPage(){

$("app").innerHTML=`

<section class="card">

<h2>
⏱️ تایمر مطالعه
</h2>

<div class="form">

<select id="studySubject">

${
DATA.subjects
.map(
x=>`<option>${x.name}</option>`
)
.join("")
}

</select>

<input
id="studyTopic"
placeholder="مبحث مطالعه">

</div>


<div id="clock"
class="clock">

${formatTime(TIMER.seconds)}

</div>


<div class="center">

<button
class="primary"
onclick="startTimer()">

شروع

</button>

<button
onclick="pauseTimer()">

توقف

</button>

<button
onclick="finishTimer()">

ثبت جلسه

</button>

</div>

</section>


<section class="card">

<h3>
🍅 پومودورو
</h3>

<p class="muted">
مدت فعلی:
${fa(DATA.profile.pomodoro)}
دقیقه
</p>

<button
class="primary"
onclick="startPomodoro()">

شروع پومودورو

</button>

function formatTime(seconds){

let h=
Math.floor(seconds/3600);

let m=
Math.floor(seconds/60)%60;

let s=
seconds%60;

return[
String(h).padStart(2,"0"),
String(m).padStart(2,"0"),
String(s).padStart(2,"0")
].join(":");

}


function startTimer(){

if(TIMER.running)
return;

TIMER.running=true;

TIMER.interval=
setInterval(
()=>{

TIMER.seconds++;

if($("clock"))
$("clock").textContent=
formatTime(TIMER.seconds);

},
1000
);

}


function pauseTimer(){

TIMER.running=false;

clearInterval(
TIMER.interval
);

}


function finishTimer(){

pauseTimer();

let minutes=
Math.round(
TIMER.seconds/60
);

if(minutes<1){

alert(
"حداقل یک دقیقه مطالعه کن."
);

return;

}


DATA.sessions.push({

date:today(),

minutes,

subject:
$("studySubject").value,

topic:
$("studyTopic").value||
"مطالعه"

});


if(
DATA.lastStudy!==today()
){

DATA.streak++;

DATA.lastStudy=
today();

}


TIMER.seconds=0;

save();

studyPage();

}


function startPomodoro(){

TIMER.seconds=
Number(
DATA.profile.pomodoro
)*60;

startTimer();

}

function backup(){

let blob=
new Blob(
[
JSON.stringify(
DATA,
null,
2
)
],
{
type:"application/json"
}
);

let url=
URL.createObjectURL(blob);

let a=
document.createElement("a");

a.href=url;

a.download=
"StudyCoach-Ultimate-Backup.json";

a.click();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);

}


function restoreBackup(event){

let file=
event.target.files[0];

if(!file)
return;

let reader=
new FileReader();

reader.onload=
function(){

try{

let imported=
JSON.parse(
reader.result
);

if(
!imported.profile||
!imported.subjects
)
throw new Error();

DATA=imported;

save();

location.reload();

}
catch(e){

alert(
"فایل پشتیبان معتبر نیست."
);

}

};

reader.readAsText(file);

}
