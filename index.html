<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyCoach Ultimate">
<title>StudyCoach Ultimate</title>

<style>
*{box-sizing:border-box}

:root{
 --bg:#f4f6fb;
 --card:#fff;
 --text:#111827;
 --muted:#6b7280;
 --primary:#4f46e5;
 --primary2:#6366f1;
 --border:#e5e7eb;
 --good:#059669;
 --bad:#dc2626;
 --warning:#d97706;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
}

body.dark{
 --bg:#0f172a;
 --card:#1e293b;
 --text:#f8fafc;
 --muted:#94a3b8;
 --border:#334155;
}

button,input,select,textarea{
 font:inherit;
}

button{
 border:0;
 border-radius:12px;
 padding:10px 13px;
 background:#e8ebf3;
 color:inherit;
 cursor:pointer;
}

button.primary{
 background:var(--primary);
 color:white;
}

button.good{
 background:#d1fae5;
 color:#065f46;
}

button.danger{
 background:#fee2e2;
 color:#991b1b;
}

input,select,textarea{
 width:100%;
 padding:11px;
 border:1px solid var(--border);
 border-radius:12px;
 background:var(--card);
 color:var(--text);
 outline:none;
}

textarea{
 resize:vertical;
}

.wrap{
 width:min(1150px,100%);
 margin:auto;
 padding:15px 14px 105px;
}

header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:12px;
}

.brand{
 font-size:23px;
 font-weight:900;
}

.muted{
 color:var(--muted);
 font-size:13px;
}

.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:20px;
 padding:16px;
 margin:11px 0;
 box-shadow:0 7px 25px rgba(0,0,0,.05);
}

.hero{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

.hero h1,
.hero h2{
 margin:7px 0;
}

.score{
 min-width:90px;
 text-align:center;
}

.score strong{
 display:block;
 font-size:34px;
 color:var(--primary);
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
}

.stat{
 text-align:center;
}

.stat b{
 display:block;
 font-size:22px;
 margin-top:5px;
}

.head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.list{
 display:grid;
 gap:8px;
}

.item{
 display:flex;
 align-items:center;
 gap:10px;
 padding:11px;
 border:1px solid var(--border);
 border-radius:14px;
}

.item.done{
 opacity:.55;
}

.item .grow{
 flex:1;
}

.item b,
.item small{
 display:block;
}

.dot{
 width:10px;
 height:10px;
 border-radius:50%;
 background:var(--primary);
 flex:none;
}

.done .dot{
 background:var(--good);
}

.bar{
 height:9px;
 border-radius:999px;
 overflow:hidden;
 background:#e5e7eb;
}

.bar i{
 display:block;
 height:100%;
 background:var(--primary);
}

.chip{
 display:inline-block;
 padding:5px 9px;
 border-radius:999px;
 background:#eef2ff;
 color:#4338ca;
 font-size:12px;
 margin:2px;
}

.msg{
 padding:11px;
 border-radius:14px;
 line-height:1.9;
 margin:7px 0;
}

.msg.user{
 background:#eef2ff;
}

.msg.bot{
 background:#f1f5f9;
}

.dark .msg.bot{
 background:#334155;
}

.clock{
 font-size:46px;
 font-weight:900;
 text-align:center;
 margin:20px 0;
 direction:ltr;
}

.center{
 text-align:center;
}

.form{
 display:grid;
 gap:9px;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 padding:9px;
 border-bottom:1px solid var(--border);
 text-align:right;
}

nav{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 z-index:100;
 display:flex;
 justify-content:space-around;
 background:rgba(255,255,255,.94);
 backdrop-filter:blur(15px);
 border-top:1px solid #ddd;
 padding:7px 2px calc(7px + env(safe-area-inset-bottom));
}

.dark nav{
 background:rgba(15,23,42,.94);
 border-color:#334155;
}

nav button{
 background:transparent;
 padding:8px 7px;
 font-size:11px;
}

nav button.active{
 background:#eef2ff;
 color:var(--primary);
 font-weight:800;
}

.hidden{
 display:none!important;
}

.progress-ring{
 width:100px;
 height:100px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:conic-gradient(var(--primary) 0deg,var(--primary) var(--deg),#e5e7eb var(--deg),#e5e7eb 360deg);
}

.progress-ring div{
 width:78px;
 height:78px;
 border-radius:50%;
 background:var(--card);
 display:grid;
 place-items:center;
 font-weight:900;
}

@media(max-width:700px){
 .stats{
  grid-template-columns:repeat(2,1fr);
 }
 .hero{
  align-items:flex-start;
 }
}

@media(min-width:800px){
 .grid{
  grid-template-columns:repeat(3,1fr);
 }
}
</style>
</head>

<body>

<div class="wrap">

<header>
<div>
<div class="brand">🎓 StudyCoach Ultimate</div>
<div class="muted">نسخه رایگان • آفلاین • بدون API پولی</div>
</div>

<button onclick="openSettings()">⚙️</button>
</header>

<main id="app"></main>

</div>


<nav>

<button class="active" onclick="go('home',this)">🏠<br>خانه</button>

<button onclick="go('coach',this)">🤖<br>مشاور</button>

<button onclick="go('plan',this)">📅<br>برنامه</button>

<button onclick="go('study',this)">⏱️<br>مطالعه</button>

<button onclick="go('tests',this)">📝<br>تست</button>

<button onclick="go('analytics',this)">📊<br>تحلیل</button>

<button onclick="go('tools',this)">🧰<br>بیشتر</button>

</nav>


<script>

const KEY="studycoach_ultimate_v1";


const DEFAULT_DATA={

profile:{
 name:"",
 goal:"کنکور",
 examDate:"",
 dailyHours:8,
 pomodoro:50,
 dark:false
},

subjects:[
 {id:"bio",name:"زیست",level:3},
 {id:"chem",name:"شیمی",level:2},
 {id:"math",name:"ریاضی",level:2},
 {id:"phys",name:"فیزیک",level:3}
],

plans:[],
sessions:[],
tests:[],
mistakes:[],
reviews:[],
notes:[],
messages:[],
goals:[],

streak:0,
lastStudy:""

};


let DATA=load();

let TIMER={
 seconds:0,
 running:false,
 interval:null
};


function load(){

try{

let x=JSON.parse(
localStorage.getItem(KEY)
);

return x || structuredClone(DEFAULT_DATA);

}catch(e){

return structuredClone(DEFAULT_DATA);

}

}


function save(){

localStorage.setItem(
KEY,
JSON.stringify(DATA)
);

}


function today(){

return new Date()
.toISOString()
.slice(0,10);

}


function fa(n){

return String(n)
.replace(
/\d/g,
x=>"۰۱۲۳۴۵۶۷۸۹"[x]
);

}


function escapeHTML(s){

return String(s??"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c]));

}


function minutesToday(){

return DATA.sessions
.filter(x=>x.date===today())
.reduce(
(a,x)=>a+x.minutes,
0
);

}


function totalMinutes(){

return DATA.sessions
.reduce(
(a,x)=>a+x.minutes,
0
);

}


function testsToday(){

return DATA.tests
.filter(x=>x.date===today());

}


function testCountToday(){

return testsToday()
.reduce(
(a,x)=>a+x.count,
0
);

}


function overallAccuracy(){

if(!DATA.tests.length)return null;

return Math.round(
DATA.tests.reduce(
(a,x)=>a+x.accuracy,
0
)
/DATA.tests.length
);

}


function todayAccuracy(){

let a=testsToday();

if(!a.length)return null;

return Math.round(
a.reduce(
(s,x)=>s+x.accuracy,
0
)/a.length
);

}


function daysLeft(){

if(!DATA.profile.examDate)
return null;

return Math.max(
0,
Math.ceil(
(
new Date(DATA.profile.examDate)
-
new Date()
)/86400000
)
);

}


function formatTime(sec){

let h=Math.floor(sec/3600);

let m=Math.floor(sec/60)%60;

let s=sec%60;

return [
String(h).padStart(2,"0"),
String(m).padStart(2,"0"),
String(s).padStart(2,"0")
].join(":");

}


function go(name,button){

document
.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

if(button)
button.classList.add("active");

let pages={
 home:homePage,
 coach:coachPage,
 plan:planPage,
 study:studyPage,
 tests:testsPage,
 analytics:analyticsPage,
 tools:toolsPage
};

$("app").innerHTML=pages[name]();

let renderers={
 home:renderHome,
 coach:renderCoach,
 plan:renderPlan,
 study:renderStudy,
 tests:renderTests,
 analytics:renderAnalytics,
 tools:renderTools
};

renderers[name]();

}


function $(id){

return document.getElementById(id);

}


/* HOME */

function homePage(){

return `

<section class="card hero">

<div>

<span class="chip">
ULTIMATE
</span>

<h2 id="hello">
سلام 👋
</h2>

<p id="advisorHome">
</p>

</div>


<div class="score">

<strong id="todayProgress">
۰٪
</strong>

<span class="muted">
پیشرفت امروز
</span>

</div>

</section>


<section class="stats">

<div class="card stat">
<b id="todayStudy">۰</b>
<span class="muted">دقیقه مطالعه</span>
</div>

<div class="card stat">
<b id="todayTests">۰</b>
<span class="muted">تست امروز</span>
</div>

<div class="card stat">
<b id="todayAcc">—</b>
<span class="muted">دقت امروز</span>
</div>

<div class="card stat">
<b id="remaining">—</b>
<span class="muted">روز باقی‌مانده</span>
</div>

</section>


<section class="card">

<div class="head">

<h3>
📅 برنامه امروز
</h3>

<button class="primary" onclick="generatePlan()">
ساخت برنامه
</button>

</div>

<div id="todayPlans" class="list"></div>

</section>


<section class="card">

<h3>
🧠 توصیه مشاور
</h3>

<div id="smartAdvice" class="msg bot"></div>

</section>


<section class="card">

<h3>
🔥 وضعیت استمرار
</h3>

<div class="grid">

<div class="stat">

<b>
${fa(DATA.streak)}
</b>

<span class="muted">
روز متوالی
</span>

</div>

<div class="stat">

<b>
${fa(totalMinutes())}
</b>

<span class="muted">
دقیقه کل
</span>

</div>

</div>

</section>

`;

}


function renderHome(){

let m=minutesToday();

let target=DATA.profile.dailyHours*60;

let p=Math.min(
100,
Math.round(
m/Math.max(1,target)*100
)
);


$("hello").textContent=
DATA.profile.name
?
`سلام ${DATA.profile.name} 👋`
:
"سلام 👋";


$("advisorHome").textContent=
advisor();


$("todayStudy").textContent=
fa(m);


$("todayTests").textContent=
fa(testCountToday());


let acc=todayAccuracy();


$("todayAcc").textContent=
acc===null
?
"—"
:
fa(acc)+"٪";


$("remaining").textContent=
daysLeft()===null
?
"—"
:
fa(daysLeft());


$("todayProgress").textContent=
fa(p)+"٪";


$("smartAdvice").textContent=
advisor();


let plans=
DATA.plans.filter(
x=>x.date===today()
);


$("todayPlans").innerHTML=
plans.length
?
plans.map(planItem).join("")
:
"<p class='muted'>برنامه‌ای برای امروز وجود ندارد.</p>";

}


function planItem(x){

return `

<div class="item ${x.done?"done":""}">

<div class="dot"></div>

<div class="grow">

<b>
${escapeHTML(x.start)}
 ·
${escapeHTML(x.subject)}
</b>

<small>
${escapeHTML(x.topic)}
 ·
${fa(x.duration)} دقیقه
 ·
${escapeHTML(x.type)}
</small>

</div>

<button
onclick="togglePlan('${x.id}')">

${x.done?"✓":"انجام شد"}

</button>

</div>

`;

}


function togglePlan(id){

let x=
DATA.plans.find(
x=>x.id===id
);

if(!x)return;

x.done=!x.done;

save();

renderHome();

}


/* ADVISOR */

function advisor(){

let study=minutesToday();

let target=DATA.profile.dailyHours*60;

let acc=todayAccuracy();

let pending=
DATA.plans
.filter(
x=>x.date===today()&&!x.done
);


let mistakes=
DATA.mistakes
.filter(
x=>!x.reviewed
).length;


if(!DATA.profile.name){

return "برای شروع، نام و هدف خودت را در تنظیمات وارد کن.";

}


if(acc!==null && acc<50){

return "دقت تست‌ها پایین است. فعلاً به‌جای تست بیشتر، اشتباهات و مفاهیم همان مبحث را بررسی کن.";

}


if(mistakes>=5){

return `دفتر اشتباهات ${fa(mistakes)} مورد باز دارد. یک جلسه مرور اشتباهات را در اولویت قرار بده.`;

}


if(pending.length){

return `جلسه بعدی پیشنهادی: ${pending[0].subject} — ${pending[0].topic}.`;

}


if(study<target*.5){

return "هنوز کمتر از نصف هدف روزانه را انجام داده‌ای. یک جلسه متمرکز دیگر شروع کن.";

}


if(study>=target){

return "هدف مطالعه امروز کامل شده. الان تحلیل، مرور و رفع اشکال بهترین انتخاب است.";

}


return "روند امروز مناسب است. جلسه بعدی را شروع کن و بعد نتیجه را ثبت کن.";

}


function coachPage(){

return `

<section class="card">

<h2>
🤖 مشاور خصوصی
</h2>

<p class="muted">

مشاور داخلی بدون نیاز به API پولی.
بر اساس مطالعه، تست، اشتباهات و برنامه تصمیم می‌گیرد.

</p>

<div id="chat"></div>

<div class="form">

<textarea
id="question"
rows="3"
placeholder="مثلاً امروز عقب افتادم، چه کار کنم؟">
</textarea>

<button
class="primary"
onclick="askAdvisor()">

مشاوره بده

</button>

</div>

</section>


<section class="card">

<h3>
⚡ پرسش سریع
</h3>

<div class="grid">

<button onclick="quickAsk('امروز چه درسی بخوانم؟')">
درس بعدی
</button>

<button onclick="quickAsk('کدام درس من ضعیف‌تر است؟')">
ضعف من
</button>

<button onclick="quickAsk('امروز عقب افتادم چه کنم؟')">
جبران
</button>

<button onclick="quickAsk('چه چیزی را مرور کنم؟')">
مرور
</button>

</div>

</section>

`;

}


function renderCoach(){

let messages=
DATA.messages.slice(-15);


$("chat").innerHTML=
messages.length
?
messages.map(x=>`

<div class="msg user">
${escapeHTML(x.q)}
</div>

<div class="msg bot">
${escapeHTML(x.a)}
</div>

`).join("")
:
`
<div class="msg bot">
${escapeHTML(advisor())}
</div>
`;

}


function quickAsk(q){

$("question").value=q;

askAdvisor();

}


function askAdvisor(){

let q=
$("question").value.trim();

if(!q)return;


let answer=
getAdvisorAnswer(q);


DATA.messages.push({
date:today(),
q,
a:answer
});


save();

$("question").value="";

renderCoach();

}


function getAdvisorAnswer(q){

let pending=
DATA.plans
.filter(
x=>x.date===today()&&!x.done
);


if(
/عقب|جبران|نرسید|نخوندم/
.test(q)
){

if(pending.length){

return `برای جبران، همه جلسه‌ها را روی هم نریز. اول ${pending[0].subject} — ${pending[0].topic} را انجام بده و بعد جلسه بعدی را اجرا کن.`;

}

return "برای امروز برنامه‌ای عقب‌افتاده ثبت نشده. می‌توانی برنامه هوشمند را بازسازی کنی.";

}


if(
/ضعف|ضعیف|کدام درس|کدوم درس/
.test(q)
){

let ranking=
DATA.subjects.map(s=>{

let tests=
DATA.tests.filter(
x=>x.subject===s.name
);

let a=
tests.length
?
tests.reduce(
(z,x)=>z+x.accuracy,
0
)/tests.length
:
50;

return {
name:s.name,
accuracy:a
};

})
.sort((a,b)=>a.accuracy-b.accuracy);


return `بر اساس داده‌های ثبت‌شده، اولویت فعلی برای تقویت: ${ranking[0].name} است.`;

}


if(
/مرور|مرور کنم/
.test(q)
){

let open=
DATA.mistakes.filter(
x=>!x.reviewed
);


return open.length
?
`${fa(open.length)} مورد در دفتر اشتباهات نیاز به مرور دارند. مرور آن‌ها را قبل از تست سنگین انجام بده.`
:
"فعلاً مورد بازی در دفتر اشتباهات نداری.";

}


if(
/امروز|درس بعدی|بخوانم/
.test(q)
){

return advisor();

}


if(
/خسته|استراحت/
.test(q)
){

return "اگر تمرکزت افت کرده، یک وقفه کوتاه داشته باش و سپس یک جلسه کوتاه و مشخص را شروع کن. کیفیت مطالعه را فدای ساعت بیشتر نکن.";

}


return advisor();

}


/* PLAN */

function planPage(){

return `

<section class="card">

<div class="head">

<h2>
📅 برنامه‌ریز تطبیقی
</h2>

<button
class="primary"
onclick="generatePlan()">

ساخت برنامه هوشمند

</button>

</div>

<p class="muted">
برنامه بر اساس هدف روزانه، سطح دروس، مطالعه انجام‌شده و وضعیت تست‌ها ساخته می‌شود.
</p>

<div id="allPlans" class="list"></div>

</section>


<section class="card">

<h3>
🔄 جبران عقب‌افتادگی
</h3>

<button
onclick="recovery()">

تحلیل عقب‌افتادگی
</button>

<div
id="recoveryResult"
class="msg bot">

تحلیل نشده.

</div>

</section>

`;

}


function renderPlan(){

let plans=
DATA.plans.filter(
x=>x.date===today()
);


$("allPlans").innerHTML=
plans.length
?
plans.map(planItem).join("")
:
"<p class='muted'>برنامه‌ای ساخته نشده.</p>";

}


function generatePlan(){

if(!DATA.profile.name){

openSettings();

return;

}


DATA.plans=
DATA.plans.filter(
x=>x.date!==today()
);


let total=
Math.max(
120,
DATA.profile.dailyHours*60
);


let used=0;

let current=
Math.max(
8*60,
new Date().getHours()*60+10
);


let subjects=
[...DATA.subjects]
.sort((a,b)=>a.level-b.level);


let types=[

["یادگیری","مطالعه مفهومی"],

["تست","تست زمان‌دار"],

["تحلیل","تحلیل تست"],

["مرور","مرور فعال"],

["تست","آزمونک"]

];


let i=0;


while(
used+45<=total &&
i<20
){

let subject=
subjects[i%subjects.length];


let duration=
i===0
?
90
:
60;


if(
used+duration>total
){

duration=total-used;

}


if(duration<45)break;


let type=
types[i%types.length];


let h=
Math.floor(current/60);

let m=
current%60;


DATA.plans.push({

id:crypto.randomUUID(),

date:today(),

start:
String(h).padStart(2,"0")
+
":"+
String(m).padStart(2,"0"),

subject:subject.name,

topic:type[1],

duration,

type:type[0],

done:false

});


used+=duration;

current+=duration+20;

i++;

}


save();

go(
"home",
document.querySelector("nav button")
);

}


function recovery(){

let p=
DATA.plans
.filter(
x=>x.date===today()&&!x.done
)
.sort(

function startTimer(){

if(TIMER.running)return;

TIMER.running=true;

TIMER.interval=
setInterval(()=>{

TIMER.seconds++;

if($("timer"))
$("timer").textContent=
formatTime(TIMER.seconds);

},1000);

}


function pauseTimer(){

TIMER.running=false;

clearInterval(TIMER.interval);

}


function finishTimer(){

pauseTimer();

let minutes=
Math.round(
TIMER.seconds/60
);


if(minutes<1){

alert("حداقل یک دقیقه مطالعه ثبت کن.");

return;

}


DATA.sessions.push({

date:today(),

minutes,

subject:$("studySubject").value,

topic:
$("studyTopic").value||
"مطالعه"

});


if(
DATA.lastStudy!==today()
){

DATA.streak++;

DATA.lastStudy=today();

}


TIMER.seconds=0;

save();

renderStudy();

}


function startPomodoro(){

let minutes=
Number(DATA.profile.pomodoro)||50;

TIMER.seconds=
minutes*60;

startTimer();

}

function saveTest(){

let subject=
$("testSubject").value;

let topic=
$("testTopic").value;


let count=
Number($("testCount").value)||0;

let correct=
Number($("testCorrect").value)||0;

let wrong=
Number($("testWrong").value)||0;

let blank=
Number($("testBlank").value)||0;


if(count<1){

alert("تعداد تست را وارد کن.");

return;

}


let total=
correct+wrong+blank;


if(total>count){

alert("جمع درست، غلط و نزده بیشتر از تعداد تست است.");

return;

}


let accuracy=
Math.round(
(correct/count)*100
);


DATA.tests.push({

date:today(),

subject,

topic,

count,

correct,

wrong,

blank,

accuracy

});


if(
accuracy<60 ||
wrong>correct
){

DATA.mistakes.push({

date:today(),

subject,

topic:topic||"آزمون",

cause:$("testCause").value,

reviewed:false

});

}


save();

alert("نتیجه با موفقیت ثبت شد.");

renderTests();

}

/* BACKUP */

function backup(){

let blob=
new Blob(
[
JSON.stringify(
DATA,
null,
2
)
],
{
type:"application/json"
}
);


let a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"StudyCoach-Ultimate-Backup.json";

a.click();

URL.revokeObjectURL(a.href);

}


function restore(event){

let file=
event.target.files[0];

if(!file)return;


let reader=
new FileReader();


reader.onload=()=>{

try{

let imported=
JSON.parse(
reader.result
);


if(
!imported.profile ||
!imported.subjects
){

throw new Error();

}


DATA=imported;

save();

location.reload();

}

catch(e){

alert(
"فایل پشتیبان معتبر نیست."
);

}

};


reader.readAsText(file);

}


function resetAll(){

if(
!confirm(
"تمام اطلاعات برنامه حذف شود؟"
)
)return;


localStorage.removeItem(KEY);

location.reload();

}


/* START */

if(DATA.profile.dark){

document.body.classList.add("dark");

}


go(
"home",
document.querySelector("nav button")
);

</script>
