<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyCoach">
  <meta name="description" content="مشاور هوشمند مطالعه و کنکور">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>StudyCoach V5</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn">
      ☰
    </button>
    <div>
      <div class="brand">
        StudyCoach
        <span>V5</span>
      </div>
      <div class="subtitle">
        مشاور هوشمند مطالعه
      </div>
    </div>
    <button class="icon-btn" id="themeBtn">
      ☾
    </button>
  </header>
  <aside id="sidebar" class="sidebar">
    <button data-page="dashboard" class="nav-item active">
      🏠 داشبورد
    </button>
    <button data-page="planner" class="nav-item">
      📅 برنامه‌ریزی
    </button>
    <button data-page="subjects" class="nav-item">
      📚 دروس
    </button>
    <button data-page="tasks" class="nav-item">
      ✅ وظایف
    </button>
    <button data-page="mistakes" class="nav-item">
      ❌ دفترچه اشتباهات
    </button>
    <button data-page="review" class="nav-item">
      🔁 مرور هوشمند
    </button>
    <button data-page="tests" class="nav-item">
      📝 آزمون و تست
    </button>
    <button data-page="ai" class="nav-item">
      🤖 AI Coach
    </button>
    <button data-page="profile" class="nav-item">
      👤 پروفایل
    </button>
    <button data-page="settings" class="nav-item">
      ⚙️ تنظیمات
    </button>
  </aside>
  <main id="main" class="main"></main>
  <div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
