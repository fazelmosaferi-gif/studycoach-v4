<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyCoach">
<title>StudyCoach Ultimate</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#f4f7fb;--card:#fff;--text:#101828;--muted:#667085;
 --line:#e4e7ec;--primary:#111827;--soft:#eef2f6;
 --blue:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#d97706
}
body.dark{
 --bg:#070b13;--card:#111827;--text:#f8fafc;--muted:#94a3b8;
 --line:#273244;--primary:#f8fafc;--soft:#1e293b
}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
 line-height:1.7
}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:12px;padding:10px 14px;background:var(--soft);color:var(--text);cursor:pointer}
button:active{transform:scale(.98)}
.primary{background:var(--primary);color:var(--bg)}
.danger{background:#fee2e2;color:#991b1b}
header{
 position:sticky;top:0;z-index:20;background:var(--bg);
 border-bottom:1px solid var(--line);padding:10px 13px;
 display:flex;justify-content:space-between;align-items:center
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
 width:43px;height:43px;border-radius:14px;background:var(--primary);
 color:var(--bg);display:grid;place-items:center;font-size:22px
}
.brand small{display:block;color:var(--muted);font-size:10px}
main{max-width:1150px;margin:auto;padding:14px 12px 105px}
.card{
 background:var(--card);border:1px solid var(--line);
 border-radius:20px;padding:16px;margin-bottom:13px
}
.hero{
 background:linear-gradient(135deg,#111827,#334155);
 color:white;display:flex;justify-content:space-between;gap:15px
}
.hero p{color:#cbd5e1}
.pill{border:1px solid #ffffff44;border-radius:99px;padding:3px 9px;font-size:11px}
.score{text-align:center;min-width:115px}
.score b{display:block;font-size:40px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.stat{text-align:center}
.stat b{display:block;font-size:24px}
.muted{color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.form{display:grid;gap:9px}
input,select,textarea{
 width:100%;padding:11px;border:1px solid var(--line);
 border-radius:12px;background:var(--card);color:var(--text)
}
textarea{resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.item{
 display:flex;align-items:center;gap:10px;padding:11px 0;
 border-bottom:1px solid var(--line)
}
.item:last-child{border-bottom:0}
.grow{flex:1}
.item small{display:block;color:var(--muted);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#98a2b3}
.done{opacity:.45;text-decoration:line-through}
.done .dot{background:var(--green)}
.advice{background:var(--soft);padding:13px;border-radius:15px}
.clock{
 direction:ltr;text-align:center;font-size:48px;
 font-weight:800;margin:18px 0
}
.msg{padding:11px 13px;border-radius:15px;margin:7px 0}
.msg.u{background:var(--primary);color:var(--bg);margin-right:15%}
.msg.b{background:var(--soft);margin-left:8%}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.chip{
 display:inline-block;padding:5px 9px;border-radius:99px;
 background:#e0e7ff;color:#3730a3;margin:3px;font-size:12px
}
.empty{text-align:center;color:var(--muted);padding:20px}
.center{text-align:center}
.badge{
 display:inline-block;padding:3px 8px;border-radius:99px;
 background:var(--soft);font-size:11px
}
#toast{
 position:fixed;top:14px;left:50%;z-index:100;
 transform:translate(-50%,-20px);opacity:0;
 background:#111827;color:white;padding:9px 15px;
 border-radius:12px;transition:.25s
}
#toast.show{opacity:1;transform:translate(-50%,0)}
nav{
 position:fixed;bottom:7px;left:50%;transform:translateX(-50%);
 width:min(1120px,calc(100% - 12px));background:#111827;
 border-radius:20px;padding:7px;display:grid;
 grid-template-columns:repeat(8,1fr);z-index:30;
 box-shadow:0 10px 35px #0005
}
nav button{background:transparent;color:#cbd5e1;padding:6px 2px;font-size:10px}
nav button.active{background:#334155;color:white}
@media(max-width:700px){
 .g4{grid-template-columns:repeat(2,1fr)}
 .g2{grid-template-columns:1fr}
 .hero{display:block}
 .score{text-align:right}
 nav button{font-size:8px}
}
</style>
</head>

<body>

<header>
 <div class="brand">
  <div class="logo">🧠</div>
  <div>
   <b>StudyCoach Ultimate</b>
   <small>رایگان · آفلاین · مخصوص مطالعه</small>
  </div>
 </div>
 <button onclick="toggleDark()">🌙</button>
</header>

<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>

<script>

/* =====================================================
   DATABASE
===================================================== */

const KEY="StudyCoachUltimate";

const DEFAULT={
 profile:{
  name:"",
  goal:"پزشکی",
  examDate:"",
  dailyHours:8,
  start:"07:00",
  breakMinutes:15
 },

 subjects:[
  {id:"bio",name:"زیست",level:3,priority:5},
  {id:"chem",name:"شیمی",level:2,priority:5},
  {id:"math",name:"ریاضی",level:2,priority:4},
  {id:"phys",name:"فیزیک",level:3,priority:4}
 ],

 topics:[],
 plans:[],
 sessions:[],
 tests:[],
 mistakes:[],
 reviews:[],
 messages:[],
 goals:[],
 achievements:[],
 lastStudy:"",
 streak:0,
 xp:0
};

let D=load();

function load(){
 try{
  return JSON.parse(localStorage.getItem(KEY)) || structuredClone(DEFAULT);
 }catch(e){
  return structuredClone(DEFAULT);
 }
}

function save(){
 localStorage.setItem(KEY,JSON.stringify(D));
}

function uid(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function today(){
 return new Date().toISOString().slice(0,10);
}

function fa(n){
 return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
}

function esc(x){
 return String(x??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function toast(x){
 let t=document.getElementById("toast");
 t.textContent=x;
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),1700);
}

function timeText(n){
 n=Math.max(0,Math.round(n||0));
 return `${fa(Math.floor(n/60))}:${String(n%60).padStart(2,"0")}`;
}

function avg(a){
 if(!a.length)return null;
 return Math.round(a.reduce((s,x)=>s+(+x.accuracy||0),0)/a.length);
}

/* =====================================================
   STATS
===================================================== */

function studyToday(){
 return D.sessions.filter(x=>x.date===today())
 .reduce((s,x)=>s+(+x.minutes||0),0);
}

function testsToday(){
 return D.tests.filter(x=>x.date===today());
}

function testCountToday(){
 return testsToday().reduce((s,x)=>s+(+x.count||0),0);
}

function accuracyToday(){
 return avg(testsToday());
}

function examDays(){
 if(!D.profile.examDate)return null;
 return Math.max(
  0,
  Math.ceil((new Date(D.profile.examDate)-new Date())/86400000)
 );
}

function subjectStat(s){

 let tests=D.tests.filter(x=>x.subject===s.name);
 let sessions=D.sessions.filter(x=>x.subject===s.name);
 let mistakes=D.mistakes.filter(x=>x.subject===s.name);

 let accuracy=avg(tests);
 let study=sessions.reduce((a,x)=>a+(+x.minutes||0),0);

 let base=accuracy===null
  ?50+s.level*7
  :accuracy;

 let score=base+(s.level*4)-(mistakes.length*2);

 return{
  accuracy,
  study,
  mistakes:mistakes.length,
  score:Math.max(0,Math.min(100,Math.round(score)))
 };
}

function weakest(){
 return D.subjects
  .map(s=>({...s,stat:subjectStat(s)}))
  .sort((a,b)=>a.stat.score-b.stat.score)[0];
}

/* =====================================================
   ADVISOR ENGINE
===================================================== */

function advisor(){

 if(!D.profile.name)
  return[
   "پروفایل",
   "نام و هدف خودت را ثبت کن تا مشاور شخصی‌سازی شود."
  ];

 let target=(D.profile.dailyHours||8)*60;
 let studied=studyToday();
 let acc=accuracyToday();

 let weak=weakest();

 let pending=D.plans.filter(
  x=>x.date===today()&&!x.done
 );

 let reviews=D.reviews.filter(
  x=>x.date<=today()&&!x.done
 );

 if(reviews.length)
  return[
   "مرور",
   `${fa(reviews.length)} مرور سررسید شده داری. اول مرورهای مهم را انجام بده.`
  ];

 if(acc!==null && acc<50)
  return[
   "کیفیت مهم‌تر از حجم",
   `دقت امروز ${fa(acc)}٪ است. تست بیشتر فعلاً اولویت نیست؛ غلط‌ها را تحلیل کن.`
  ];

 if(studied<target*.35 && new Date().getHours()>=14)
  return[
   "شروع فوری",
   `امروز فقط ${timeText(studied)} مطالعه ثبت شده. همین حالا یک جلسه کوتاه شروع کن.`
  ];

 if(weak.stat.score<55)
  return[
   "نقطه ضعف",
   `${weak.name} فعلاً ضعیف‌ترین درس ثبت‌شده است.`
  ];

 if(pending.length)
  return[
   "قدم بعدی",
   `${pending[0].subject} — ${pending[0].topic}`
  ];

 if(studied>=target*.9)
  return[
   "هدف تقریباً کامل",
   "هدف امروز تقریباً کامل شده؛ مرور اشتباهات را انجام بده."
  ];

 return[
  "ادامه بده",
  "جلسه بعدی را شروع کن و نتیجه را ثبت کن."
 ];
}

/* =====================================================
   NAV
===================================================== */

const PAGES=[
 ["home","🏠","خانه"],
 ["coach","🤖","مشاور"],
 ["plan","📅","برنامه"],
 ["study","⏱️","مطالعه"],
 ["tests","📝","تست"],
 ["mistakes","⚠️","اشتباهات"],
 ["analytics","📊","تحلیل"],
 ["settings","⚙️","تنظیمات"]
];

function navBuild(){
 document.getElementById("nav").innerHTML=PAGES.map(p=>`
  <button data-page="${p[0]}" onclick="openPage('${p[0]}')">
   ${p[1]}<br>${p[2]}
  </button>
 `).join("");
}

function openPage(p){

 document.querySelectorAll("nav button")
 .forEach(x=>x.classList.toggle(
  "active",x.dataset.page===p
 ));

 ({
  home,
  coach,
  plan,
  study,
  tests,
  mistakes,
  analytics,
  settings
 }[p]||home)();
}

/* =====================================================
   HOME
===================================================== */

function home(){

 let studied=studyToday();
 let target=(D.profile.dailyHours||8)*60;
 let progress=Math.min(100,Math.round(studied/Math.max(1,target)*100));
 let acc=accuracyToday();
 let a=advisor();

 document.getElementById("app").innerHTML=`

 <section class="card hero">

  <div>
   <span class="pill">V5 Ultimate</span>
   <h2>
    ${D.profile.name?"سلام "+esc(D.profile.name)+" 👋":"سلام 👋"}
   </h2>
   <p>${esc(D.profile.goal||"هدف تحصیلی خودت را ثبت کن.")}</p>
  </div>

  <div class="score">
   <b>${fa(progress)}٪</b>
   پیشرفت امروز
  </div>

 </section>

 <section class="grid g4">

  <div class="card stat">
   <b>${timeText(studied)}</b>
   <small>مطالعه</small>
  </div>

  <div class="card stat">
   <b>${fa(testCountToday())}</b>
   <small>تست</small>
  </div>

  <div class="card stat">
   <b>${acc===null?"—":fa(acc)+"٪"}</b>
   <small>دقت</small>
  </div>

  <div class="card stat">
   <b>${examDays()===null?"—":fa(examDays())}</b>
   <small>تا آزمون</small>
  </div>

 </section>

 <section class="card">

  <div class="head">
   <h3>📅 برنامه امروز</h3>
   <button class="primary" onclick="smartPlan()">
    برنامه هوشمند
   </button>
  </div>

  ${planList()}

 </section>

 <section class="card">

  <h3>🧠 تصمیم مشاور</h3>

  <div class="advice">
   <b>${a[0]}</b><br>${a[1]}
  </div>

 </section>

 <section class="card">

  <h3>🔄 مرورهای سررسیدشده</h3>

  ${reviewList()}

 </section>

 <section class="card">

  <h3>🏆 وضعیت انگیزشی</h3>

  <div class="grid g2">
   <div>
    <b>${fa(D.xp||0)} XP</b>
    <small class="muted">امتیاز</small>
   </div>
   <div>
    <b>🔥 ${fa(D.streak||0)}</b>
    <small class="muted">روز متوالی</small>
   </div>
  </div>

 </section>
 `;
}

function planList(){

 let list=D.plans.filter(x=>x.date===today());

 if(!list.length)
  return `<div class="empty">برنامه‌ای ساخته نشده.</div>`;

 return list.map(x=>`
  <div class="item ${x.done?"done":""}">
   <span class="dot"></span>

   <div class="grow">
    <b>${esc(x.start)} · ${esc(x.subject)}</b>
    <small>
     ${esc(x.topic)} · ${fa(x.duration)} دقیقه · ${esc(x.type)}
    </small>
   </div>

   <button onclick="togglePlan('${x.id}')">
    ${x.done?"✓":"انجام شد"}
   </button>
  </div>
 `).join("");
}

function togglePlan(i){

 let p=D.plans.find(x=>x.id===i);

 if(p){
  let was=p.done;
  p.done=!p.done;

  if(!was){
   D.xp=(D.xp||0)+10;
  }
 }

 save();
 home();
}

/* =====================================================
   SMART PLAN
===================================================== */

function smartPlan(){

 if(!D.profile.name){
  toast("ابتدا پروفایل را کامل کن");
  settings();
  return;
 }

 D.plans=D.plans.filter(x=>x.date!==today());

 let total=Math.max(
  120,
  (D.profile.dailyHours||8)*60
 );

 let current=toMin(D.profile.start||"07:00");
 let used=0;

 let subjects=D.subjects.map(s=>({
  ...s,
  stat:subjectStat(s)
 })).sort((a,b)=>{
  let A=(100-a.stat.score)+a.priority*10;
  let B=(100-b.stat.score)+b.priority*10;
  return B-A;
 });

 let i=0;

 while(used+45<=total && i<24){

  let s=subjects[i%subjects.length];

  let duration=
   s.stat.score<55?75:
   s.stat.score<70?60:50;

  duration=Math.min(duration,total-used);

  if(duration<45)break;

  let type=
   s.stat.score<55
    ?"یادگیری + رفع ضعف":
   i%3===1
    ?"تست + تحلیل":
    "مرور فعال";

  D.plans.push({
   id:uid(),
   date:today(),
   subject:s.name,
   topic:s.stat.score<55?"مبحث ضعیف":"مبحث فعلی",
   duration,
   type,
   start:toTime(current),
   done:false
  });

  used+=duration;
  current+=duration+(D.profile.breakMinutes||15);
  i++;
 }

 save();
 toast("برنامه هوشمند ساخته شد");
 home();
}

function toMin(t){
 let p=t.split(":").map(Number);
 return p[0]*60+p[1];
}

function toTime(n){
 return String(Math.floor(n/60)%24).padStart(2,"0")+":"+
        String(n%60).padStart(2,"0");
}

/* =====================================================
   PLAN PAGE
===================================================== */

function plan(){

 document.getElementById("app").innerHTML=`

 <section class="card">

  <div class="head">
   <h2>📅 برنامه تطبیقی</h2>
   <button class="primary" onclick="smartPlan()">بازسازی</button>
  </div>

  <p class="muted">
   برنامه بر اساس سطح درس، عملکرد تستی و هدف روزانه ساخته می‌شود.
  </p>

  ${planList()}

 </section>

 <section class="card">

  <h3>🔄 جبران عقب‌افتادگی</h3>

  <button onclick="recovery()">محاسبه جبران</button>

  <div id="rec" class="advice" style="margin-top:10px">
  </div>

 </section>
 `;
}

function recovery(){

 let list=D.plans
  .filter(x=>x.date===today()&&!x.done)
  .sort((a,b)=>b.duration-a.duration);

 let box=document.getElementById("rec");

 if(!list.length){
  box.textContent="جلسه عقب‌افتاده‌ای وجود ندارد 🎉";
  return;
 }

 let keep=list.slice(
  0,
  Math.max(1,Math.ceil(list.length*.6))
 );

 box.innerHTML=`
  <b>این جلسه‌ها را حفظ کن:</b><br>
  ${keep.map(x=>esc(x.subject)+" — "+esc(x.topic)).join("<br>")}
  <br><br>
  جلسه‌های کم‌اولویت را به فردا منتقل کن.
 `;
}

/* =====================================================
   COACH
===================================================== */

function coach(){

 let a=advisor();

 document.getElementById("app").innerHTML=`

 <section class="card">

  <h2>🤖 مشاور خصوصی</h2>

  <p class="muted">
   موتور مشاوره کاملاً داخل برنامه است و برای این قابلیت
   به API یا اشتراک پولی نیاز ندارد.
  </p>

  <div id="chat">

   ${
    D.messages.slice(-15).map(m=>`
     <div class="msg u">${esc(m.q)}</div>
     <div class="msg b">${esc(m.a)}</div>
    `).join("")
    ||
    `<div class="msg b">${esc(a[1])}</div>`
   }

  </div>

  <div class="form">

   <textarea id="question" rows="3"
    placeholder="مثلاً امروز دو ساعت عقب افتادم، چه کار کنم؟"></textarea>

   <button class="primary" onclick="askCoach()">
    پرسیدن
   </button>

  </div>

 </section>
 `;
}

function askCoach(){

 let q=document.getElementById("question").value.trim();

 if(!q)return;

 let weak=weakest();

 let pending=D.plans.filter(
  x=>x.date===today()&&!x.done
 );

 let reviews=D.reviews.filter(
  x=>x.date<=today()&&!x.done
 );

 let answer;

 if(/عقب|جبران|نرسید|نخوندم/.test(q)){

  answer=pending.length
   ?`اول «${pending[0].subject} — ${pending[0].topic}» را انجام بده. همه عقب‌افتادگی را یک‌جا فشرده نکن.`
   :"برنامه هوشمند را بازسازی کن.";

 }else if(/ضعف|ضعیف|کدام درس|کدوم درس/.test(q)){

  answer=
   `بر اساس داده‌های فعلی، ${weak.name} پایین‌ترین امتیاز عملکرد را دارد.`;

 }else if(/مرور|فراموش/.test(q)){

  answer=reviews.length
   ?`${fa(reviews.length)} مرور سررسید شده داری.`
   :"مرور عقب‌افتاده‌ای ثبت نشده.";

 }else if(/ساعت|مطالعه/.test(q)){

  answer=
   `امروز ${timeText(studyToday())} مطالعه ثبت شده و هدف روزانه ${fa(D.profile.dailyHours||8)} ساعت است.`;

 }else{

  answer=advisor()[1];

 }

 D.messages.push({
  date:today(),
  q,
  a:answer
 });

 save();
 coach();
}

/* =====================================================
   STUDY
===================================================== */

let TIMER={
 sec:0,
 running:false,
 interval:null
};

function study(){

 document.getElementById("app").innerHTML=`

 <section class="card center">

  <h2>⏱️ جلسه مطالعه</h2>

  <div class="form">

   <select id="studySubject">
    ${D.subjects.map(s=>`<option>${esc(s.name)}</option>`).join("")}
   </select>

   <input id="studyTopic" placeholder="مبحث">

  </div>

  <div id="clock" class="clock">
   ${clock()}
  </div>

  <div class="row" style="justify-content:center">

   <button class="primary" onclick="startTimer()">شروع</button>
   <button onclick="pauseTimer()">توقف</button>
   <button onclick="finishTimer()">ثبت جلسه</button>

  </div>

 </section>

 <section class="card">

  <h3>جلسات اخیر</h3>

  ${
   D.sessions.slice(-15).reverse().map(x=>`
    <div class="item">
     <div class="grow">
      <b>${esc(x.subject)}</b>
      <small>${esc(x.topic)} · ${fa(x.minutes)} دقیقه · ${x.date}</small>
     </div>
    </div>
   `).join("")
   ||
   `<div class="empty">هنوز جلسه‌ای ثبت نشده.</div>`
  }

 </section>
 `;
}

function clock(){

 let s=TIMER.sec;

 return[
  Math.floor(s/3600),
  Math.floor(s/60)%60,
  s%60
 ].map(x=>String(x).padStart(2,"0")).join(":");
}

function startTimer(){

 if(TIMER.running)return;

 TIMER.running=true;

 TIMER.interval=setInterval(()=>{

  TIMER.sec++;

  let c=document.getElementById("clock");

  if(c)c.textContent=clock();

 },1000);
}

function pauseTimer(){

 TIMER.running=false;
 clearInterval(TIMER.interval);
}

function finishTimer(){

 pauseTimer();

 let m=Math.round(TIMER.sec/60);

 if(m<1){
  toast("حداقل یک دقیقه ثبت کن");
  return;
 }

 let subject=document.getElementById("studySubject").value;
 let topic=document.getElementById("studyTopic").value.trim()||"مطالعه";

 D.sessions.push({
  id:uid(),
  date:today(),
  minutes:m,
  subject,
  topic
 });

 /* مرور فاصله‌دار */
 [1,3,7,14,30].forEach(n=>{

  let d=new Date();
  d.setDate(d.getDate()+n);

  D.reviews.push({
   id:uid(),
   date:d.toISOString().slice(0,10),
   subject,
   topic,
   done:false
  });

 });

 D.xp=(D.xp||0)+Math.max(5,Math.round(m/5));

 if(D.lastStudy!==today()){
  D.streak=(D.streak||0)+1;
  D.lastStudy=today();
 }

 TIMER.sec=0;

 save();

 toast("جلسه ثبت شد");
 study();
}

function saveTest(){

   topic,

   cause
  });

 D.xp=(D.xp||0)+Math.max(5,Math.round(count/5));

}

function errorStats(){

 let o={};

 D.mistakes.forEach(x=>{
  o[x.cause]=(o[x.cause]||0)+1;
 });

 let arr=Object.entries(o).sort((a,b)=>b[1]-a[1]);

 if(!arr.length)
  return `<div class="empty">داده‌ای وجود ندارد.</div>`;

 return arr.map(x=>
  `<span class="chip">${esc(x[0])}: ${fa(x[1])}</span>`
 ).join("");
}

function weekly(){

 let html="";

 for(let i=6;i>=0;i--){

  let d=new Date();
  d.setDate(d.getDate()-i);

  let date=d.toISOString().slice(0,10);

  let m=D.sessions
   .filter(x=>x.date===date)
   .reduce((s,x)=>s+x.minutes,0);

  html+=`

   <div class="item">

    <div class="grow">
     <b>${date}</b>

     <div class="bar">
      <i style="width:${Math.min(100,m/360*100)}%"></i>
     </div>
    </div>

    <strong>${timeText(m)}</strong>

   </div>

  `;
 }

 return html;
}

===================================================== */

function exportData(){

 let blob=new Blob(
  [JSON.stringify(D,null,2)],
  {type:"application/json"}
 );

 let a=document.createElement("a");

 a.href=URL.createObjectURL(blob);
 a.download="StudyCoach-Backup.json";
 a.click();

 setTimeout(()=>URL.revokeObjectURL(a.href),1000);

 toast("پشتیبان آماده شد");
}

function importData(input){

 let file=input.files[0];

 if(!file)return;

 let reader=new FileReader();

 reader.onload=()=>{

  try{

   let data=JSON.parse(reader.result);

   D=data;

   save();

   toast("اطلاعات بازیابی شد");

   home();

  }catch(e){

   toast("فایل معتبر نیست");

  }

 };

 reader.readAsText(file);
}

function resetAll(){

 if(!confirm("تمام اطلاعات پاک شود؟"))
  return;

 localStorage.removeItem(KEY);
 location.reload();
}
