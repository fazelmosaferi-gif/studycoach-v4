<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>StudyCoach V5 Ultimate</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#f4f7fb;
 --card:#fff;
 --text:#101828;
 --muted:#667085;
 --line:#e4e7ec;
 --primary:#111827;
 --soft:#eef2f6;
 --blue:#2563eb;
 --green:#16a34a;
 --red:#dc2626;
 --orange:#d97706;
}
body.dark{
 --bg:#080d18;
 --card:#111827;
 --text:#f8fafc;
 --muted:#94a3b8;
 --line:#263244;
 --primary:#f8fafc;
 --soft:#1e293b;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
 line-height:1.7;
}
header{
 position:sticky;
 top:0;
 z-index:20;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px;
 background:var(--bg);
 border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
 width:44px;height:44px;border-radius:14px;
 display:grid;place-items:center;
 background:var(--primary);
 color:var(--bg);
 font-size:23px;
}
.brand small{display:block;color:var(--muted);font-size:11px}
button{
 border:0;
 border-radius:12px;
 padding:10px 14px;
 background:var(--soft);
 color:var(--text);
 font:inherit;
 cursor:pointer;
}
.primary{background:var(--primary);color:var(--bg)}
.danger{background:#fee2e2;color:#991b1b}
main{
 max-width:1100px;
 margin:auto;
 padding:14px 12px 110px;
}
.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:20px;
 padding:16px;
 margin-bottom:13px;
}
.hero{
 background:linear-gradient(135deg,#0f172a,#334155);
 color:white;
 display:flex;
 justify-content:space-between;
 gap:20px;
}
.hero p{color:#cbd5e1}
.pill{
 display:inline-block;
 border:1px solid #ffffff40;
 border-radius:99px;
 padding:3px 9px;
 font-size:11px;
}
.score{text-align:center;min-width:120px}
.score b{display:block;font-size:40px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.stat{text-align:center}
.stat b{display:block;font-size:24px}
.muted{color:var(--muted)}
.head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}
input,select,textarea{
 width:100%;
 padding:11px;
 border:1px solid var(--line);
 border-radius:12px;
 background:var(--card);
 color:var(--text);
 font:inherit;
}
.form{display:grid;gap:9px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.item{
 display:flex;
 align-items:center;
 gap:10px;
 padding:11px 0;
 border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:0}
.grow{flex:1}
.item small{display:block;color:var(--muted);font-size:12px}
.dot{
 width:9px;height:9px;border-radius:50%;
 background:#98a2b3;
}
.done{opacity:.45;text-decoration:line-through}
.done .dot{background:var(--green)}
.bar{
 height:8px;
 background:var(--soft);
 border-radius:99px;
 overflow:hidden;
}
.bar i{
 display:block;
 height:100%;
 background:var(--blue);
}
.advice{
 background:var(--soft);
 padding:13px;
 border-radius:15px;
}
.clock{
 direction:ltr;
 text-align:center;
 font-size:48px;
 font-weight:800;
 margin:18px 0;
}
.msg{
 padding:11px 13px;
 border-radius:15px;
 margin:7px 0;
}
.msg.user{
 background:var(--primary);
 color:var(--bg);
 margin-right:15%;
}
.msg.bot{
 background:var(--soft);
 margin-left:8%;
}
.chip{
 display:inline-block;
 padding:5px 9px;
 border-radius:99px;
 background:#e0e7ff;
 color:#3730a3;
 margin:3px;
 font-size:12px;
}
.empty{
 text-align:center;
 color:var(--muted);
 padding:20px;
}
#toast{
 position:fixed;
 top:15px;
 left:50%;
 transform:translate(-50%,-20px);
 opacity:0;
 z-index:100;
 background:#111827;
 color:white;
 padding:9px 15px;
 border-radius:12px;
 transition:.25s;
}
#toast.show{
 opacity:1;
 transform:translate(-50%,0);
}
nav{
 position:fixed;
 bottom:7px;
 left:50%;
 transform:translateX(-50%);
 width:min(1080px,calc(100% - 12px));
 background:#111827;
 border-radius:20px;
 padding:7px;
 display:grid;
 grid-template-columns:repeat(8,1fr);
 z-index:30;
 box-shadow:0 10px 35px #0005;
}
nav button{
 background:transparent;
 color:#cbd5e1;
 padding:7px 2px;
 font-size:10px;
}
nav button.active{
 background:#334155;
 color:white;
}
@media(max-width:700px){
 .g4{grid-template-columns:repeat(2,1fr)}
 .g2{grid-template-columns:1fr}
 .hero{display:block}
 .score{text-align:right;margin-top:10px}
 nav button{font-size:9px}
}
</style>
</head>

<body>

<header>
 <div class="brand">
  <div class="logo">🧠</div>
  <div>
   <b>StudyCoach V5</b>
   <small>Ultimate · Free · Offline</small>
  </div>
 </div>

 <button onclick="toggleDark()">🌙</button>
</header>

<main id="app"></main>

<nav id="nav"></nav>

<div id="toast"></div>

<script>

/* =========================
   DATABASE
========================= */

const KEY="StudyCoachV5";

const DEFAULT={
 profile:{
  name:"",
  goal:"",
  examDate:"",
  dailyHours:8,
  start:"07:00",
  breakMinutes:15
 },

 subjects:[
  {id:"bio",name:"زیست",level:3,priority:5},
  {id:"chem",name:"شیمی",level:2,priority:5},
  {id:"math",name:"ریاضی",level:2,priority:4},
  {id:"phys",name:"فیزیک",level:3,priority:4}
 ],

 plans:[],
 sessions:[],
 tests:[],
 mistakes:[],
 reviews:[],
 messages:[],
 lastStudy:"",
 streak:0
};

let D=load();

function load(){
 try{
  return JSON.parse(localStorage.getItem(KEY)) || structuredClone(DEFAULT);
 }catch{
  return structuredClone(DEFAULT);
 }
}

function save(){
 localStorage.setItem(KEY,JSON.stringify(D));
}

function id(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function today(){
 return new Date().toISOString().slice(0,10);
}

function fa(n){
 return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
}

function esc(x){
 return String(x??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function minutesText(n){
 n=Math.round(n||0);
 return `${fa(Math.floor(n/60))}:${String(n%60).padStart(2,"0")}`;
}

function toast(text){
 let t=document.getElementById("toast");
 t.textContent=text;
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),1700);
}

/* =========================
   CALCULATIONS
========================= */

function todaySessions(){
 return D.sessions.filter(x=>x.date===today());
}

function todayTests(){
 return D.tests.filter(x=>x.date===today());
}

function studyToday(){
 return todaySessions().reduce((s,x)=>s+(+x.minutes||0),0);
}

function testCountToday(){
 return todayTests().reduce((s,x)=>s+(+x.count||0),0);
}

function average(arr){
 if(!arr.length)return null;
 return Math.round(
  arr.reduce((s,x)=>s+(+x.accuracy||0),0)/arr.length
 );
}

function accuracyToday(){
 return average(todayTests());
}

function examDays(){
 if(!D.profile.examDate)return null;

 return Math.max(
  0,
  Math.ceil(
   (new Date(D.profile.examDate)-new Date())/86400000
  )
 );
}

function subjectStats(subject){

 let tests=D.tests.filter(x=>x.subject===subject.name);

 let sessions=D.sessions.filter(x=>x.subject===subject.name);

 let mistakes=D.mistakes.filter(x=>x.subject===subject.name);

 let acc=average(tests);

 let study=sessions.reduce(
  (s,x)=>s+(+x.minutes||0),0
 );

 let score=acc===null
  ? 50+subject.level*8
  : acc+subject.level*4-mistakes.length*2;

 return{
  accuracy:acc,
  study,
  mistakes:mistakes.length,
  score:Math.max(0,Math.min(100,Math.round(score)))
 };
}

function weakestSubject(){

 return D.subjects
  .map(s=>({...s,stats:subjectStats(s)}))
  .sort((a,b)=>a.stats.score-b.stats.score)[0];
}

/* =========================
   ADVISOR
========================= */

function advisor(){

 if(!D.profile.name){
  return[
   "پروفایل ناقص",
   "ابتدا نام و هدف اصلی خودت را ثبت کن."
  ];
 }

 let target=(D.profile.dailyHours||8)*60;
 let studied=studyToday();
 let acc=accuracyToday();

 let weak=weakestSubject();

 let open=D.plans.filter(
  x=>x.date===today()&&!x.done
 );

 let reviews=D.reviews.filter(
  x=>x.date<=today()&&!x.done
 );

 if(reviews.length){
  return[
   "مرور در اولویت",
   `${fa(reviews.length)} مرور سررسید شده داری.`
  ];
 }

 if(acc!==null && acc<50){
  return[
   "کیفیت قبل از حجم",
   `دقت امروز ${fa(acc)}٪ است. ابتدا غلط‌ها را تحلیل کن.`
  ];
 }

 if(
  studied<target*.35 &&
  new Date().getHours()>=14
 ){
  return[
   "شروع فوری",
   `امروز ${minutesText(studied)} مطالعه ثبت شده. همین الان یک جلسه کوتاه شروع کن.`
  ];
 }

 if(weak.stats.score<55){
  return[
   "نقطه‌ضعف",
   `${weak.name} فعلاً ضعیف‌ترین درس ثبت‌شده است.`
  ];
 }

 if(open.length){
  return[
   "قدم بعدی",
   `${open[0].subject} — ${open[0].topic}`
  ];
 }

 if(studied>=target*.9){
  return[
   "هدف تقریباً کامل",
   "هدف امروز تقریباً کامل شده؛ مرور اشتباهات را انجام بده."
  ];
 }

 return[
  "ادامه بده",
  "جلسه بعدی را شروع کن و نتیجه را ثبت کن."
 ];
}

/* =========================
   NAVIGATION
========================= */

const pages=[
 ["home","🏠","خانه"],
 ["coach","🤖","مشاور"],
 ["plan","📅","برنامه"],
 ["study","⏱️","مطالعه"],
 ["tests","📝","تست"],
 ["mistakes","⚠️","اشتباهات"],
 ["analytics","📊","تحلیل"],
 ["settings","⚙️","پروفایل"]
];

function buildNav(){

 document.getElementById("nav").innerHTML=
 pages.map(p=>`
 <button data-page="${p[0]}" onclick="openPage('${p[0]}')">
 ${p[1]}<br>${p[2]}
 </button>
 `).join("");
}

function openPage(name){

 document.querySelectorAll("nav button")
 .forEach(x=>x.classList.toggle(
  "active",
  x.dataset.page===name
 ));

 ({
  home,
  coach,
  plan,
  study,
  tests,
  mistakes,
  analytics,
  settings
 }[name]||home)();
}

/* =========================
   HOME
========================= */

function home(){

 let studied=studyToday();

 let target=(D.profile.dailyHours||8)*60;

 let progress=Math.min(
  100,
  Math.round(studied/Math.max(1,target)*100)
 );

 let acc=accuracyToday();

 let ad=advisor();

 document.getElementById("app").innerHTML=`

 <section class="card hero">

  <div>

   <span class="pill">
    V5 Ultimate · کاملاً رایگان
   </span>

   <h2>
    ${D.profile.name
      ?"سلام "+esc(D.profile.name)+" 👋"
      :"سلام 👋"}
   </h2>

   <p>
    ${esc(
     D.profile.goal ||
     "هدف تحصیلی خودت را در پروفایل ثبت کن."
    )}
   </p>

  </div>

  <div class="score">
   <b>${fa(progress)}٪</b>
   پیشرفت امروز
  </div>

 </section>

 <section class="grid g4">

  <div class="card stat">
   <b>${minutesText(studied)}</b>
   <small>مطالعه امروز</small>
  </div>

  <div class="card stat">
   <b>${fa(testCountToday())}</b>
   <small>تست امروز</small>
  </div>

  <div class="card stat">
   <b>${acc===null?"—":fa(acc)+"٪"}</b>
   <small>دقت امروز</small>
  </div>

  <div class="card stat">
   <b>${examDays()===null?"—":fa(examDays())}</b>
   <small>تا آزمون</small>
  </div>

 </section>

 <section class="card">

  <div class="head">

   <h3>📅 برنامه امروز</h3>

   <button class="primary"
    onclick="smartPlan()">
    برنامه هوشمند
   </button>

  </div>

  ${plansHTML()}

 </section>

 <section class="card">

  <h3>🧠 تصمیم مشاور</h3>

  <div class="advice">

   <b>${ad[0]}</b><br>
   ${ad[1]}

  </div>

 </section>

 <section class="card">

  <h3>🔄 مرورهای سررسیدشده</h3>

  ${reviewHTML()}

 </section>

 `;
}

function plansHTML(){

 let list=D.plans.filter(
  x=>x.date===today()
 );

 if(!list.length)
  return `<div class="empty">
   برنامه‌ای ساخته نشده.
  </div>`;

 return list.map(x=>`

 <div class="item ${x.done?"done":""}">

  <span class="dot"></span>

  <div class="grow">

   <b>
    ${esc(x.start)} · ${esc(x.subject)}
   </b>

   <small>
    ${esc(x.topic)}
    · ${fa(x.duration)} دقیقه
    · ${esc(x.type)}
   </small>

  </div>

  <button onclick="togglePlan('${x.id}')">
   ${x.done?"✓":"انجام شد"}
  </button>

 </div>

 `).join("");
}

function togglePlan(i){

 let p=D.plans.find(x=>x.id===i);

 if(p)p.done=!p.done;

 save();
 home();
}

/* =========================
   SMART PLANNER
========================= */

function smartPlan(){

 if(!D.profile.name){
  toast("ابتدا پروفایل را کامل کن");
  settings();
  return;
 }

 D.plans=D.plans.filter(
  x=>x.date!==today()
 );

 let total=Math.max(
  120,
  (D.profile.dailyHours||8)*60
 );

 let current=timeToMinutes(
  D.profile.start||"07:00"
 );

 let used=0;

 let subjects=D.subjects
 .map(s=>({
  ...s,
  stats:subjectStats(s)
 }))
 .sort((a,b)=>{
  let A=(100-a.stats.score)+a.priority*10;
  let B=(100-b.stats.score)+b.priority*10;
  return B-A;
 });

 let i=0;

 while(
  used+45<=total &&
  i<24
 ){

  let s=subjects[i%subjects.length];

  let duration=
   s.stats.score<55
   ?75
   :s.stats.score<70
   ?60
   :50;

  duration=Math.min(
   duration,
   total-used
  );

  if(duration<45)break;

  let type=
   s.stats.score<55
   ?"یادگیری + رفع ضعف"
   :i%3===1
   ?"تست + تحلیل"
   :"مرور فعال";

  D.plans.push({

   id:id(),
   date:today(),
   subject:s.name,
   topic:
    s.stats.score<55
    ?"مبحث ضعیف"
    :"مبحث فعلی",

   duration,
   type,

   start:minutesToTime(current),

   done:false

  });

  used+=duration;

  current+=duration+
   (D.profile.breakMinutes||15);

  i++;
 }

 save();

 toast("برنامه هوشمند ساخته شد");

 home();
}

function timeToMinutes(t){

 let p=t.split(":").map(Number);

 return p[0]*60+p[1];

}

function minutesToTime(n){

 return String(Math.floor(n/60)%24)
 .padStart(2,"0")
 +":"
 +String(n%60).padStart(2,"0");

}

/* =========================
   PLAN
========================= */

function plan(){

 document.getElementById("app").innerHTML=`

 <section class="card">

  <div class="head">

   <h2>📅 برنامه تطبیقی</h2>

   <button class="primary"
    onclick="smartPlan()">
    بازسازی
   </button>

  </div>

  <p class="muted">
   برنامه بر اساس عملکرد، سطح و اولویت درس‌ها ساخته می‌شود.
  </p>

  ${plansHTML()}

 </section>

 <section class="card">

  <h3>🔄 جبران عقب‌افتادگی</h3>

  <button onclick="recovery()">
   محاسبه جبران
  </button>

  <div id="recovery"
   class="advice"
   style="margin-top:10px">
  </div>

 </section>

 `;

}

function recovery(){

 let list=D.plans
  .filter(x=>x.date===today()&&!x.done)
  .sort((a,b)=>b.duration-a.duration);

 if(!list.length){

  document.getElementById("recovery")
   .textContent=
   "جلسه عقب‌افتاده‌ای وجود ندارد 🎉";

  return;
 }

 let keep=list.slice(
  0,
  Math.max(1,Math.ceil(list.length*.6))
 );

 document.getElementById("recovery").innerHTML=
 `
 <b>جلسه‌های مهم را نگه دار:</b><br>
 ${keep.map(x=>
  esc(x.subject)+" — "+esc(x.topic)
 ).join("<br>")}
 <br><br>
 بقیه جلسه‌های کم‌اولویت را به روز بعد منتقل کن.
 `;
}

/* =========================
   COACH
========================= */

function coach(){

 let a=advisor();

 document.getElementById("app").innerHTML=`

 <section class="card">

  <h2>🤖 مشاور خصوصی آفلاین</h2>

  <p class="muted">
   بدون API، بدون اشتراک و بدون سرور.
   تصمیم‌ها بر اساس داده‌های ثبت‌شده روی دستگاه ساخته می‌شوند.
  </p>

  <div id="chat">

   ${
    D.messages.slice(-12).map(m=>`
     <div class="msg user">
      ${esc(m.q)}
     </div>

     <div class="msg bot">
      ${esc(m.a)}
     </div>
    `).join("")
    ||
    `<div class="msg bot">
     ${esc(a[1])}
    </div>`
   }

  </div>

  <div class="form">

   <textarea
    id="question"
    rows="3"
    placeholder="مثلاً امروز دو ساعت عقب افتادم، چه کار کنم؟">
   </textarea>

   <button
    class="primary"
    onclick="askCoach()">
    پرسیدن
   </button>

  </div>

 </section>

 `;

}

function askCoach(){

 let q=document
  .getElementById("question")
  .value.trim();

 if(!q)return;

 let weak=weakestSubject();

 let open=D.plans.filter(
  x=>x.date===today()&&!x.done
 );

 let reviews=D.reviews.filter(
  x=>x.date<=today()&&!x.done
 );

 let answer;

 if(/عقب|جبران|نرسید|نخوندم/.test(q)){

  answer=open.length
   ?`اول «${open[0].subject} — ${open[0].topic}» را انجام بده و همه عقب‌افتادگی را یک‌جا فشرده نکن.`
   :"ابتدا برنامه هوشمند را بساز.";

 }else if(/ضعف|ضعیف|کدام درس|کدوم درس/.test(q)){

  answer=
   `بر اساس داده‌های فعلی، ${weak.name} پایین‌ترین امتیاز عملکرد را دارد.`;

 }else if(/مرور|فراموش/.test(q)){

  answer=reviews.length
   ?`${fa(reviews.length)} مرور سررسید شده داری؛ آنها را انجام بده.`
   :"مرور عقب‌افتاده‌ای ثبت نشده.";

 }else if(/ساعت|مطالعه/.test(q)){

  answer=
   `امروز ${minutesText(studyToday())} مطالعه ثبت شده و هدف روزانه ${fa(D.profile.dailyHours||8)} ساعت است.`;

 }else{

  answer=advisor()[1];

 }

 D.messages.push({
  date:today(),
  q,
  a:answer
 });

 save();

 coach();
}

/* =========================
   STUDY TIMER
========================= */

let timer={
 seconds:0,
 running:false,
 interval:null
};

function study(){

 document.getElementById("app").innerHTML=`

 <section class="card">

  <h2>⏱️ جلسه مطالعه</h2>

  <div class="form">

   <select id="studySubject">

    ${D.subjects.map(s=>
     `<option>${esc(s.name)}</option>`
    ).join("")}

   </select>

   <input
    id="studyTopic"
    placeholder="مبحث">

  </div>

  <div id="clock"
   class="clock">
   ${clockText()}
  </div>

  <div class="row">

   <button class="primary"
    onclick="startTimer()">
    شروع
   </button>

   <button
    onclick="pauseTimer()">
    توقف
   </button>

   <button
    onclick="finishTimer()">
    ثبت جلسه
   </button>

  </div>

 </section>

 <section class="card">

  <h3>جلسات اخیر</h3>

  ${
   D.sessions.slice(-12).reverse()
   .map(x=>`

    <div class="item">

     <div class="grow">

      <b>${esc(x.subject)}</b>

      <small>
       ${esc(x.topic)}
       · ${fa(x.minutes)} دقیقه
       · ${x.date}
      </small>

     </div>

    </div>

   `).join("")
   ||
   `<div class="empty">
    هنوز جلسه‌ای ثبت نشده.
   </div>`
  }

 </section>

 `;

}

function clockText(){

 let s=timer.seconds;

 let h=Math.floor(s/3600);

 let m=Math.floor(s/60)%60;

 let sec=s%60;

 return [
  h,m,sec
 ].map(x=>String(x).padStart(2,"0"))
 .join(":");
}

function startTimer(){

 if(timer.running)return;

 timer.running=true;

 timer.interval=setInterval(()=>{

  timer.seconds++;

  let c=document.getElementById("clock");

  if(c)c.textContent=clockText();

 },1000);
}

function pauseTimer(){

 timer.running=false;

 clearInterval(timer.interval);
}

function finishTimer(){

 pauseTimer();

 let m=Math.round(timer.seconds/60);

 if(m<1){

  toast("حداقل یک دقیقه ثبت کن");

  return;
 }

 let subject=
  document.getElementById("studySubject").value;

 let topic=
  document.getElementById("studyTopic").value.trim()
  ||"مطالعه";

 D.sessions.push({
  id:id(),
  date:today(),
  minutes:m,
  subject,
  topic
 });

 /* spaced repetition */

 [1,3,7,14,30].forEach(days=>{

  let d=new Date();

  d.setDate(d.getDate()+days);

  D.reviews.push({
   id:id(),
   date:d.toISOString().slice(0,10),
   subject,
   topic,
   done:false
  });

 });

 if(D.lastStudy!==today()){

  D.streak=(D.streak||0)+1;

  D.lastStudy=today();
 }

 timer.seconds=0;

 save();

 toast("جلسه ثبت شد");

 study();
}

function saveTest(){

 let subject=
  document.getElementById("testSubject").value;

 let topic=
  document.getElementById("testTopic").value.trim()
  ||"نامشخص";

 let count=
  +document.getElementById("testCount").value;

 let accuracy=
  +document.getElementById("testAccuracy").value;

 let time=
  +document.getElementById("testTime").value||0;

 let cause=
  document.getElementById("testCause").value;

 if(
  !count ||
  accuracy<0 ||
  accuracy>100
 ){

  toast("اطلاعات را درست وارد کن");

  return;
 }

 D.tests.push({
  id:id(),
  date:today(),
  subject,
  topic,
  count,
  accuracy,
  time,
  cause
 });

 if(accuracy<60){

  D.mistakes.push({
   id:id(),
   date:today(),
   subject,
   topic,
   accuracy,
   cause
  });

 }

 save();

 toast("نتیجه ثبت شد");

 tests();
}

function errorStats(){

 let data={};

 D.mistakes.forEach(x=>{
  data[x.cause]=(data[x.cause]||0)+1;
 });

 let entries=Object.entries(data)
  .sort((a,b)=>b[1]-a[1]);

 if(!entries.length)
  return `<div class="empty">
   داده‌ای وجود ندارد.
  </div>`;

 return entries.map(x=>
  `<span class="chip">
   ${esc(x[0])}: ${fa(x[1])}
  </span>`
 ).join("");
}

function weeklyStats(){

 let html="";

 for(let i=6;i>=0;i--){

  let d=new Date();

  d.setDate(d.getDate()-i);

  let date=
   d.toISOString().slice(0,10);

  let mins=D.sessions
   .filter(x=>x.date===date)
   .reduce((s,x)=>s+x.minutes,0);

  html+=`

   <div class="item">

    <div class="grow">

     <b>${date}</b>

     <div class="bar">
      <i style="width:${Math.min(100,mins/360*100)}%"></i>
     </div>

    </div>

    <strong>
     ${minutesText(mins)}
    </strong>

   </div>

  `;

 }

 return html;
}

function changeSubject(id,key,value){

 let s=D.subjects.find(x=>x.id===id);

 if(!s)return;

 s[key]=Math.max(
  1,
  Math.min(5,+value||3)
 );

 save();

========================= */

function exportData(){

 let blob=new Blob(
  [JSON.stringify(D,null,2)],
  {type:"application/json"}
 );

 let a=document.createElement("a");

 a.href=URL.createObjectURL(blob);

 a.download="StudyCoach-V5-Backup.json";

 a.click();

 setTimeout(()=>{
  URL.revokeObjectURL(a.href);
 },1000);

 toast("فایل پشتیبان ساخته شد");
}

function importData(input){

 let file=input.files[0];

 if(!file)return;

 let reader=new FileReader();

 reader.onload=()=>{

  try{

   D=JSON.parse(reader.result);

   save();

   toast("اطلاعات بازیابی شد");

   home();

  }catch{

   toast("فایل معتبر نیست");

  }

 };

 reader.readAsText(file);
}

function resetAll(){

 if(!confirm("همه اطلاعات StudyCoach پاک شود؟"))
  return;

 localStorage.removeItem(KEY);

 location.reload();
}
